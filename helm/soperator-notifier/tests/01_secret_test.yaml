suite: test secret creation
release:
  name: test-name
  namespace: test-ns
templates:
  - templates/01_secret.yml
set:
  nameOverride: son
  slack:
    webhookUrl: &webhookUrl https://hooks.slack.com/services/XXXXXXXXXXX/YYYYYYYYYYY/ZZZZZZZZZZZZZZZZZZZZZZZZ

tests:
  - it: should render metadata
    asserts:
      - equal:
          path: metadata.name
          value: son-slack-webhook

  - it: should render secret value
    asserts:
      - equal:
          path: stringData["url"]
          value: *webhookUrl

  - it: should require a webhook URL
    set:
      slack.webhookUrl: null
    asserts:
      - failedTemplate:
          errorMessage: Slack Webhook URL must be provided.

  - it: should reject an empty webhook URL
    set:
      slack.webhookUrl: ""
    asserts:
      - failedTemplate:
          errorMessage: Slack Webhook URL must be provided.
