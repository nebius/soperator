suite: Bootstrap release readiness
templates:
  - templates/helmrelease.yaml
tests:
  - it: leaves readiness checks to child releases by default
    asserts:
      - equal:
          path: spec.install.disableWait
          value: true
      - equal:
          path: spec.upgrade.disableWait
          value: true
  - it: allows explicitly enabling readiness checks
    set:
      helmRelease.install.disableWait: false
      helmRelease.upgrade.disableWait: false
    asserts:
      - equal:
          path: spec.install.disableWait
          value: false
      - equal:
          path: spec.upgrade.disableWait
          value: false
