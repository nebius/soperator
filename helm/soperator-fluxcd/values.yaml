        retries: 3
    upgrade:
      remediation:
        retries: 3
        remediateLastFailure: true
    values:
      checks:
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      control-plane: soperatorchecks
