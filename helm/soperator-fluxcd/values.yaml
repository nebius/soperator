                scheme: http
            jobLabel: jobLabel
            namespaceSelector:
              matchNames:
                - kube-system
      kubeScheduler:
        enabled: false
      kubelet:
        enabled: true
        vmScrapes:
          kubelet:
            enabled: true
            spec:
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              honorLabels: true
              honorTimestamps: false
              interval: 30s
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid)
                - action: labeldrop
                  regex: (id|name)
                  source_labels:
                    - __name__
              relabelConfigs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(kubernetes_io_arch|node_kubernetes_io_instance_type)
                  replacement: ${1}
                - sourceLabels:
                    - __meta_kubernetes_node_name
                  targetLabel: instance
                - sourceLabels:
                    - __metrics_path__
                  targetLabel: metrics_path
                - replacement: kubelet
                  targetLabel: job
              scheme: https
              scrapeTimeout: 5s
              selector: {}
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true
          cadvisor:
            enabled: true
            spec:
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              honorLabels: true
              honorTimestamps: false
              interval: 30s
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid)
                - action: labeldrop
                  regex: (id|name)
                - action: drop
                  regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
                  source_labels:
                    - __name__
              path: /metrics/cadvisor
              relabelConfigs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(kubernetes_io_arch|node_kubernetes_io_instance_type)
                  replacement: ${1}
                - sourceLabels:
                    - __meta_kubernetes_node_name
                  targetLabel: instance
                - sourceLabels:
                    - __metrics_path__
                  targetLabel: metrics_path
                - replacement: kubelet
                  targetLabel: job
          probes:
            enabled: true
            spec:
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              honorLabels: true
              honorTimestamps: false
              interval: 30s
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid)
                - action: labeldrop
                  regex: (id|name)
                - action: drop
                  regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
                  source_labels:
                    - __name__
              path: /metrics/probes
              relabelConfigs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(kubernetes_io_arch|node_kubernetes_io_instance_type)
                  replacement: ${1}
                - sourceLabels:
                    - __meta_kubernetes_node_name
                  targetLabel: instance
                - sourceLabels:
                    - __metrics_path__
                  targetLabel: metrics_path
                - replacement: kubelet
                  targetLabel: job
              scheme: https
              scrapeTimeout: 5s
              selector: {}
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true
          resources:
            enabled: true
            spec:
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              honorLabels: true
              honorTimestamps: false
              interval: 30s
              metricRelabelConfigs:
                - action: labeldrop
                  regex: (uid)
                - action: labeldrop
                  regex: (id|name)
                - action: drop
                  regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
                  source_labels:
                    - __name__
              path: /metrics/resource
              relabelConfigs:
                - action: labelmap
                  regex: __meta_kubernetes_node_label_(kubernetes_io_arch|node_kubernetes_io_instance_type)
                  replacement: ${1}
                - sourceLabels:
                    - __meta_kubernetes_node_name
                  targetLabel: instance
                - sourceLabels:
                    - __metrics_path__
                  targetLabel: metrics_path
                - replacement: kubelet
                  targetLabel: job
              scheme: https
              scrapeTimeout: 5s
              selector: {}
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecureSkipVerify: true
      coreDns:
        enabled: false
      prometheus-node-exporter:
        enabled: true
        vmScrape:
          spec:
            # Legacy Endpoints truncate services with more than 1,000 backends.
            discoveryRole: endpointslice
        extraArgs: null
      victoria-metrics-operator:
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: victoria-metrics-operator
        resources:
          requests:
            cpu: 100m
        admissionWebhooks:
          enable: true
        crd:
          cleanup:
            enabled: false
          create: false
        operator:
          disable_prometheus_converter: false
          enable_converter_ownership: true
      vmagent:
        spec:
          nodeSelector:
            slurm.nebius.ai/nodeset: system
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vmagent
          extraArgs:
            promscrape.maxScrapeSize: "33554432"
            promscrape.dropOriginalLabels: "true"
            promscrape.streamParse: "true"
          # Supply the full destination list for deployments that export metrics.
          remoteWrite:
            - url: http://vmsingle-metrics-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/api/v1/write
          resources:
            requests:
              memory: 10Gi
              cpu: 5000m
            limits:
              memory: 10Gi
      vmalert:
        enabled: false
      vmsingle:
        spec:
          nodeSelector:
            slurm.nebius.ai/nodeset: system
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vmsingle
          extraArgs:
            dedup.minScrapeInterval: 30s
            maxLabelsPerTimeseries: "40"
            search.maxQueryLen: "18765"
            search.maxUniqueTimeseries: "500000"
          retentionPeriod: 30d
          storage:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 30Gi
          resources:
            requests:
              memory: 2Gi
              cpu: 1000m
            limits:
              memory: 2Gi
    # postRenderers: []
    driftDetection:
      mode: warn
  vmLogs:
