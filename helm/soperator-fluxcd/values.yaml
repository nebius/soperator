  timeout: 5m
  version: 2.0.0
  driftDetection:
    mode: warn
certManager:
  enabled: true
  interval: 5m
  timeout: 5m
  version: v1.20.*
  namespace: cert-manager-system
  releaseName: cert-manager
  values:
    # kubernetes.io/os is the chart's own default and has to be repeated here: setting
    # nodeSelector replaces it wholesale.
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/nodeset: system
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/component: controller
    resources:
      requests:
        cpu: 100m
    webhook:
      nodeSelector:
        kubernetes.io/os: linux
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: webhook
                    app.kubernetes.io/component: webhook
      resources:
        requests:
          cpu: 100m
    cainjector:
      nodeSelector:
        kubernetes.io/os: linux
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cainjector
                    app.kubernetes.io/component: cainjector
      resources:
        requests:
          cpu: 100m
    startupapicheck:
      # A one-shot Job, so it gets the pin but no anti-affinity term.
      nodeSelector:
        kubernetes.io/os: linux
        slurm.nebius.ai/nodeset: system
      resources:
        requests:
          cpu: 100m
  overrideValues: null
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  driftDetection:
    mode: warn
backup:
  enabled: true
  driftDetection:
    mode: warn
  interval: 5m
  timeout: 5m
  version: 4.8.*
  namespace: k8up-system
  releaseName: k8up
  values:
    cleanup:
      pullPolicy: IfNotPresent
      registry: cr.eu-north1.nebius.cloud/soperator-proxy-docker-io
      repository: alpine/k8s
      tag: 1.34.0
    nodeSelector:
      slurm.nebius.ai/nodeset: system
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8up
    resources:
      requests:
        cpu: 50m
  overrideValues: null
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  config:
    driftDetection:
      mode: warn
    enabled: true
    interval: 5m
    timeout: 5m
    version: 1.23.0
    releaseName: soperator-backups
    install:
      remediation:
        retries: 3
    upgrade:
      remediation:
        retries: 3
        remediateLastFailure: true
    values:
      secret:
        name: jail-backup
      bucket:
        endpoint: ""
        name: ""
mariadbOperator:
