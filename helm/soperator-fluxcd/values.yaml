    driftDetection:
      mode: warn
  nodeConfigurator:
    enabled: true
    interval: 5m
    timeout: 30m
    releaseName: soperator-node-configurator
    install:
      crds: Skip
      remediation:
        retries: 6
    upgrade:
      crds: Skip
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      rebooter:
        # Without a priority class the rebooter runs at 0 and loses a node's spare CPU budget to
        # whatever infrastructure Deployment lands there first, with no way to preempt it. The
        # class sits below every Slurm pod (the lowest is slurm-login at 100002) because this is a
        # DaemonSet on every node, not just the worker ones - it must never evict Slurm workloads.
        priorityClassName: soperator-rebooter
        priorityClass:
          create: true
          name: soperator-rebooter
          value: 100000
        resources:
          requests:
            memory: 200Mi
            cpu: 100m
          limits:
            memory: 200Mi
    overrideValues: null
    driftDetection:
      mode: warn
  monitoringDashboards:
    enabled: true
    interval: 5m
    timeout: 5m
    releaseName: soperator-monitoring-dashboards
    namespace: monitoring-system
    install:
      crds: Skip
      remediation:
        retries: 3
    upgrade:
      crds: Skip
      remediation:
        retries: 3
    overrideValues: null
    driftDetection:
      mode: warn
  driftDetection:
    mode: warn
