  dcgmExporter:
    enabled: true
    interval: 5m
    timeout: 30m
    version: 5.1.0
    namespace: soperator
    releaseName: soperator-dcgm-exporter
    valuesFrom: []
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    install:
      crds: CreateReplace
      remediation:
        retries: 6
    upgrade:
      crds: CreateReplace
      remediation:
        retries: 6
