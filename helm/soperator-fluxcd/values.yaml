              relabelings:
                - sourceLabels: [__meta_kubernetes_pod_name]
                  targetLabel: pod
                - replacement: otel-collector-events
                  targetLabel: collector
        config:
          receivers:
            k8sobjects:
              auth_type: serviceAccount
