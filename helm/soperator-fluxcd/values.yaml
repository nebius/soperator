                  topologyKey: kubernetes.io/hostname
                weight: 100
        rollout:
          rollingUpdate:
            maxUnavailable: 50%
          strategy: RollingUpdate
        tolerations: []
        extraVolumes:
          - name: varlibotelcol
            hostPath:
              path: /var/lib/otelcol-events
              type: DirectoryOrCreate
        extraVolumeMounts:
          - name: varlibotelcol
            mountPath: /var/lib/otelcol-events
        securityContext:
          runAsGroup: 10001
          runAsUser: 10001
        serviceAccount:
          create: true
        extraEnvs:
          - name: GOMAXPROCS
            value: "1"
          - name: K8S_NODE_NAME
