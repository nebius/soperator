                    tag_name: service_provider
                metadata:
                  - k8s.namespace.name
                  - k8s.node.name
                  - k8s.pod.name
                  - k8s.pod.uid
                  - k8s.pod.start_time
              filter:
                node_from_env_var: K8S_NODE_NAME
              passthrough: false
              pod_association:
                - sources:
                    - from: resource_attribute
                      name: k8s.pod.ip
                - sources:
