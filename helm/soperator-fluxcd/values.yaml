helmRepository:
  interval: 15m
  soperator:
    url: oci://cr.nebius.cloud/soperator
    type: oci
  kruise:
    url: oci://cr.nebius.cloud/soperator
    type: oci
  certManager:
    url: https://charts.jetstack.io
    type: default
  bedag:
    url: https://bedag.github.io/helm-charts
    type: default
  backup:
    url: https://k8up-io.github.io/k8up
    type: default
  mariadbOperator:
    url: https://helm.mariadb.com/mariadb-operator
    type: default
  opentelemetry:
    url: https://open-telemetry.github.io/opentelemetry-helm-charts
    type: default
  prometheusOperator:
    url: https://prometheus-community.github.io/helm-charts
    type: default
  victoriaMetrics:
    url: https://victoriametrics.github.io/helm-charts/
    type: default
  csiDriverNfs:
    url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    type: default
  nfsServer:
    url: oci://cr.nebius.cloud/soperator
    type: oci
ns:
  enabled: true
  interval: 5m
  timeout: 5m
  version: 2.0.0
  # postRenderers: []
  driftDetection:
    mode: warn
certManager:
  enabled: true
  interval: 5m
  timeout: 5m
  version: v1.21.*
  namespace: cert-manager-system
  releaseName: cert-manager
  dependsOn:
    - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    - name: >-
        {{ if and .Values.observability.enabled .Values.observability.prometheusOperator.enabled }} {{ include "soperator-fluxcd.fullname" . }}-prometheus-operator-crds {{ end }}
  defaultValues:
    enableCertificateOwnerRef: true
    startupapicheck:
      enabled: true
    crds:
      enabled: true
    global:
      leaderElection:
        namespace: '{{ .Values.certManager.namespace | default .Release.Namespace }}'
  prometheusValues:
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
  values:
    # kubernetes.io/os is the chart's own default and has to be repeated here: setting
    # nodeSelector replaces it wholesale.
    nodeSelector:
      kubernetes.io/os: linux
      slurm.nebius.ai/nodeset: system
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/component: controller
    resources:
      requests:
        cpu: 100m
    webhook:
      nodeSelector:
        kubernetes.io/os: linux
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: webhook
                    app.kubernetes.io/component: webhook
      resources:
        requests:
          cpu: 100m
    cainjector:
      nodeSelector:
        kubernetes.io/os: linux
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cainjector
                    app.kubernetes.io/component: cainjector
      resources:
        requests:
          cpu: 100m
    startupapicheck:
      # A one-shot Job, so it gets the pin but no anti-affinity term.
      nodeSelector:
        kubernetes.io/os: linux
        slurm.nebius.ai/nodeset: system
      resources:
        requests:
          cpu: 100m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  # postRenderers: []
  driftDetection:
    mode: warn
backup:
  enabled: true
  # postRenderers: []
  driftDetection:
    mode: warn
  interval: 5m
  timeout: 5m
  version: 4.8.*
  namespace: k8up-system
  releaseName: k8up
  dependsOn:
    - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    - name: '{{ if .Values.certManager.enabled }}{{ include "soperator-fluxcd.fullname" . }}-cert-manager{{ end }}'
    - name: >-
        {{ if and .Values.observability.enabled .Values.observability.prometheusOperator.enabled }} {{ include "soperator-fluxcd.fullname" . }}-prometheus-operator-crds {{ end }}
  defaultValues:
    image:
      registry: cr.nebius.cloud
      repository: soperator/k8up
      tag: v2.14.0-ca-fix
    k8up:
      backupImage:
        repository: cr.nebius.cloud/soperator/k8up
        tag: v2.13.1-ca-fix
      skipWithoutAnnotation: true
  prometheusValues:
    k8up:
      metrics:
        grafanaDashboard:
          additionalLabels:
            grafana_dashboard: "1"
          enabled: true
          namespace: '{{ .Values.observability.vmStack.namespace | default .Release.Namespace }}'
        prometheusRule:
          enabled: false
        serviceMonitor:
          enabled: true
    cleanup:
      pullPolicy: IfNotPresent
      registry: cr.nebius.cloud/soperator-proxy-docker-io
      repository: alpine/k8s
      tag: 1.36.4
  values:
    nodeSelector:
      slurm.nebius.ai/nodeset: system
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8up
    resources:
      requests:
        cpu: 50m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  config:
    # postRenderers: []
    driftDetection:
      mode: warn
    enabled: true
    interval: 5m
    timeout: 5m
    version: 1.23.0
    releaseName: soperator-backups
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    install:
      remediation:
        retries: 3
    upgrade:
      remediation:
        retries: 3
        remediateLastFailure: true
    values:
      secret:
        name: jail-backup
      bucket:
        endpoint: ""
        name: ""
mariadbOperator:
  enabled: true
  interval: 5m
  timeout: 5m
  version: 25.10.2
  namespace: mariadb-operator-system
  releaseName: mariadb-operator
  dependsOn:
    - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    - name: '{{ include "soperator-fluxcd.fullname" . }}-mariadb-operator-crds'
    - name: '{{ include "soperator-fluxcd.fullname" . }}-cert-manager'
  defaultValues:
    webhook:
      cert:
        certManager:
          enabled: true
      enabled: true
  values:
    nodeSelector:
      slurm.nebius.ai/nodeset: system
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mariadb-operator
    resources:
      requests:
        cpu: 100m
    webhook:
      nodeSelector:
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mariadb-operator-webhook
      resources:
        requests:
          cpu: 100m
    certController:
      nodeSelector:
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mariadb-operator-cert-controller
      resources:
        requests:
          cpu: 100m
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  crds:
    values: null
    install:
      crds: CreateReplace
      remediation:
        retries: 3
    upgrade:
      crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    # postRenderers: []
    driftDetection:
      mode: warn
  # postRenderers: []
  driftDetection:
    mode: warn
observability:
  enabled: true
  clusterName: soperator
  clusterId: ""
  publicEndpointEnabled: true
  publicEndpointTokenKind: secret
  logsProjectId: default-project-id
  metricsProjectId: default-project-id
  region: eu-north1
  # Source of the o11y write bearer token, consumed per `observability.publicEndpointTokenKind`:
  #   secret   - collectors reference a token Secret (e.g. maintained by the token writer, or created in Terraform)
  #   hostPath - collectors mount a host-provided token file directly
  tsaToken:
    secretName: o11y-writer-sa-token
    secretKey: accessToken
    hostPath: /mnt/cloud-metadata
    mountPath: /o11ytoken
    hostPathFilename: tsa-token
    writer:
      enabled: true
      interval: 5m
      version: 2.0.0
      # postRenderers: []
      driftDetection:
        mode: warn
      # Token source: `imds` fetches from IMDS_BASE_URL; `file` reads a mounted host token.
      source: imds
      # Namespaces to maintain the Secret in. Empty means enabled o11y consumer namespaces.
      namespaces: []
      image:
        repository: cr.nebius.cloud/soperator-proxy-docker-io/alpine/curl
        tag: "8.22.0"
        pullPolicy: IfNotPresent
      imdsBaseUrl: http://169.254.169.254
      hostNetwork: true
      tokenExpiryFile: ""
      refreshSafetyMarginSeconds: 900
      pollIntervalSeconds: 300
      nodeSelector:
        slurm.nebius.ai/nodeset: system
      # No affinity here: this Deployment is rendered inline and its pod label carries the
      # release name, so the anti-affinity selector is built in the template.
      resources:
        requests:
          cpu: 50m
  opentelemetry:
    enabled: true
    publicEndpoint: dns:///write.logging.eu-north1.nebius.cloud.:443
    namespace: logs-system
    extraHeaders: {}
    # These values are rendered as sending_queue.batch settings for the in-cluster (VictoriaLogs) exporters.
    # The chart intentionally does not use the batch processor for collector pipelines.
    # https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/44845#issuecomment-3877056774
    batch:
      timeout: 1s
      sendBatchSize: 2000
      sendBatchMaxSize: 5000
    # Batch settings for the public Cloud Logging exporter only.
    # Cloud Logging rejects requests with more than 1000 log records and the
    # collector drops rejected batches, so keep sendBatchMaxSize <= 1000.
    publicBatch:
      timeout: 1s
      sendBatchSize: 500
      sendBatchMaxSize: 1000
    # Exporter queue sizing shared by logs, events, and jail logs collectors.
    # queueSize is measured in telemetry items because exporter queues use sizer: items
    # (log records for logs/events), and it applies separately to each exporter.
    sendingQueue:
      queueSize: 30000
      numConsumers: 10
    metrics:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    logs:
      version: 0.149.*
      interval: 15m
      timeout: 30m
      install:
        remediation:
          retries: 6
      upgrade:
        remediation:
          retries: 6
          remediateLastFailure: true
      values:
        enableFileStorage: true
        useGoMemLimit: true
        jailLogs:
          enabled: true
          pollInterval: 30s
          enableFileStorage: true
          useGoMemLimit: true
          deleteAfterRead:
            enabled: true
            # Nebius O11y agent fork option; not part of upstream filelogreceiver.
            # Files are deleted only after they have not been modified for at least this duration.
            # Files are node-local (worker boot disk), so this is also the on-node debugging window.
            minAge: 4h
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 512Mi
        nodeLogs:
          enabled: true
          # Supplementary host group IDs for reading node logs; adm is 4 on Ubuntu.
          supplementalGroups:
            - 4
          resources:
            requests:
              memory: 200Mi
              cpu: 100m
            limits:
              memory: 200Mi
        resources:
          requests:
            memory: 200Mi
            cpu: 50m
          limits:
            memory: 200Mi
      overrideValues: null
      # postRenderers: []
      driftDetection:
        mode: warn
    events:
      version: 0.149.*
      interval: 5m
      timeout: 5m
      install:
        remediation:
          retries: 3
      upgrade:
        remediation:
          retries: 3
          remediateLastFailure: true
      values:
        enableFileStorage: true
        useGoMemLimit: true
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: opentelemetry-collector
                      component: standalone-collector
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 128Mi
      overrideValues: null
      # postRenderers: []
      driftDetection:
        mode: warn
  prometheusOperator:
    enabled: true
    interval: 5m
    timeout: 5m
    version: 19.1.*
    namespace: monitoring-system
    values: null
    # postRenderers: []
    driftDetection:
      mode: warn
  vmStack:
    enabled: true
    crds:
      interval: 5m
      timeout: 5m
      version: 0.10.1
      values: null
      install:
        crds: CreateReplace
        remediation:
          retries: 3
      upgrade:
        crds: CreateReplace
        remediation:
          retries: 3
          remediateLastFailure: true
      # postRenderers: []
      driftDetection:
        mode: warn
    interval: 5m
    timeout: 30m
    version: 0.80.*
    namespace: monitoring-system
    releaseName: metrics
    install:
      crds: Skip
      remediation:
        retries: 6
    upgrade:
      crds: Skip
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      kubeStateMetrics:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: slurm.nebius.ai/nodeset
                      operator: In
                      values:
                        - system
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: kube-state-metrics
        resources:
          requests:
            cpu: 100m
      grafana:
        image:
          tag: "13.1.4"
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: grafana
        resources:
          requests:
            cpu: 100m
      victoriaMetricsOperator:
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: victoria-metrics-operator
        resources:
          requests:
            cpu: 100m
      dashboardNamespaces:
        - '{{ .Values.slurmCluster.namespace | default .Release.Namespace }}'
        - '{{ .Values.soperator.namespace | default .Release.Namespace }}'
        - gpu-operator
        - '{{ .Values.observability.vmStack.namespace | default .Release.Namespace }}'
        - '{{ .Values.soperator.monitoringDashboards.namespace | default .Release.Namespace }}'
        - '{{ .Values.observability.vmLogs.namespace | default .Release.Namespace }}'
        - '{{ .Values.observability.opentelemetry.namespace | default .Release.Namespace }}'
      grafanaIni:
        feature_toggles:
          # Keep dashboard exports compatible with the o11y Classic JSON workflow.
          dashboardNewLayouts: false
        auth:
          disable_login_form: true
        auth.basic:
          enabled: true
        auth.anonymous:
          enabled: true
          org_name: Main Org.
          org_role: Admin
      vmagent:
        spec:
          nodeSelector:
            slurm.nebius.ai/nodeset: system
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vmagent
          extraArgs:
            promscrape.maxScrapeSize: "33554432"
            promscrape.dropOriginalLabels: "true"
            promscrape.streamParse: "true"
          externalLabels: {}
          remoteWriteSettings: {}
          remoteWrite:
            - url: 'http://vmsingle-metrics-victoria-metrics-k8s-stack.{{ .Values.observability.vmStack.namespace | default .Release.Namespace }}.svc.cluster.local.:8428/api/v1/write'
          resources:
            requests:
              memory: 10Gi
              cpu: 5000m
            limits:
              memory: 10Gi
          extraEnvs: []
          volumeMounts: []
          volumes: []
      vmsingle:
        spec:
          nodeSelector:
            slurm.nebius.ai/nodeset: system
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: vmsingle
          extraArgs:
            dedup.minScrapeInterval: 30s
            maxLabelsPerTimeseries: "40"
            search.maxQueryLen: "18765"
            search.maxUniqueTimeseries: "500000"
          retentionPeriod: 30d
          storage:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 30Gi
          resources:
            requests:
              memory: 2Gi
              cpu: 1000m
            limits:
              memory: 2Gi
      prometheusNodeExporter:
        enabled: true
        extraArgs: null
    overrideValues: null
    # postRenderers: []
    driftDetection:
      mode: warn
  vmLogs:
    enabled: true
    interval: 5m
    timeout: 5m
    version: 0.13.*
    namespace: logs-system
    releaseName: vm-logs
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    install:
      crds: CreateReplace
      remediation:
        retries: 3
    upgrade:
      crds: CreateReplace
      remediation:
        retries: 3
        remediateLastFailure: true
    values:
      dashboards:
        enabled: true
        labels:
          grafana_dashboard: "1"
      server:
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: victoria-logs-single
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 2Gi
        persistentVolume:
          enabled: true
          size: 30Gi
          accessModes:
            - ReadWriteOnce
        vmServiceScrape:
          enabled: true
      vector:
        enabled: false
    # postRenderers: []
    driftDetection:
      mode: warn
  dcgmExporter:
    enabled: true
    interval: 5m
    timeout: 30m
    version: 5.0.0
    namespace: soperator
    releaseName: soperator-dcgm-exporter
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    install:
      crds: CreateReplace
      remediation:
        retries: 6
    upgrade:
      crds: CreateReplace
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      validateToolkit: true
      daemonSet:
        nvidiaDcgmExporter:
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 128Mi
              cpu: 100m
    # postRenderers: []
    driftDetection:
      mode: warn
  ncclProfiles:
    enabled: false
    interval: 5m
    timeout: 5m
    version:
      bedag: 2.0.0
      opentelemetryCollector: 0.149.*
    install:
      crds: Skip
      remediation:
        retries: 3
    upgrade:
      crds: Skip
      remediation:
        retries: 3
        remediateLastFailure: true
    # postRenderers: []
    driftDetection:
      mode: warn
    releaseName: opentelemetry-collector-nccl-profiles
    configMapOverrideValues: null
    collectorOverrideValues: null
    values:
      # or nodeLocal
      mode: shared
      resources:
        requests:
          memory: 200Mi
          cpu: 500m
        limits:
          memory: 1Gi
      useGoMemLimit: true
      nebiusO11yAgentVersion: 2.0.10
      metricsEndpoint: http://vmsingle-metrics-victoria-metrics-k8s-stack:8428/opentelemetry/v1/metrics
      metricsExporterTimeout: 15s
      # These values are rendered as exporter sending_queue.batch settings.
      # The chart intentionally does not use the batch processor for collector pipelines.
      batch:
        timeout: 1s
        sendBatchSize: 2000
        sendBatchMaxSize: 5000
      # Measured in metric data points because the exporter queue uses sizer: items.
      sendingQueue:
        queueSize: 30000
        numConsumers: 10
      metrics:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
      dumpDir: /mnt/jail/opt/soperator-outputs/shared/nccl_profiles
      pollInterval: 30s
      exportLabels:
        slurmJobId: slurm_job_id
        slurmStepId: slurm_step_id
        hostnamePid: hostname_pid
      enableFileStorage: true
      deleteAfterRead:
        enabled: true
        # Nebius O11y agent fork option; not part of upstream filelogreceiver.
        # Files are deleted only after they have not been modified for at least this duration.
        minAge: 15m
slurmCluster:
  enabled: true
  interval: 5m
  timeout: 5m
  version: 5.0.0
  namespace: soperator
  releaseName: soperator
  values:
    clusterName: soperator
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  slurmClusterStorage:
    enabled: true
    releaseName: slurm-cluster-storage
    interval: 5m
    timeout: 30m
    values: null
    install:
      remediation:
        retries: 6
    upgrade:
      remediation:
        retries: 6
        remediateLastFailure: true
    # postRenderers: []
    driftDetection:
      mode: warn
  # postRenderers: []
  driftDetection:
    mode: warn
nodesets:
  enabled: false
  # postRenderers: []
  driftDetection:
    mode: warn
  interval: 5m
  timeout: 5m
  version: 5.0.0
  namespace: soperator
  releaseName: soperator-nodesets
  values:
    clusterName: ""
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
soperatorActiveChecks:
  enabled: true
  interval: 5m
  timeout: 120m
  version: 5.0.0
  releaseName: soperator-activechecks
  namespace: soperator
  values: null
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  # postRenderers: []
  driftDetection:
    mode: warn
soperator:
  enabled: true
  interval: 5m
  timeout: 5m
  version: 5.0.0
  namespace: "soperator-system"
  releaseName: soperator-controller
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    serviceMonitor:
      enabled: true
    certManager:
      enabled: true
    controllerManager:
      nodeSelector:
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    control-plane: controller-manager
      manager:
        env:
          isMariadbCrdInstalled: true
          isPrometheusCrdInstalled: true
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
  kruise:
    enabled: true
    interval: 5m
    timeout: 30m
    version: 1.9.1-custom
    releaseName: soperator-kruise
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
      - name: '{{ if .Values.certManager.enabled }}{{ include "soperator-fluxcd.fullname" . }}-cert-manager{{ end }}'
    install:
      crds: CreateReplace
      remediation:
        retries: 6
    upgrade:
      crds: CreateReplace
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      crds:
        managed: true
      daemon:
        # The chart runs the daemon from manager.image; only the pull policy is separate.
        image:
          pullPolicy: IfNotPresent
        nodeSelector: {}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: slurm.nebius.ai/nodeset
                      operator: In
                      values:
                        - worker
                        - controller
      manager:
        replicas: 2
        image:
          repository: cr.nebius.cloud/soperator/kruise-manager
          tag: v1.9.2-ca-fix
          pullPolicy: IfNotPresent
        # The chart exposes no manager.affinity, so the two replicas get the pin but no
        # anti-affinity term.
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 2Gi
      helmHooks:
        image:
          repository: cr.nebius.cloud/soperator/kruise-helm-hook
          tag: v0.1.0-ca-fix
      featureGates: "ImagePullJobGate=true,RecreatePodWhenChangeVCTInCloneSetGate=true,StatefulSetAutoResizePVCGate=true,StatefulSetAutoDeletePVC=true,PreDownloadImageForInPlaceUpdate=true,ResourceDistributionGate=true"
    # Flux HelmRelease spec.postRenderers. Every HelmRelease in this chart accepts this key next to
    # driftDetection. It is rendered with tpl, so patches may reference chart values such as
    # {{ .Values.slurmCluster.namespace }}. An override replaces the whole list.
    # Webhooks are patched by index: mutating 0 is mpod, validating 0-8 are the builtin-resource
    # webhooks of the kruise chart version above. Re-check the indexes when bumping the version.
    postRenderers:
      - kustomize:
          patches:
            - target:
                group: apps
                version: v1
                kind: DaemonSet
                name: kruise-daemon
              patch: |
                - op: add
                  path: /spec/updateStrategy
                  value:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 50%
            - target:
                kind: MutatingWebhookConfiguration
                name: kruise-mutating-webhook-configuration
              patch: |
                - op: replace
                  path: /webhooks/0/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
            - target:
                kind: ValidatingWebhookConfiguration
                name: kruise-validating-webhook-configuration
              patch: |
                - op: replace
                  path: /webhooks/0/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/1/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/2/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/3/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/4/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/5/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/6/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/7/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/8/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
    driftDetection:
      mode: warn
      # OpenKruise manages certificates and webhook definitions at runtime.
      ignore:
        - paths:
            - /data
            # Kruise replaces the Secret without preserving Helm/Flux metadata maps.
            - /metadata/labels
            - /metadata/annotations
          target:
            version: v1
            kind: Secret
            namespace: kruise-system
            name: kruise-webhook-certs
        - paths:
            - /metadata/annotations/template
            - /webhooks
          target:
            group: admissionregistration.k8s.io
            version: v1
            kind: "(Mutating|Validating)WebhookConfiguration"
            name: "kruise-(mutating|validating)-webhook-configuration"
        - paths:
            - /spec/conversion/webhook/clientConfig
          target:
            group: apiextensions.k8s.io
            version: v1
            kind: CustomResourceDefinition
            name: "(daemonsets|sidecarsets)\\.apps\\.kruise\\.io"
  soperatorChecks:
    enabled: true
    interval: 5m
    timeout: 5m
    releaseName: soperator-checks
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-soperator'
    install:
      remediation:
        retries: 3
    upgrade:
      remediation:
        retries: 3
        remediateLastFailure: true
    values:
      checks:
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      control-plane: soperatorchecks
    # postRenderers: []
    driftDetection:
      mode: warn
  nodeConfigurator:
    enabled: true
    interval: 5m
    timeout: 30m
    releaseName: soperator-node-configurator
    install:
      crds: Skip
      remediation:
        retries: 6
    upgrade:
      crds: Skip
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      # Older nodeconfigurator charts use this key for the custom container.
      nodeConfigurator:
        enabled: false
      rebooter:
        enabled: true
        generateRBAC: true
        logFormat: json
        tolerations:
          - operator: Exists
        # Without a priority class the rebooter runs at 0 and loses a node's spare CPU budget to
        # whatever infrastructure Deployment lands there first, with no way to preempt it. The
        # class sits below every Slurm pod (the lowest is slurm-login at 100002) because this is a
        # DaemonSet on every node, not just the worker ones - it must never evict Slurm workloads.
        priorityClassName: soperator-rebooter
        priorityClass:
          create: true
          name: soperator-rebooter
          value: 100000
        resources:
          requests:
            memory: 200Mi
            cpu: 100m
          limits:
            memory: 200Mi
    # postRenderers: []
    driftDetection:
      mode: warn
  monitoringDashboards:
    enabled: true
    interval: 5m
    timeout: 5m
    releaseName: soperator-monitoring-dashboards
    namespace: monitoring-system
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    install:
      crds: Skip
      remediation:
        retries: 3
    upgrade:
      crds: Skip
      remediation:
        retries: 3
    values: null
    # postRenderers: []
    driftDetection:
      mode: warn
  # postRenderers: []
  driftDetection:
    mode: warn
