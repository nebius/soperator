                      name: k8s.pod.uid
                - sources:
                    - from: connection
              wait_for_metadata: true
              wait_for_metadata_timeout: 30s
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            transform:
