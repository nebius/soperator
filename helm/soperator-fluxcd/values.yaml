                    app.kubernetes.io/name: mariadb-operator-cert-controller
      resources:
        requests:
          cpu: 100m
  overrideValues: null
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      remediateLastFailure: true
  crds:
