          - '--metric-allowlist=kube_node_labels'
          - '--metric-allowlist=kube_persistentvolume_info'
          - '--metric-allowlist=kube_persistentvolume_capacity_bytes'
          - '--metric-allowlist=kube_persistentvolumeclaim_info'
          - '--metric-allowlist=kube_persistentvolumeclaim_resource_requests_storage_bytes'
          - '--metric-allowlist=kube_persistentvolumeclaim_status_phase'
          - '--metric-labels-allowlist=nodes=[nebius.com/driverful,nebius.com/gpu,nebius.com/gpu-name,nebius.com/node-group-id,topology.nebius.com/nvl-instance-group-id,nebius.com/resource-preset,slurm.nebius.ai/nodeset,slurm.nebius.ai/nodeset-name,slurm.nebius.ai/workload]'
        rbac:
          extraRules:
            - apiGroups:
                - slurm.nebius.ai
              resources:
                - slurmclusters
              verbs:
                - get
                - list
                - watch
        customResourceState:
          enabled: true
          config:
            kind: CustomResourceStateMetrics
            spec:
              resources:
                - groupVersionKind:
                    group: slurm.nebius.ai
                    version: v1
                    kind: SlurmCluster
                  metrics:
                    # Info metric for static fields like crVersion
                    - name: slurmcluster_info
                      help: "Basic static information about the SlurmCluster resource"
                      each:
                        type: Info
                        info:
                          labelsFromPath:
                            name: [metadata, name]
                            namespace: [metadata, namespace]
                            cr_version: [spec, crVersion]
                    # Gauge metrics for all numeric counters
                    - name: slurmcluster_slurmconfig_max_job_count
                      help: "Max job count from spec.slurmConfig.maxJobCount"
                      each:
                        type: Gauge
                        gauge:
                          path: [spec, slurmConfig, maxJobCount]
                    - name: slurmcluster_slurmconfig_message_timeout
                      help: "Message timeout from spec.slurmConfig.messageTimeout"
                      each:
                        type: Gauge
                        gauge:
                          path: [spec, slurmConfig, messageTimeout]
                    - name: slurmcluster_slurmconfig_min_job_age
                      help: "Min job age from spec.slurmConfig.minJobAge"
                      each:
                        type: Gauge
                        gauge:
                          path: [spec, slurmConfig, minJobAge]
                    - name: slurmcluster_slurmnodes_login_size
                      help: "Login node count from spec.slurmNodes.login.size"
                      each:
                        type: Gauge
                        gauge:
                          path: [spec, slurmNodes, login, size]
                    - name: slurmcluster_slurmnodes_rest_size
                      help: "Rest node count from spec.slurmNodes.rest.size"
                      each:
                        type: Gauge
                        gauge:
                          path: [spec, slurmNodes, rest, size]
                    - name: slurmcluster_slurmnodes_worker_size
                      help: "Worker node count from spec.slurmNodes.worker.size"
                      each:
                        type: Gauge
                        gauge:
                          path: [spec, slurmNodes, worker, size]
                    - name: slurmcluster_ready_login
                      help: "Ready login nodes from status.readyLogin"
                      each:
                        type: Gauge
                        gauge:
                          path: [status, readyLogin]
                    - name: slurmcluster_ready_sconfig_controller
                      help: "Ready SConfigController nodes from status.readySConfigController"
                      each:
                        type: Gauge
                        gauge:
                          path: [status, readySConfigController]
                    - name: slurmcluster_ready_workers
                      help: "Ready workers from status.readyWorkers"
                      each:
                        type: Gauge
                        gauge:
                          path: [status, readyWorkers]
                    # Gauge for list of conditions
                    - name: slurmcluster_status_condition_status
                      help: "SlurmCluster conditions status"
                      each:
                        type: Gauge
                        gauge:
                          path: [status, conditions]
                          labelsFromPath:
                            type: ["type"]
                          valueFrom: ["status"]
                    # StateSet for status.phase
                    - name: slurmcluster_status_phase
                      help: "Current phase of the SlurmCluster resource"
                      each:
                        type: StateSet
                        stateSet:
                          labelName: phase
                          path: [status, phase]
                          list: ["Available", "Reconciling", "Not available"]
        prometheusScrape: false
        selfMonitor:
          enabled: true
        collectors:
          - pods
          - nodes
          - persistentvolumes
          - persistentvolumeclaims
        # The victoria-metrics-k8s-stack chart reads this scrape config from the `vmScrape` key,
        # see https://github.com/VictoriaMetrics/helm-charts/blob/victoria-metrics-k8s-stack-0.80.0/charts/victoria-metrics-k8s-stack/templates/servicemonitors.yaml
        # Endpoints here fully replace the chart's default list.
        vmScrape:
          spec:
            endpoints:
              - honorLabels: true
                metricRelabelConfigs:
                  - action: drop
                    if:
                      - 'kube_node_spec_taint{key!="node.kubernetes.io/unschedulable"}'
                      - 'kube_node_spec_taint{effect!="NoSchedule"}'
                  - action: labeldrop
                    regex: (uid|container_id|image_id)
                port: http
              - honorLabels: true
                metricRelabelConfigs:
                  - action: labeldrop
                    regex: (uid|container_id|image_id)
                port: metrics
            jobLabel: app.kubernetes.io/name
      kubeControllerManager:
        enabled: false
      kubeEtcd:
        enabled: false
      kubeProxy:
        enabled: false
        vmScrape:
          spec:
            endpoints:
              - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
