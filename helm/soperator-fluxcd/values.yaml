soperator:
  enabled: true
  interval: 5m
  timeout: 5m
  version: 5.1.0
  namespace: "soperator-system"
  releaseName: soperator-controller
  valuesFrom:
    - kind: ConfigMap
      name: terraform-soperator
      optional: true
      valuesKey: values.yaml
    - kind: ConfigMap
      name: soperator
      optional: true
      valuesKey: values.yaml
  dependsOn:
    - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    - name: '{{ if .Values.soperator.kruise.enabled }}{{ include "soperator-fluxcd.fullname" . }}-kruise{{ end }}'
    - name: '{{ if .Values.certManager.enabled }}{{ include "soperator-fluxcd.fullname" . }}-cert-manager{{ end }}'
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    serviceMonitor:
      enabled: true
    certManager:
      enabled: true
    controllerManager:
      nodeSelector:
        slurm.nebius.ai/nodeset: system
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    control-plane: controller-manager
      manager:
        env:
          isMariadbCrdInstalled: true
          isPrometheusCrdInstalled: true
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
  kruise:
    enabled: true
    interval: 5m
    timeout: 30m
    version: 1.9.1-custom
    releaseName: soperator-kruise
    valuesFrom:
      - kind: ConfigMap
        name: terraform-kruise
        optional: true
        valuesKey: values.yaml
      - kind: ConfigMap
        name: kruise
        optional: true
        valuesKey: values.yaml
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
      - name: '{{ if .Values.certManager.enabled }}{{ include "soperator-fluxcd.fullname" . }}-cert-manager{{ end }}'
    install:
      crds: CreateReplace
      remediation:
        retries: 6
    upgrade:
      crds: CreateReplace
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      crds:
        managed: true
      daemon:
        # The chart runs the daemon from manager.image; only the pull policy is separate.
        image:
          pullPolicy: IfNotPresent
        nodeSelector: {}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: slurm.nebius.ai/nodeset
                      operator: In
                      values:
                        - worker
                        - controller
      manager:
        replicas: 2
        image:
          repository: cr.nebius.cloud/soperator/kruise-manager
          tag: v1.9.2-ca-fix
          pullPolicy: IfNotPresent
        # The chart exposes no manager.affinity, so the two replicas get the pin but no
        # anti-affinity term.
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 1000m
            memory: 2Gi
      helmHooks:
        image:
          repository: cr.nebius.cloud/soperator/kruise-helm-hook
          tag: v0.1.0-ca-fix
      featureGates: "ImagePullJobGate=true,RecreatePodWhenChangeVCTInCloneSetGate=true,StatefulSetAutoResizePVCGate=true,StatefulSetAutoDeletePVC=true,PreDownloadImageForInPlaceUpdate=true,ResourceDistributionGate=true"
    # Flux HelmRelease spec.postRenderers. Every HelmRelease in this chart accepts this key next to
    # driftDetection. It is rendered with tpl, so patches may reference chart values such as
    # {{ .Values.slurmCluster.namespace }}. An override replaces the whole list.
    # Webhooks are patched by index: mutating 0 is mpod, validating 0-8 are the builtin-resource
    # webhooks of the kruise chart version above. Re-check the indexes when bumping the version.
    postRenderers:
      - kustomize:
          patches:
            - target:
                group: apps
                version: v1
                kind: DaemonSet
                name: kruise-daemon
              patch: |
                - op: add
                  path: /spec/updateStrategy
                  value:
                    type: RollingUpdate
                    rollingUpdate:
                      maxUnavailable: 50%
            - target:
                kind: MutatingWebhookConfiguration
                name: kruise-mutating-webhook-configuration
              patch: |
                - op: replace
                  path: /webhooks/0/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
            - target:
                kind: ValidatingWebhookConfiguration
                name: kruise-validating-webhook-configuration
              patch: |
                - op: replace
                  path: /webhooks/0/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/1/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/2/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/3/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/4/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/5/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/6/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/7/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
                - op: replace
                  path: /webhooks/8/namespaceSelector/matchExpressions
                  value:
                    - key: kubernetes.io/metadata.name
                      operator: In
                      values:
                        - {{ .Values.slurmCluster.namespace }}
    driftDetection:
      mode: warn
      # OpenKruise manages certificates and webhook definitions at runtime.
      ignore:
        - paths:
            - /data
            # Kruise replaces the Secret without preserving Helm/Flux metadata maps.
            - /metadata/labels
            - /metadata/annotations
          target:
            version: v1
            kind: Secret
            namespace: kruise-system
            name: kruise-webhook-certs
        - paths:
            - /metadata/annotations/template
            - /webhooks
          target:
            group: admissionregistration.k8s.io
            version: v1
            kind: "(Mutating|Validating)WebhookConfiguration"
            name: "kruise-(mutating|validating)-webhook-configuration"
        - paths:
            - /spec/conversion/webhook/clientConfig
          target:
            group: apiextensions.k8s.io
            version: v1
            kind: CustomResourceDefinition
            name: "(daemonsets|sidecarsets)\\.apps\\.kruise\\.io"
  soperatorChecks:
    enabled: true
    interval: 5m
    timeout: 5m
    releaseName: soperator-checks
    valuesFrom:
      - kind: ConfigMap
        name: terraform-soperatorchecks
        optional: true
        valuesKey: values.yaml
      - kind: ConfigMap
        name: soperatorchecks
        optional: true
        valuesKey: values.yaml
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-soperator'
    install:
      remediation:
        retries: 3
    upgrade:
      remediation:
        retries: 3
        remediateLastFailure: true
    values:
      checks:
        nodeSelector:
          slurm.nebius.ai/nodeset: system
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      control-plane: soperatorchecks
    # postRenderers: []
    driftDetection:
      mode: warn
  nodeConfigurator:
    enabled: true
    interval: 5m
    timeout: 30m
    releaseName: soperator-node-configurator
    valuesFrom:
      - kind: ConfigMap
        name: terraform-nodeconfigurator
        optional: true
        valuesKey: values.yaml
      - kind: ConfigMap
        name: nodeconfigurator
        optional: true
        valuesKey: values.yaml
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-soperator'
    install:
      crds: Skip
      remediation:
        retries: 6
    upgrade:
      crds: Skip
      remediation:
        retries: 6
        remediateLastFailure: true
    values:
      # Older nodeconfigurator charts use this key for the custom container.
      nodeConfigurator:
        enabled: false
      rebooter:
        enabled: true
        generateRBAC: true
        logFormat: json
        tolerations:
          - operator: Exists
        # Without a priority class the rebooter runs at 0 and loses a node's spare CPU budget to
        # whatever infrastructure Deployment lands there first, with no way to preempt it. The
        # class sits below every Slurm pod (the lowest is slurm-login at 100002) because this is a
        # DaemonSet on every node, not just the worker ones - it must never evict Slurm workloads.
        priorityClassName: soperator-rebooter
        priorityClass:
          create: true
          name: soperator-rebooter
          value: 100000
        resources:
          requests:
            memory: 200Mi
            cpu: 100m
          limits:
            memory: 200Mi
    # postRenderers: []
    driftDetection:
      mode: warn
  monitoringDashboards:
    enabled: true
    interval: 5m
    timeout: 5m
    releaseName: soperator-monitoring-dashboards
    namespace: monitoring-system
    valuesFrom: []
    dependsOn:
      - name: '{{ include "soperator-fluxcd.fullname" . }}-ns'
    install:
      crds: Skip
      remediation:
        retries: 3
    upgrade:
      crds: Skip
      remediation:
        retries: 3
    values: null
    # postRenderers: []
    driftDetection:
      mode: warn
  # postRenderers: []
  driftDetection:
    mode: warn
