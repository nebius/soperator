suite: test Tailscale RBAC
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/tailscale.yaml
tests:
  - it: should allow Tailscale to persist state for any login pod
    set:
      tailscale.enabled: true
      tailscale.namespace: workload
    asserts:
      - equal:
          path: spec.dependsOn
          value:
            - name: RELEASE-NAME-ns
        documentSelector: {path: kind, value: HelmRelease}
      - equal:
          path: data["values.yaml"].resources[0].metadata.namespace
          value: workload
        documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
      - equal:
          path: data["values.yaml"].resources[1].metadata.namespace
          value: workload
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].resources[1].roleRef.name
          value: tailscale
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].resources[1].subjects[0].name
          value: default
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].resources[0].rules[0].resources[0]
          value: secrets
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].resources[0].rules[0].verbs
          content: get
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].resources[0].rules[0].verbs
          content: create
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].resources[0].rules[0].verbs
          content: update
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].resources[0].rules[0].verbs
          content: patch
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].resources[0].rules[0].resourceNames
        documentSelector: *baseConfigMap
---
suite: test Tailscale dependency
templates:
  - templates/slurm-cluster.yaml
tests:
  - it: should make Slurm cluster depend on Tailscale RBAC when enabled
    set:
      tailscale.enabled: true
    documentSelector: &helmRelease {path: kind, value: HelmRelease}
    asserts:
      - contains:
          path: spec.dependsOn
          content:
            name: RELEASE-NAME-tailscale

  - it: should not add Tailscale dependency when disabled
    set:
      tailscale.enabled: false
    documentSelector: *helmRelease
    asserts:
      - notContains:
          path: spec.dependsOn
          content:
            name: RELEASE-NAME-tailscale
