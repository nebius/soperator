suite: test custom configmaps
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/soperator-custom-configmaps.yaml

tests:
  - it: should render custom configmaps component when customConfigmaps.enabled=true
    set:
      customConfigmaps:
        enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: HelmRelease
        documentSelector: &helmRelease {path: kind, value: HelmRelease}
      - equal:
          path: metadata.name
          value: RELEASE-NAME-custom-configmaps
        documentSelector: *helmRelease
      - equal:
          path: spec.chart.spec.chart
          value: helm-soperator-custom-configmaps
        documentSelector: *helmRelease
      - equal:
          path: spec.releaseName
          value: soperator-custom-configmaps
        documentSelector: *helmRelease
      - equal:
          path: spec.targetNamespace
          value: soperator
        documentSelector: *helmRelease

  - it: should not render custom configmaps component when customConfigmaps.enabled=false
    set:
      customConfigmaps:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct version from values
    set:
      customConfigmaps:
        enabled: true
        version: "1.23.0"
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.chart.spec.version
          value: "1.23.0"

  - it: should set the target namespace without injecting a child chart value
    set:
      customConfigmaps:
        enabled: true
        namespace: custom-namespace
        values:
          configMaps:
            motd:
              enabled: false
    asserts:
      - equal:
          path: spec.targetNamespace
          value: custom-namespace
        documentSelector: *helmRelease
      - notExists:
          path: data["values.yaml"].namespace
        documentSelector: &baseConfigMap {path: kind, value: ConfigMap}

  - it: should use correct interval and timeout from values
    set:
      customConfigmaps:
        enabled: true
        interval: 10m
        timeout: 10m
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.interval
          value: 10m
      - equal:
          path: spec.timeout
          value: 10m
      - equal:
          path: spec.chart.spec.interval
          value: 10m

  - it: should use correct release name from values
    set:
      customConfigmaps:
        enabled: true
        releaseName: my-custom-release
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.releaseName
          value: my-custom-release

  - it: should have correct dependencies
    set:
      customConfigmaps:
        enabled: true
    documentSelector: *helmRelease
    asserts:
      - contains:
          path: spec.dependsOn
          content:
            name: RELEASE-NAME-ns

  - it: should reference correct HelmRepository
    set:
      customConfigmaps:
        enabled: true
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.chart.spec.sourceRef.kind
          value: HelmRepository
      - equal:
          path: spec.chart.spec.sourceRef.name
          value: RELEASE-NAME-soperator

  - it: should include valuesFrom ConfigMap reference
    set:
      customConfigmaps:
        enabled: true
    documentSelector: *helmRelease
    asserts:
      - contains:
          path: spec.valuesFrom
          content:
            kind: ConfigMap
            name: custom-configmaps
            optional: true
            valuesKey: values.yaml

  - it: should keep using legacy overrideValues when values are absent
    set:
      customConfigmaps:
        enabled: true
        overrideValues:
          namespace: override-namespace
          configMaps:
            motd:
              enabled: false
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].namespace
          value: override-namespace
      - equal:
          path: data["values.yaml"].configMaps.motd.enabled
          value: false

  - it: should have correct install and upgrade settings
    set:
      customConfigmaps:
        enabled: true
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.install.crds
          value: Skip
      - equal:
          path: spec.install.remediation.retries
          value: 3
      - equal:
          path: spec.upgrade.crds
          value: Skip
      - equal:
          path: spec.upgrade.remediation.retries
          value: 3

  - it: should have correct labels
    set:
      customConfigmaps:
        enabled: true
    documentSelector: *helmRelease
    asserts:
      - isNotEmpty:
          path: metadata.labels
      - exists:
          path: metadata.labels["helm.sh/chart"]
