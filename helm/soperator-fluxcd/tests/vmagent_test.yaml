suite: test VMStack values and dependencies
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/vm-stack.yaml

tests:
  - it: should write to local VMSingle by default
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite
          value:
            - url: http://vmsingle-metrics-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/api/v1/write
      - notExists:
          path: data["values.yaml"].vmagent.spec.extraArgs["remoteWrite.bearerTokenFile"]

  - it: should clear the VMStack chart's default node-exporter arguments
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].prometheus-node-exporter.extraArgs
          value: []

  - it: should pass through explicit node-exporter arguments
    set:
      observability.vmStack.values.prometheus-node-exporter.extraArgs: &nodeExporterArgs
        - '--collector.ethtool.device-exclude=ibp.*'
        - '--no-collector.infiniband'
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].prometheus-node-exporter.extraArgs
          value: *nodeExporterArgs

  - it: should pass through ordered destinations, per-destination Secrets, and explicit public write settings
    set:
      observability.vmStack.values.vmagent.spec:
        remoteWrite: &secretDestinations
          - url: https://metrics.example.invalid/write
            bearerTokenSecret: {name: o11y-writer-sa-token, key: accessToken}
            inlineUrlRelabelConfig:
              - {action: labeldrop, regex: "job|UUID"}
          - url: http://local.example.invalid/write
          - url: https://partner.example.invalid/write
            bearerTokenSecret: {name: partner-metrics, key: token}
        externalLabels: {team: ops}
        extraEnvs:
          - {name: CLUSTER_NAME, value: example}
        extraArgs:
          remoteWrite.flushInterval: 2s
          remoteWrite.maxRowsPerBlock: "12000"
        remoteWriteSettings: &writeSettings
          label: {container_id: "12345", cluster: "%{CLUSTER_NAME}", team: ops}
          queues: 8
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite
          value: *secretDestinations
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWriteSettings
          value: *writeSettings
      - equal:
          path: data["values.yaml"].vmagent.spec.externalLabels
          value: {team: ops}
      - equal:
          path: data["values.yaml"].vmagent.spec.extraEnvs
          value: [{name: CLUSTER_NAME, value: example}]
      - equal:
          path: data["values.yaml"].vmagent.spec.extraArgs["remoteWrite.maxRowsPerBlock"]
          value: "12000"
      - equal:
          path: data["values.yaml"].vmagent.spec.extraArgs["promscrape.streamParse"]
          value: "true"
      - notExists:
          path: data["values.yaml"].vmagent.spec.extraArgs["remoteWrite.bearerTokenFile"]

  - it: should pass through an explicit host token mount and positional bearer token argument
    set:
      observability.publicEndpointTokenKind: hostPath
      observability.vmStack.values.vmagent.spec:
        remoteWrite: &hostPathDestinations
          - url: https://metrics.example.invalid/write
          - url: http://local.example.invalid/write
          - url: https://partner.example.invalid/write
            bearerTokenSecret: {name: partner-metrics, key: token}
        extraArgs:
          remoteWrite.bearerTokenFile: '/o11ytoken/tsa-token,"",""'
        volumes: &hostPathVolumes
          - name: o11ytoken
            hostPath: {path: /mnt/cloud-metadata, type: Directory}
        volumeMounts: &hostPathMounts
          - {name: o11ytoken, mountPath: /o11ytoken, readOnly: true}
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite
          value: *hostPathDestinations
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].vmagent.spec.extraArgs["remoteWrite.bearerTokenFile"]
          value: '/o11ytoken/tsa-token,"",""'
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].vmagent.spec.volumes
          value: *hostPathVolumes
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].vmagent.spec.volumeMounts
          value: *hostPathMounts
        documentSelector: *baseConfigMap
      - notContains:
          path: spec.dependsOn
          content: {name: RELEASE-NAME-tsa-token-writer}
        documentSelector: &helmRelease {path: kind, value: HelmRelease}

  - it: should accept the explicit local-only list with the public endpoint flag disabled
    set:
      observability.publicEndpointEnabled: false
      observability.vmStack.values.vmagent.spec.remoteWrite:
        - url: http://local.example.invalid/write
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite
          value:
            - url: http://local.example.invalid/write
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].vmagent.spec.extraEnvs
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].vmagent.spec.remoteWriteSettings
        documentSelector: *baseConfigMap
      - notContains:
          path: spec.dependsOn
          content: {name: RELEASE-NAME-tsa-token-writer}
        documentSelector: *helmRelease

  - it: should leave explicitly configured destinations in place when the public endpoint flag is disabled
    set:
      observability.publicEndpointEnabled: false
      observability.vmStack.values.vmagent.spec.remoteWrite: *secretDestinations
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite
          value: *secretDestinations

  - it: should pass an explicit empty remote-write list through
    set:
      observability.vmStack.values.vmagent.spec.remoteWrite: []
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite
          value: []

  - it: should generate an empty values map and preserve the Flux ConfigMap ordering when values is null
    set:
      observability.vmStack.values: null
    asserts:
      - equal:
          path: data["values.yaml"]
          value: {}
        documentSelector: *baseConfigMap
      - equal:
          path: spec.valuesFrom
          value:
            - {kind: ConfigMap, name: RELEASE-NAME-vm-stack-values, valuesKey: values.yaml}
            - {kind: ConfigMap, name: terraform-victoria-metrics-operator, optional: true, valuesKey: values.yaml}
            - {kind: ConfigMap, name: victoria-metrics-operator, optional: true, valuesKey: values.yaml}
        documentSelector: *helmRelease

  - it: should depend on the generated HelmRelease names
    set:
      fullnameOverride: platform
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value:
            - {name: platform-ns}
            - {name: platform-cert-manager}
            - {name: platform-victoria-metrics-operator-crds}

  - it: should resolve an explicit dependency on the TSA token writer
    set:
      fullnameOverride: platform
      observability.vmStack.dependsOn:
        - name: '{{ include "soperator-fluxcd.o11yTsaTokenWriterName" . }}'
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: [{name: platform-tsa-token-writer}]

  - it: should use an external Secret and omit disabled dependencies
    set:
      observability.tsaToken.writer.enabled: false
      certManager.enabled: false
      observability.vmStack.values.vmagent.spec.remoteWrite:
        - url: https://metrics.example.invalid/write
          bearerTokenSecret: {name: existing, key: accessToken}
    asserts:
      - equal:
          path: data["values.yaml"].vmagent.spec.remoteWrite[0].bearerTokenSecret
          value: {name: existing, key: accessToken}
        documentSelector: *baseConfigMap
      - equal:
          path: spec.dependsOn
          value:
            - {name: RELEASE-NAME-ns}
            - {name: RELEASE-NAME-victoria-metrics-operator-crds}
        documentSelector: *helmRelease

  - it: should accept explicit Flux dependencies
    set:
      observability.vmStack.dependsOn: [{name: metrics-ready, namespace: ops}]
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: [{name: metrics-ready, namespace: ops}]

  - it: should clear the Flux dependencies with an empty list
    set:
      observability.vmStack.dependsOn: []
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: []
