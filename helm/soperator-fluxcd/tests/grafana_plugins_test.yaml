suite: test Grafana configuration
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/vm-stack.yaml

tests:
  - it: should use Grafana v13 plugin preinstall syntax for URL plugins
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].grafana.plugins[0]
          value: grafana-lokiexplore-app@1.0.14@https://storage.googleapis.com/integration-artifacts/grafana-lokiexplore-app/grafana-lokiexplore-app-latest.zip
      - equal:
          path: data["values.yaml"].grafana.plugins[1]
          value: victoriametrics-logs-datasource

  - it: should enable Basic Auth for Grafana provisioning sidecars
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].grafana["grafana.ini"]["auth.basic"].enabled
          value: true

  - it: should pass native Grafana settings and alert rule templates to the child unchanged
    set:
      observability.vmStack.values.grafana:
        grafana.ini:
          auth.basic: {enabled: false}
        plugins: [grafana-clock-panel]
        sidecar:
          dashboards: {searchNamespace: ALL}
          datasources: {searchNamespace: [team-a, team-b]}
      observability.vmStack.values.extraRules:
        team-alerts:
          groups:
            - name: team
              rules:
                - alert: TeamUnavailable
                  expr: up == 0
                  annotations: {summary: 'Instance {{ $labels.instance }} is down'}
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].grafana["grafana.ini"]["auth.basic"].enabled
          value: false
      - equal:
          path: data["values.yaml"].grafana.plugins
          value: [grafana-clock-panel]
      - equal:
          path: data["values.yaml"].grafana.sidecar.dashboards.searchNamespace
          value: ALL
      - equal:
          path: data["values.yaml"].grafana.sidecar.datasources.searchNamespace
          value: [team-a, team-b]
      - equal:
          path: data["values.yaml"].extraRules.team-alerts.groups[0].rules[0].annotations.summary
          value: 'Instance {{ $labels.instance }} is down'
