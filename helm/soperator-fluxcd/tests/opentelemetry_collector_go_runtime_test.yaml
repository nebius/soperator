suite: test opentelemetry collector logs Go runtime env
templates:
  - templates/opentelemetry-collector-logs.yaml
tests:
  - it: should keep the default GOMAXPROCS and enable upstream GOMEMLIMIT for logs
    asserts:
      - contains:
          path: spec.values.extraEnvs
          content:
            name: GOMAXPROCS
            value: "1"
      - equal:
          path: spec.values.useGOMEMLIMIT
          value: true

  - it: should pass through explicit runtime settings for logs
    set:
      observability.opentelemetry.logs.values.useGOMEMLIMIT: false
      observability.opentelemetry.logs.values.extraEnvs:
        - name: GOMAXPROCS
          value: "2"
    asserts:
      - contains:
          path: spec.values.extraEnvs
          content:
            name: GOMAXPROCS
            value: "2"
      - equal:
          path: spec.values.useGOMEMLIMIT
          value: false
