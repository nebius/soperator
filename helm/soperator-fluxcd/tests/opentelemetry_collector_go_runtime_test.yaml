suite: test opentelemetry collector jail logs Go runtime env
templates:
  - templates/opentelemetry-collector-jail-logs.yaml
tests:
  - it: should keep the default GOMAXPROCS and enable upstream GOMEMLIMIT for jail logs
    asserts:
      - contains:
          path: spec.values.extraEnvs
          content:
            name: GOMAXPROCS
            value: "1"
      - equal:
          path: spec.values.useGOMEMLIMIT
          value: true

  - it: should use jail logs runtime settings independently of logs
    set:
      observability.opentelemetry.logs.values.useGOMEMLIMIT: true
      observability.opentelemetry.logs.values.extraEnvs:
        - name: GOMAXPROCS
          value: "2"
      observability.opentelemetry.jailLogs.values.useGOMEMLIMIT: false
      observability.opentelemetry.jailLogs.values.extraEnvs:
        - name: GOMAXPROCS
          value: "4"
    asserts:
      - contains:
          path: spec.values.extraEnvs
          content:
            name: GOMAXPROCS
            value: "4"
      - equal:
          path: spec.values.useGOMEMLIMIT
          value: false
---
suite: test opentelemetry collector NCCL profiles Go runtime env
templates:
  - templates/opentelemetry-collector-nccl-profiles.yaml
set:
  observability.ncclProfiles.enabled: true
tests:
  - it: should keep the default GOMAXPROCS and enable upstream GOMEMLIMIT
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-otelcol-nccl-profiles
    asserts:
      - contains:
          path: spec.values.extraEnvs
          content:
            name: GOMAXPROCS
            value: "1"
      - equal:
          path: spec.values.useGOMEMLIMIT
          value: true

  - it: should pass through explicit runtime settings for the collector
    set:
      observability.ncclProfiles.collector.values.extraEnvs:
        - name: GOMAXPROCS
          value: "2"
      observability.ncclProfiles.collector.values.useGOMEMLIMIT: false
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-otelcol-nccl-profiles
    asserts:
      - contains:
          path: spec.values.extraEnvs
          content:
            name: GOMAXPROCS
            value: "2"
      - equal:
          path: spec.values.useGOMEMLIMIT
          value: false
