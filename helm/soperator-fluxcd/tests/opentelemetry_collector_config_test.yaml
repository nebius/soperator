suite: test opentelemetry collector logs config
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/opentelemetry-collector-logs.yaml
tests:
  - it: should collect pod and node logs with local exporter batching and persistent checkpoints
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].config.service.pipelines.logs
          value:
            receivers: [filelog/pods, filelog/nodelogs]
            processors: [k8s_attributes, transform, memory_limiter]
            exporters: [otlp_http/victoriametrics]
      - notExists:
          path: data["values.yaml"].config.exporters.otlp
      - equal:
          path: data["values.yaml"].config.exporters["otlp_http/victoriametrics"].logs_endpoint
          value: http://vm-logs-victoria-logs-single-server:9428/insert/opentelemetry/v1/logs
      - equal:
          path: data["values.yaml"].config.exporters["otlp_http/victoriametrics"].sending_queue
          value:
            enabled: true
            sizer: items
            queue_size: 30000
            num_consumers: 10
            storage: file_storage
            batch: {sizer: items, flush_timeout: 1s, min_size: 2000, max_size: 5000}
      - equal:
          path: data["values.yaml"].config.receivers["filelog/pods"].storage
          value: file_storage
      - equal:
          path: data["values.yaml"].config.receivers["filelog/nodelogs"].storage
          value: file_storage
      - equal:
          path: data["values.yaml"].config.extensions.file_storage.directory
          value: /var/lib/otelcol
      - contains:
          path: data["values.yaml"].extraVolumes
          content:
            name: varlibotelcol
            hostPath: {path: /var/lib/otelcol, type: DirectoryOrCreate}

  - it: should pass an explicit Secret-backed public exporter and its capped queue
    set:
      observability.opentelemetry.namespace: custom-logs
      observability.opentelemetry.logs.values.config:
        exporters:
          otlp:
            endpoint: dns:///logs.example.test:443
            auth:
              authenticator: bearertokenauth
            headers:
              iam-container: example-project
            sending_queue:
              enabled: true
              sizer: items
              queue_size: 30000
              num_consumers: 10
              storage: file_storage
              batch: {sizer: items, flush_timeout: 1s, min_size: 500, max_size: 1000}
        extensions:
          bearertokenauth:
            filename: /var/run/o11y-token/token
        service:
          extensions: [health_check, file_storage, bearertokenauth]
          pipelines:
            logs:
              exporters: [otlp_http/victoriametrics, otlp]
      observability.opentelemetry.logs.values.extraVolumes:
        - name: varlogpods
          hostPath: {path: /var/log/pods}
        - name: varlibdockercontainers
          hostPath: {path: /var/lib/docker/containers}
        - name: node-logs
          hostPath: {path: /var/log, type: Directory}
        - name: varlibotelcol
          hostPath: {path: /var/lib/otelcol, type: DirectoryOrCreate}
        - name: o11ytoken
          secret: {secretName: custom-o11y-token}
      observability.opentelemetry.logs.values.extraVolumeMounts:
        - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
        - {name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true}
        - {name: node-logs, mountPath: /var/nodelogs, readOnly: true}
        - {name: varlibotelcol, mountPath: /var/lib/otelcol}
        - {name: o11ytoken, mountPath: /var/run/o11y-token, readOnly: true}
    asserts:
      - equal:
          path: spec.targetNamespace
          value: custom-logs
        documentSelector: {path: kind, value: HelmRelease}
      - equal:
          path: data["values.yaml"].config.exporters.otlp.endpoint
          value: dns:///logs.example.test:443
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].config.exporters.otlp.headers.iam-container
          value: example-project
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].config.exporters.otlp.sending_queue.batch.max_size
          value: 1000
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].config.service.pipelines.logs.exporters
          value: [otlp_http/victoriametrics, otlp]
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].config.extensions.bearertokenauth.filename
          value: /var/run/o11y-token/token
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].extraVolumes
          content:
            name: o11ytoken
            secret: {secretName: custom-o11y-token}
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].extraVolumeMounts
          content: {name: o11ytoken, mountPath: /var/run/o11y-token, readOnly: true}
        documentSelector: *baseConfigMap

  - it: should remove checkpoints and queue storage when supplied with memory-only settings
    set:
      observability.opentelemetry.logs.values.config:
        exporters:
          otlp_http/victoriametrics:
            sending_queue:
              storage: null
        extensions:
          file_storage: null
        receivers:
          filelog/pods:
            storage: null
          filelog/nodelogs:
            storage: null
        service:
          extensions: [health_check]
      observability.opentelemetry.logs.values.extraVolumes:
        - name: varlogpods
          hostPath: {path: /var/log/pods}
        - name: varlibdockercontainers
          hostPath: {path: /var/lib/docker/containers}
        - name: node-logs
          hostPath: {path: /var/log, type: Directory}
      observability.opentelemetry.logs.values.extraVolumeMounts:
        - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
        - {name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true}
        - {name: node-logs, mountPath: /var/nodelogs, readOnly: true}
      observability.opentelemetry.logs.values.initContainers: []
    documentSelector: *baseConfigMap
    asserts:
      - notExists:
          path: data["values.yaml"].config.extensions.file_storage
      - equal:
          path: data["values.yaml"].config.service.extensions
          value: [health_check]
      - notExists:
          path: data["values.yaml"].config.exporters["otlp_http/victoriametrics"].sending_queue.storage
      - notExists:
          path: data["values.yaml"].config.receivers["filelog/pods"].storage
      - notExists:
          path: data["values.yaml"].config.receivers["filelog/nodelogs"].storage
      - lengthEqual:
          path: data["values.yaml"].extraVolumeMounts
          count: 3
      - lengthEqual:
          path: data["values.yaml"].extraVolumes
          count: 3
      - equal:
          path: data["values.yaml"].initContainers
          value: []

---
suite: test opentelemetry collector events config
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/opentelemetry-collector-events.yaml
tests:
  - it: should collect Kubernetes events using the local exporter and its own storage directory
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].mode
          value: deployment
      - equal:
          path: data["values.yaml"].config.service.pipelines["logs/events"]
          value:
            receivers: [k8sobjects]
            processors: [k8s_attributes, transform, memory_limiter]
            exporters: [otlp_http/victoriametrics]
      - notExists:
          path: data["values.yaml"].config.exporters.otlp
      - equal:
          path: data["values.yaml"].config.exporters["otlp_http/victoriametrics"].sending_queue
          value:
            enabled: true
            sizer: items
            queue_size: 30000
            num_consumers: 10
            storage: file_storage
            batch: {sizer: items, flush_timeout: 1s, min_size: 2000, max_size: 5000}
      - equal:
          path: data["values.yaml"].config.extensions.file_storage.directory
          value: /var/lib/otelcol-events
      - contains:
          path: data["values.yaml"].extraVolumes
          content:
            name: varlibotelcol
            hostPath: {path: /var/lib/otelcol-events, type: DirectoryOrCreate}

  - it: should render native events queue and batch overrides
    set:
      observability.opentelemetry.events.values.config.exporters:
        otlp_http/victoriametrics:
          sending_queue:
            queue_size: 9000
            num_consumers: 3
            batch: {flush_timeout: 2s, min_size: 3000, max_size: 7000}
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].config.exporters["otlp_http/victoriametrics"].sending_queue
          value:
            enabled: true
            sizer: items
            queue_size: 9000
            num_consumers: 3
            storage: file_storage
            batch: {sizer: items, flush_timeout: 2s, min_size: 3000, max_size: 7000}

  - it: should accept an explicit events configuration without file storage
    set:
      observability.opentelemetry.events.values.config:
        exporters:
          otlp_http/victoriametrics:
            sending_queue:
              storage: null
        extensions:
          file_storage: null
        service:
          extensions: [health_check]
      observability.opentelemetry.events.values.extraVolumes: []
      observability.opentelemetry.events.values.extraVolumeMounts: []
      observability.opentelemetry.events.values.initContainers: []
    documentSelector: *baseConfigMap
    asserts:
      - notExists:
          path: data["values.yaml"].config.extensions.file_storage
      - equal:
          path: data["values.yaml"].config.service.extensions
          value: [health_check]
      - notExists:
          path: data["values.yaml"].config.exporters["otlp_http/victoriametrics"].sending_queue.storage
      - equal:
          path: data["values.yaml"].extraVolumes
          value: []
      - equal:
          path: data["values.yaml"].extraVolumeMounts
          value: []
      - equal:
          path: data["values.yaml"].initContainers
          value: []

---
suite: test opentelemetry collector jail logs config
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/opentelemetry-collector-jail-logs.yaml
tests:
  - it: should collect jail logs and health checker output with a distinct checkpoint directory
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].config.service.pipelines.logs
          value:
            receivers: [filelog, filelog/health_checker]
            processors: [k8s_attributes, transform, memory_limiter]
            exporters: [otlp_http/victorialogs]
      - notExists:
          path: data["values.yaml"].config.exporters.otlp
      - equal:
          path: data["values.yaml"].config.exporters["otlp_http/victorialogs"].sending_queue
          value:
            enabled: true
            sizer: items
            queue_size: 30000
            num_consumers: 10
            storage: file_storage
            batch: {sizer: items, flush_timeout: 1s, min_size: 2000, max_size: 5000}
      - equal:
          path: data["values.yaml"].config.receivers.filelog.storage
          value: file_storage
      - equal:
          path: data["values.yaml"].config.receivers["filelog/health_checker"].storage
          value: file_storage
      - equal:
          path: data["values.yaml"].config.extensions.file_storage.directory
          value: /var/lib/otelcol-jail
      - contains:
          path: data["values.yaml"].extraVolumes
          content:
            name: varlibotelcol
            hostPath: {path: /var/lib/otelcol-jail, type: DirectoryOrCreate}

  - it: should pass an explicit host-mounted token and public exporter
    set:
      observability.publicEndpointTokenKind: hostPath
      observability.opentelemetry.jailLogs.values.config:
        exporters:
          otlp:
            endpoint: dns:///logs.example.test:443
            auth:
              authenticator: bearertokenauth
        extensions:
          bearertokenauth:
            filename: /var/run/o11y-token/agent-token
        service:
          extensions: [health_check, file_storage, bearertokenauth]
          pipelines:
            logs:
              exporters: [otlp_http/victorialogs, otlp]
      observability.opentelemetry.jailLogs.values.extraVolumes:
        - name: soperator-outputs
          hostPath: {path: /var/log/soperator-outputs, type: DirectoryOrCreate}
        - name: varlibotelcol
          hostPath: {path: /var/lib/otelcol-jail, type: DirectoryOrCreate}
        - name: o11ytoken
          hostPath: {path: /var/lib/o11y/token, type: Directory}
      observability.opentelemetry.jailLogs.values.extraVolumeMounts:
        - {name: soperator-outputs, mountPath: /var/log/soperator-outputs, readOnly: false}
        - {name: varlibotelcol, mountPath: /var/lib/otelcol-jail}
        - {name: o11ytoken, mountPath: /var/run/o11y-token, readOnly: true}
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].config.exporters.otlp.auth.authenticator
          value: bearertokenauth
      - equal:
          path: data["values.yaml"].config.extensions.bearertokenauth.filename
          value: /var/run/o11y-token/agent-token
      - equal:
          path: data["values.yaml"].config.service.pipelines.logs.exporters
          value: [otlp_http/victorialogs, otlp]
      - contains:
          path: data["values.yaml"].extraVolumes
          content:
            name: o11ytoken
            hostPath: {path: /var/lib/o11y/token, type: Directory}
      - contains:
          path: data["values.yaml"].extraVolumeMounts
          content: {name: o11ytoken, mountPath: /var/run/o11y-token, readOnly: true}

  - it: should omit jail log storage when checkpoints and queue persistence are removed explicitly
    set:
      observability.opentelemetry.jailLogs.values.config:
        exporters:
          otlp_http/victorialogs:
            sending_queue:
              storage: null
        extensions:
          file_storage: null
        receivers:
          filelog:
            storage: null
          filelog/health_checker:
            storage: null
        service:
          extensions: [health_check]
      observability.opentelemetry.jailLogs.values.extraVolumes:
        - name: soperator-outputs
          hostPath: {path: /var/log/soperator-outputs, type: DirectoryOrCreate}
      observability.opentelemetry.jailLogs.values.extraVolumeMounts:
        - {name: soperator-outputs, mountPath: /var/log/soperator-outputs, readOnly: false}
      observability.opentelemetry.jailLogs.values.initContainers: []
    documentSelector: *baseConfigMap
    asserts:
      - notExists:
          path: data["values.yaml"].config.extensions.file_storage
      - equal:
          path: data["values.yaml"].config.service.extensions
          value: [health_check]
      - notExists:
          path: data["values.yaml"].config.exporters["otlp_http/victorialogs"].sending_queue.storage
      - notExists:
          path: data["values.yaml"].config.receivers.filelog.storage
      - notExists:
          path: data["values.yaml"].config.receivers["filelog/health_checker"].storage
      - lengthEqual:
          path: data["values.yaml"].extraVolumeMounts
          count: 1
      - lengthEqual:
          path: data["values.yaml"].extraVolumes
          count: 1
      - equal:
          path: data["values.yaml"].initContainers
          value: []

  - it: should use native filelog receiver settings for file deletion
    set:
      observability.opentelemetry.jailLogs.values.config.receivers:
        filelog:
          delete_after_read_min_age: 30m
        filelog/health_checker:
          delete_after_read_min_age: 1h
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].config.receivers.filelog.start_at
          value: beginning
      - equal:
          path: data["values.yaml"].config.receivers.filelog.delete_after_read
          value: true
      - equal:
          path: data["values.yaml"].config.receivers.filelog.delete_after_read_min_age
          value: 30m
      - equal:
          path: data["values.yaml"].config.receivers["filelog/health_checker"].delete_after_read_min_age
          value: 1h
      - equal:
          path: data["values.yaml"].extraVolumeMounts[0].readOnly
          value: false
      - equal:
          path: data["values.yaml"].command.extraArgs[0]
          value: --feature-gates=-telemetry.UseLocalHostAsDefaultMetricsAddress,filelog.allowFileDeletion

  - it: should run as a node-local daemonset on worker nodes reading the boot disk directory
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].mode
          value: daemonset
      - notExists:
          path: data["values.yaml"].replicaCount
      - equal:
          path: data["values.yaml"].rollout.strategy
          value: RollingUpdate
      - equal:
          path: data["values.yaml"].affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: worker
      - contains:
          path: data["values.yaml"].tolerations
          content:
            effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
      - contains:
          path: data["values.yaml"].extraVolumes
          content:
            name: soperator-outputs
            hostPath:
              path: /var/log/soperator-outputs
              type: DirectoryOrCreate
      - equal:
          path: data["values.yaml"].extraVolumeMounts[0].mountPath
          value: /var/log/soperator-outputs
      - contains:
          path: data["values.yaml"].config.receivers.filelog.include
          content: /var/log/soperator-outputs/*/*.out
      - contains:
          path: data["values.yaml"].config.receivers["filelog/health_checker"].include
          content: /var/log/soperator-outputs/health_checker_cmd_stdout/*.out
      - equal:
          path: data["values.yaml"].config.receivers.filelog.delete_after_read_min_age
          value: 4h
      - equal:
          path: data["values.yaml"].initContainers[0].name
          value: init-fs
      - lengthEqual:
          path: data["values.yaml"].initContainers
          count: 1
