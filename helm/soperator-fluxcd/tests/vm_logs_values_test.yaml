suite: test VictoriaLogs values
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/vm-logs.yaml
tests:
  - it: should keep the default PVC and monitoring configuration
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].server.persistentVolume
          value:
            enabled: true
            size: 30Gi
            accessModes: [ReadWriteOnce]
      - equal:
          path: data["values.yaml"].server.vmServiceScrape.enabled
          value: true
      - equal:
          path: data["values.yaml"].dashboards
          value:
            enabled: true
            labels:
              grafana_dashboard: "1"
      - equal:
          path: data["values.yaml"].vector.enabled
          value: false

  - it: should pass the native PVC settings
    set:
      observability.vmLogs.values.server.persistentVolume:
        size: 60Gi
        accessModes: [ReadWriteMany]
        storageClassName: fast-logs
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].server.persistentVolume
          value:
            enabled: true
            size: 60Gi
            accessModes: [ReadWriteMany]
            storageClassName: fast-logs

  - it: should pass through the name of an existing claim
    set:
      observability.vmLogs.values.server.persistentVolume.existingClaim: existing-logs
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].server.persistentVolume.existingClaim
          value: existing-logs

  - it: should pass persistence disabled explicitly
    set:
      observability.vmLogs.values.server.persistentVolume.enabled: false
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].server.persistentVolume.enabled
          value: false
