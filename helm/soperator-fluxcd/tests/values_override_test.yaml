suite: test values override default values soperator
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/soperator.yaml
tests:
  - it: should forward native operator values
    set:
      soperator.values.controllerManager.manager.args:
        - --leader-elect
      soperator.values.controllerManager.nodeSelector:
        slurm.nebius.ai/nodeset: control-plane
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].controllerManager.manager.args
          value:
            - --leader-elect
      - equal:
          path: data["values.yaml"].controllerManager.nodeSelector["slurm.nebius.ai/nodeset"]
          value: control-plane

  - it: should use the operator defaults without overrides
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].controllerManager.manager.resources.requests
          value:
            cpu: 500m
            memory: 1Gi
      - equal:
          path: data["values.yaml"].controllerManager.manager.env
          value:
            isMariadbCrdInstalled: true
            isPrometheusCrdInstalled: true
      - equal:
          path: data["values.yaml"].certManager.enabled
          value: true

  - it: should merge native resource overrides with the chart defaults
    set:
      soperator.values.controllerManager.manager.resources.requests.cpu: 900m
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].controllerManager.manager.resources
          value:
            limits:
              memory: 1Gi
            requests:
              cpu: 900m
              memory: 1Gi

  - it: should pass operator settings independently of integration enablement
    set:
      mariadbOperator.enabled: false
      observability.enabled: false
      observability.prometheusOperator.enabled: false
      certManager.enabled: false
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].controllerManager.manager.env
          value:
            isMariadbCrdInstalled: true
            isPrometheusCrdInstalled: true
      - equal:
          path: data["values.yaml"].certManager.enabled
          value: true

  - it: should use explicit discovery and cert-manager settings
    set:
      soperator.values.controllerManager.manager.env.isMariadbCrdInstalled: false
      soperator.values.controllerManager.manager.env.isPrometheusCrdInstalled: false
      soperator.values.certManager.enabled: false
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].controllerManager.manager.env
          value:
            isMariadbCrdInstalled: false
            isPrometheusCrdInstalled: false
      - equal:
          path: data["values.yaml"].certManager.enabled
          value: false

  - it: should disable serviceMonitor when set to false
    set:
      soperator.enabled: true
      soperator.values:
        serviceMonitor:
          enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].serviceMonitor.enabled
          value: false
        documentSelector: *baseConfigMap

  - it: should enable serviceMonitor when set to true
    set:
      soperator.enabled: true
      soperator.values:
        serviceMonitor:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].serviceMonitor.enabled
          value: true
        documentSelector: *baseConfigMap

  - it: should not render serviceMonitor when not provided
    set:
      soperator.enabled: true
      soperator.values:
        serviceMonitor: null
    asserts:
      - hasDocuments:
          count: 2
      - notExists:
          path: data["values.yaml"].serviceMonitor
        documentSelector: *baseConfigMap

  - it: should render serviceMonitor without enabled field when serviceMonitor exists but enabled not set
    set:
      soperator.enabled: true
      soperator.values:
        serviceMonitor:
          enabled: null
          interval: 30s
    asserts:
      - hasDocuments:
          count: 2
      - exists:
          path: data["values.yaml"].serviceMonitor.interval
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].serviceMonitor.enabled
        documentSelector: *baseConfigMap
---
suite: test values override default values nodeconfigurator
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/nodeconfigurator.yaml
tests:
  - it: should keep the default rebooter configuration
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      - equal:
          path: data["values.yaml"].rebooter
          value:
            enabled: true
            generateRBAC: true
            logFormat: json
            tolerations:
              - operator: Exists
            priorityClassName: soperator-rebooter
            priorityClass:
              create: true
              name: soperator-rebooter
              value: 100000
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 200Mi

  - it: should forward rebooter resource overrides
    set:
      soperator.nodeConfigurator.values.rebooter.resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].rebooter.resources.requests
          value:
            cpu: 100m
            memory: 128Mi
        documentSelector: *baseConfigMap

  - it: should forward rebooter options from native values
    set:
      soperator.nodeConfigurator.values.rebooter.generateRBAC: false
      soperator.nodeConfigurator.values.rebooter.serviceAccountName: custom-rebooter
      soperator.nodeConfigurator.values.rebooter.tolerations: []
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].rebooter.generateRBAC
          value: false
      - equal:
          path: data["values.yaml"].rebooter.serviceAccountName
          value: custom-rebooter
      - equal:
          path: data["values.yaml"].rebooter.tolerations
          value: []
