suite: test native storage values
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/nfs-server.yaml
  - templates/slurm-cluster-storage.yaml
tests:
  - it: should use the child chart defaults when no storage values are configured
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap, matchMany: true}
    asserts:
      - equal:
          path: data["values.yaml"]
          value: {}

  - it: should forward the NFS server settings
    template: templates/nfs-server.yaml
    set:
      nfsServer.values: &nfsValues
        storage:
          existingClaim: nfs-data
        nfs:
          permitted: [10.0.0.0/24]
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"]
          value: *nfsValues

  - it: should forward the Slurm storage settings
    template: templates/slurm-cluster-storage.yaml
    set:
      slurmCluster.slurmClusterStorage.values: &storageValues
        volume:
          jail:
            size: 3Ti
          controllerSpool:
            enabled: false
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"]
          value: *storageValues

---

suite: test SlurmCluster names and references
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/slurm-cluster.yaml
  - templates/soperator-activechecks.yaml
tests:
  - it: should keep the default SlurmCluster name
    template: templates/slurm-cluster.yaml
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap, matchMany: true}
    asserts:
      - equal:
          path: data["values.yaml"].clusterName
          value: soperator

  - it: should forward a custom SlurmCluster name
    template: templates/slurm-cluster.yaml
    set:
      slurmCluster.values.clusterName: custom-slurm
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].clusterName
          value: custom-slurm

  - it: should let the ActiveChecks child chart or valuesFrom supply the default reference
    template: templates/soperator-activechecks.yaml
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"]
          value: {}

  - it: should forward the native ActiveChecks cluster reference
    template: templates/soperator-activechecks.yaml
    set:
      soperatorActiveChecks.values.slurmClusterRefName: custom-slurm
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"]
          value:
            slurmClusterRefName: custom-slurm
