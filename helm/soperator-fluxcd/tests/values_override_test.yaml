suite: test native NCCL profile HelmRelease values
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/opentelemetry-collector-nccl-profiles.yaml
set:
  observability.ncclProfiles.enabled: true
tests:
  - it: should keep both default dependency lists and ordered values references
    set:
      fullnameOverride: platform
    asserts:
      - equal:
          path: metadata.name
          value: platform-otelcol-nccl-profiles-cm
        documentSelector: &platformRelayRelease {path: metadata.name, value: platform-otelcol-nccl-profiles-cm}
      - equal:
          path: spec.dependsOn
          value:
            - name: platform-ns
        documentSelector: *platformRelayRelease
      - equal:
          path: spec.dependsOn
          value:
            - name: platform-ns
            - name: platform-vm-stack
            - name: platform-otelcol-nccl-profiles-cm
        documentSelector: &platformCollectorRelease {path: metadata.name, value: platform-otelcol-nccl-profiles}
      - equal:
          path: spec.valuesFrom
          value:
            - {kind: ConfigMap, name: platform-otelcol-nccl-profiles-cm-values, valuesKey: values.yaml}
            - {kind: ConfigMap, name: terraform-opentelemetry-collector-nccl-profiles-cm, optional: true, valuesKey: values.yaml}
            - {kind: ConfigMap, name: opentelemetry-collector-nccl-profiles-cm, optional: true, valuesKey: values.yaml}
        documentSelector: *platformRelayRelease
      - equal:
          path: spec.valuesFrom
          value:
            - {kind: ConfigMap, name: platform-otelcol-nccl-profiles-values, valuesKey: values.yaml}
            - {kind: ConfigMap, name: terraform-opentelemetry-collector-nccl-profiles, optional: true, valuesKey: values.yaml}
            - {kind: ConfigMap, name: opentelemetry-collector-nccl-profiles, optional: true, valuesKey: values.yaml}
        documentSelector: *platformCollectorRelease

  - it: should give each NCCL release its own ordered values sources
    set:
      fullnameOverride: platform
      observability.ncclProfiles.configMap.valuesFrom:
        - &relay {kind: ConfigMap, name: relay-config}
      observability.ncclProfiles.collector.valuesFrom:
        - &agent {kind: ConfigMap, name: agent-config, valuesKey: collector.yaml}
        - &token {kind: Secret, name: agent-token, valuesKey: token, targetPath: auth.token, optional: true}
    asserts:
      - equal:
          path: spec.valuesFrom
          value:
            - {kind: ConfigMap, name: platform-otelcol-nccl-profiles-cm-values, valuesKey: values.yaml}
            - *relay
        documentSelector: *platformRelayRelease
      - equal:
          path: spec.valuesFrom
          value:
            - {kind: ConfigMap, name: platform-otelcol-nccl-profiles-values, valuesKey: values.yaml}
            - *agent
            - *token
        documentSelector: *platformCollectorRelease

  - it: should allow independent dependency overrides
    set:
      fullnameOverride: platform
      observability.ncclProfiles.configMap.dependsOn: []
      observability.ncclProfiles.collector.dependsOn:
        - name: '{{ include "soperator-fluxcd.fullname" . }}-external-config'
          namespace: platform-ops
    asserts:
      - equal:
          path: spec.dependsOn
          value: []
        documentSelector: *platformRelayRelease
      - equal:
          path: spec.dependsOn
          value:
            - name: platform-external-config
              namespace: platform-ops
        documentSelector: *platformCollectorRelease

  - it: should pass custom values to each child chart and keep the ConfigMap link
    set:
      observability.vmStack.namespace: metrics
      observability.ncclProfiles.releaseName: custom-nccl-profiles
      observability.ncclProfiles.configMap.values.resources:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: custom-nccl-profiles-agent
          data:
            relay: "custom: relay"
      observability.ncclProfiles.collector.values:
        image:
          repository: example.test/custom-agent
        configMap:
          existingName: custom-nccl-profiles-agent
    asserts:
      - equal:
          path: spec.releaseName
          value: custom-nccl-profiles-cm
        documentSelector: &defaultRelayRelease {path: metadata.name, value: RELEASE-NAME-otelcol-nccl-profiles-cm}
      - equal:
          path: spec.releaseName
          value: custom-nccl-profiles
        documentSelector: &defaultCollectorRelease {path: metadata.name, value: RELEASE-NAME-otelcol-nccl-profiles}
      - equal:
          path: spec.targetNamespace
          value: metrics
        documentSelector: {path: kind, value: HelmRelease, matchMany: true}
      - equal:
          path: data["values.yaml"].resources[0].metadata.name
          value: custom-nccl-profiles-agent
        documentSelector: &defaultRelayValues {path: metadata.name, value: RELEASE-NAME-otelcol-nccl-profiles-cm-values}
      - equal:
          path: data["values.yaml"].resources[0].data.relay
          value: "custom: relay"
        documentSelector: *defaultRelayValues
      - notExists:
          path: data["values.yaml"].image
        documentSelector: *defaultRelayValues
      - equal:
          path: data["values.yaml"].configMap
          value: {create: false, existingName: custom-nccl-profiles-agent}
        documentSelector: &defaultCollectorValues {path: metadata.name, value: RELEASE-NAME-otelcol-nccl-profiles-values}
      - equal:
          path: data["values.yaml"].image.repository
          value: example.test/custom-agent
        documentSelector: *defaultCollectorValues
      - equal:
          path: data["values.yaml"].resources.requests.cpu
          value: 100m
        documentSelector: *defaultCollectorValues

  - it: should allow the ConfigMap release to defer all values to valuesFrom
    set:
      observability.ncclProfiles.configMap.values: null
    asserts:
      - equal:
          path: data["values.yaml"]
          value: {}
        documentSelector: *defaultRelayValues
      - equal:
          path: spec.valuesFrom[1].name
          value: terraform-opentelemetry-collector-nccl-profiles-cm
        documentSelector: *defaultRelayRelease

  - it: should keep the default relay pipelines, queue storage and deletion interval
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-otelcol-nccl-profiles-cm-values
    asserts:
      - equal:
          path: data["values.yaml"].resources[0].metadata.name
          value: opentelemetry-collector-nccl-profiles-agent
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: '/mnt/jail/opt/soperator-outputs/shared/nccl_profiles/\*/\*/\*\.log'
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: 'logs/nccl_metrics:\s+receivers:\s+- filelog/nccl_metrics\s+exporters:\s+- ncclmetrics'
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: 'metrics/nccl_metrics:\s+receivers:\s+- ncclmetrics\s+exporters:\s+- otlp_http/victoriametrics'
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: 'queue_size: 30000\s+num_consumers: 10\s+storage: file_storage'
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: 'delete_after_read: true\s+delete_after_read_min_age: 15m'

  - it: should keep one shared-storage collector on system nodes
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-otelcol-nccl-profiles-values
    asserts:
      - equal:
          path: data["values.yaml"].mode
          value: deployment
      - equal:
          path: data["values.yaml"].replicaCount
          value: 1
      - equal:
          path: data["values.yaml"].rollout.strategy
          value: Recreate
      - equal:
          path: data["values.yaml"].affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          value: [system]
      - equal:
          path: data["values.yaml"].configMap
          value: {create: false, existingName: opentelemetry-collector-nccl-profiles-agent}
      - equal:
          path: data["values.yaml"].extraVolumes[0].hostPath.path
          value: /mnt/jail
      - equal:
          path: data["values.yaml"].extraVolumeMounts[0].readOnly
          value: false
      - equal:
          path: data["values.yaml"].extraVolumeMounts[1].mountPath
          value: /var/lib/otelcol-nccl-profiles
      - matchRegex:
          path: data["values.yaml"].initContainers[1].command[2]
          pattern: '/mnt/jail/opt/soperator-outputs/shared/nccl_profiles'
      - equal:
          path: data["values.yaml"].command.extraArgs[0]
          value: --feature-gates=-telemetry.UseLocalHostAsDefaultMetricsAddress,filelog.allowFileDeletion

  - it: should accept a native worker DaemonSet profile for node-local storage
    set:
      observability.ncclProfiles.collector.values:
        mode: daemonset
        replicaCount: null
        rollout:
          strategy: RollingUpdate
          rollingUpdate:
            maxUnavailable: 50%
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: slurm.nebius.ai/nodeset, operator: In, values: [worker]}
        tolerations:
          - {effect: NoSchedule, key: nvidia.com/gpu, operator: Exists}
    asserts:
      - equal:
          path: data["values.yaml"].mode
          value: daemonset
        documentSelector: *defaultCollectorValues
      - notExists:
          path: data["values.yaml"].replicaCount
        documentSelector: *defaultCollectorValues
      - equal:
          path: data["values.yaml"].rollout.strategy
          value: RollingUpdate
        documentSelector: *defaultCollectorValues
      - equal:
          path: data["values.yaml"].rollout.rollingUpdate.maxUnavailable
          value: 50%
        documentSelector: *defaultCollectorValues
      - equal:
          path: data["values.yaml"].affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values
          value: [worker]
        documentSelector: *defaultCollectorValues
      - contains:
          path: data["values.yaml"].tolerations
          content: {effect: NoSchedule, key: nvidia.com/gpu, operator: Exists}
        documentSelector: *defaultCollectorValues
      - equal:
          path: spec.dependsOn[2].name
          value: RELEASE-NAME-otelcol-nccl-profiles-cm
        documentSelector: *defaultCollectorRelease

  - it: should pass paired relay and collector settings for storage and deletion disabled
    set:
      observability.ncclProfiles.configMap.values.resources:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: opentelemetry-collector-nccl-profiles-agent
          data:
            relay: |
              receivers:
                filelog/nccl_metrics:
                  include:
                    - /mnt/jail/custom/nccl/*/*/*.log
              exporters:
                otlp_http/victoriametrics:
                  metrics_endpoint: http://example.test:8428/custom
                  sending_queue:
                    enabled: true
                    sizer: items
                    queue_size: 4321
                    num_consumers: 7
              connectors:
                ncclmetrics:
              extensions:
                health_check:
                  endpoint: 0.0.0.0:13133
              service:
                extensions: [health_check]
                pipelines:
                  logs/nccl_metrics:
                    receivers: [filelog/nccl_metrics]
                    exporters: [ncclmetrics]
                  metrics/nccl_metrics:
                    receivers: [ncclmetrics]
                    exporters: [otlp_http/victoriametrics]
      observability.ncclProfiles.collector.values:
        command:
          extraArgs: []
        extraVolumes:
          - name: jail
            hostPath:
              path: /mnt/jail
              type: Directory
        extraVolumeMounts:
          - name: jail
            mountPath: /mnt/jail
            readOnly: true
        initContainers:
          - name: init-nccl-profiles-dump-dir
            image: busybox:1.37
            volumeMounts:
              - name: jail
                mountPath: /mnt/jail
            command: [sh, -ec, 'mkdir -p /mnt/jail/custom/nccl']
        ports:
          metrics:
            enabled: false
        podMonitor:
          enabled: false
    asserts:
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: '/mnt/jail/custom/nccl/\*/\*/\*\.log'
        documentSelector: *defaultRelayValues
      - matchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: 'queue_size: 4321\s+num_consumers: 7'
        documentSelector: *defaultRelayValues
      - notMatchRegex:
          path: data["values.yaml"].resources[0].data.relay
          pattern: 'file_storage|delete_after_read'
        documentSelector: *defaultRelayValues
      - lengthEqual:
          path: data["values.yaml"].extraVolumes
          count: 1
        documentSelector: *defaultCollectorValues
      - equal:
          path: data["values.yaml"].extraVolumeMounts
          value: [{name: jail, mountPath: /mnt/jail, readOnly: true}]
        documentSelector: *defaultCollectorValues
      - matchRegex:
          path: data["values.yaml"].initContainers[0].command[2]
          pattern: '/mnt/jail/custom/nccl'
        documentSelector: *defaultCollectorValues
      - equal:
          path: data["values.yaml"].command.extraArgs
          value: []
        documentSelector: *defaultCollectorValues

---

suite: test values override default values nodesets
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/nodesets.yaml
set:
  nodesets.enabled: true
tests:
  - it: should use custom values when provided
    set:
      nodesets.values:
        clusterName: custom-slurm
        priorityClasses:
          - name: soperator-worker-high-priority
            value: 1000
        nodesets:
          - name: test-nodeset
            replicas: 3
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].clusterName
          value: custom-slurm
        documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
      - equal:
          path: data["values.yaml"].priorityClasses[0].name
          value: soperator-worker-high-priority
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].priorityClasses[0].value
          value: 1000
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].nodesets[0].replicas
          value: 3
        documentSelector: *baseConfigMap

  - it: should omit the cluster name when cleared
    set:
      nodesets.values.clusterName: null
    documentSelector: *baseConfigMap
    asserts:
      - notExists:
          path: data["values.yaml"].clusterName

