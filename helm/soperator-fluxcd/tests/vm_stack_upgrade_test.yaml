suite: VM stack upgrade compatibility
templates:
  - templates/vm-stack.yaml
  - templates/victoria-metrics-operator-crds.yaml
tests:
  - it: renders matching stack and CRD chart defaults
    asserts:
      - equal:
          path: spec.chart.spec.version
          value: 0.80.*
        template: templates/vm-stack.yaml
      - equal:
          path: spec.chart.spec.version
          value: 0.10.1
        template: templates/victoria-metrics-operator-crds.yaml
  - it: keeps readiness checks enabled with longer recovery limits
    template: templates/vm-stack.yaml
    asserts:
      - equal:
          path: spec.timeout
          value: 30m
      - equal:
          path: spec.install.remediation.retries
          value: 6
      - equal:
          path: spec.upgrade.remediation.retries
          value: 6
      - notExists:
          path: spec.install.disableWait
      - notExists:
          path: spec.upgrade.disableWait
  - it: renders Grafana image and its URL plugin in the new format
    template: templates/vm-stack.yaml
    asserts:
      - equal:
          path: spec.values.grafana.image.tag
          value: "13.1.4"
      - equal:
          path: spec.values.grafana.plugins[0]
          value: grafana-lokiexplore-app@1.0.14@https://storage.googleapis.com/integration-artifacts/grafana-lokiexplore-app/grafana-lokiexplore-app-latest.zip
  - it: preserves metric filtering under the new chart scrape key
    template: templates/vm-stack.yaml
    set:
      observability.publicEndpointEnabled: false
    asserts:
      - equal:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[0].metricRelabelConfigs[0].regex
          value: (uid|container_id|image_id)
      - notExists:
          path: spec.values.kube-state-metrics.vmServiceScrape
      - equal:
          path: spec.values.vmagent.spec.remoteWrite[0].url
          value: http://vmsingle-metrics-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/api/v1/write
  - it: preserves custom chart versions and Grafana settings
    template: templates/vm-stack.yaml
    set:
      observability.vmStack.version: 0.80.1
      observability.vmStack.values.grafana.image.tag: "13.1.5"
    asserts:
      - equal:
          path: spec.chart.spec.version
          value: 0.80.1
      - equal:
          path: spec.values.grafana.image.tag
          value: "13.1.5"
