suite: test notifier
templates:
  - templates/notifier.yaml

set:
  fullnameOverride: notifier-test
  observability:
    enabled: true
    vmStack:
      enabled: true
  notifier:
    enabled: true

tests:
  - it: should not be created when VMStack is disabled
    set:
      observability.vmStack.enabled: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: should handle enabled flag gracefully
    set:
      notifier:
        enabled: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: should allow the webhook URL to come from valuesFrom
    asserts:
      - isKind:
          of: HelmRelease
      - notExists:
          path: spec.values.slack
      - equal:
          path: spec.valuesFrom
          value:
            - kind: ConfigMap
              name: terraform-soperator-notifier
              optional: true
              valuesKey: values.yaml
            - kind: ConfigMap
              name: soperator-notifier
              optional: true
              valuesKey: values.yaml

  - it: should forward an inline webhook URL with the default name override
    set:
      notifier:
        values:
          slack:
            webhookUrl: &slackUrl "http://foo.bar/x/y/z"
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: HelmRelease
      - equal:
          path: spec.values.nameOverride
          value: "soperator-notifier"
      - equal:
          path: spec.values.slack.webhookUrl
          value: *slackUrl

  - it: should pass custom child chart values
    set:
      notifier:
        values:
          slack:
            webhookUrl: *slackUrl
          dataSourceUrl: &dataSourceUrl http://metrics.example.invalid:8428
          alertManager:
            replicas: 2
    asserts:
      - equal:
          path: spec.values.dataSourceUrl
          value: *dataSourceUrl
      - equal:
          path: spec.values.alertManager.replicas
          value: 2

  - it: should depend on namespaces and VMStack with VictoriaLogs disabled
    set:
      observability.vmLogs.enabled: false
    asserts:
      - equal:
          path: spec.dependsOn
          value:
            - name: notifier-test-ns
            - name: notifier-test-vm-stack

  - it: should replace the default dependencies with the configured list
    set:
      notifier.dependsOn: &dependencies
        - name: external-metrics
          namespace: observability
    asserts:
      - equal:
          path: spec.dependsOn
          value: *dependencies

  - it: should clear dependencies with an explicit empty list
    set:
      notifier.dependsOn: []
    asserts:
      - equal:
          path: spec.dependsOn
          value: []
