suite: test notifier
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/notifier.yaml

set:
  fullnameOverride: notifier-test
  observability:
    enabled: true
    vmStack:
      enabled: true
  notifier:
    enabled: true

tests:
  - it: should not be created when VMStack is disabled
    set:
      observability.vmStack.enabled: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: should handle enabled flag gracefully
    set:
      notifier:
        enabled: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: should allow the webhook URL to come from valuesFrom
    asserts:
      - isKind:
          of: HelmRelease
        documentSelector: &helmRelease {path: kind, value: HelmRelease}
      - notExists:
          path: data["values.yaml"].slack
        documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
      - equal:
          path: spec.valuesFrom
          value:
            - kind: ConfigMap
              name: notifier-test-notifier-values
              valuesKey: values.yaml
            - kind: ConfigMap
              name: terraform-soperator-notifier
              optional: true
              valuesKey: values.yaml
            - kind: ConfigMap
              name: soperator-notifier
              optional: true
              valuesKey: values.yaml
        documentSelector: *helmRelease

  - it: should forward a configured webhook URL with the default name override
    set:
      notifier:
        values:
          slack:
            webhookUrl: &slackUrl "http://foo.bar/x/y/z"
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: HelmRelease
        documentSelector: *helmRelease
      - equal:
          path: data["values.yaml"].nameOverride
          value: "soperator-notifier"
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].slack.webhookUrl
          value: *slackUrl
        documentSelector: *baseConfigMap

  - it: should pass custom child chart values
    set:
      notifier:
        values:
          slack:
            webhookUrl: *slackUrl
          dataSourceUrl: &dataSourceUrl http://metrics.example.invalid:8428
          alertManager:
            replicas: 2
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].dataSourceUrl
          value: *dataSourceUrl
      - equal:
          path: data["values.yaml"].alertManager.replicas
          value: 2

  - it: should preserve trailing blank lines in the last chart value
    set:
      notifier.values.zzScript: &script "echo hello\n\n"
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].zzScript
          value: *script

  - it: should depend on namespaces and VMStack with VictoriaLogs disabled
    set:
      observability.vmLogs.enabled: false
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value:
            - name: notifier-test-ns
            - name: notifier-test-vm-stack

  - it: should replace the default dependencies with the configured list
    set:
      notifier.dependsOn: &dependencies
        - name: external-metrics
          namespace: observability
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: *dependencies

  - it: should clear dependencies with an explicit empty list
    set:
      notifier.dependsOn: []
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: []

  - it: should keep only the generated source when the optional references are cleared
    set:
      notifier.valuesFrom: []
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.valuesFrom
          value: &baseOnly
            - kind: ConfigMap
              name: notifier-test-notifier-values
              valuesKey: values.yaml

  - it: should keep the generated source when the configured references are null
    set:
      notifier.valuesFrom: null
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.valuesFrom
          value: *baseOnly
