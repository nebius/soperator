suite: test namespace declarations
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/namespaces.yaml
tests:
  - it: should declare the storage namespace alongside the existing namespaces
    asserts:
      - isKind:
          of: HelmRelease
        documentSelector: &helmRelease {path: kind, value: HelmRelease}
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ns
        documentSelector: *helmRelease
      - contains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: storage-system
        documentSelector: &baseConfigMap {path: kind, value: ConfigMap}

  - it: should deduplicate a namespace declared across observability groups
    set:
      observability.opentelemetry.namespace: shared-observability
      observability.vmLogs.namespace: shared-observability
      observability.vmStack.namespace: shared-observability
      observability.prometheusOperator.namespace: shared-observability
      soperator.monitoringDashboards.namespace: shared-observability
      notifier.namespace: shared-observability
    documentSelector: *baseConfigMap
    asserts:
      - lengthEqual:
          path: data["values.yaml"].resources
          count: 8
      - contains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: shared-observability

  - it: should declare separate namespaces when the names differ
    set:
      observability.vmStack.namespace: metrics
      observability.vmLogs.namespace: telemetry
      observability.opentelemetry.namespace: telemetry
      observability.prometheusOperator.namespace: metrics
      soperator.monitoringDashboards.namespace: metrics
      notifier.namespace: metrics
      csiDriverNfs.namespace: nfs-driver
    documentSelector: *baseConfigMap
    asserts:
      - lengthEqual:
          path: data["values.yaml"].resources
          count: 10
      - contains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: metrics
      - contains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: telemetry
      - contains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: nfs-driver

  - it: should omit namespaces declared only by disabled components
    set:
      certManager.enabled: false
      nodesets.enabled: false
      nodesets.namespace: unused-nodesets
      storageClasses.enabled: false
    documentSelector: *baseConfigMap
    asserts:
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: cert-manager-system
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: unused-nodesets
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: storage-system

  - it: should omit namespaces when the parent component disables their releases
    set:
      observability.enabled: false
      observability.vmStack.namespace: unused-metrics
      notifier.enabled: true
      notifier.namespace: unused-notifier
      nfsServer.enabled: false
      csiDriverNfs.namespace: unused-nfs-driver
    documentSelector: *baseConfigMap
    asserts:
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: unused-metrics
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: unused-notifier
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: unused-nfs-driver

  - it: should omit empty and removed namespace declarations
    set:
      observability.opentelemetry.namespace: ""
      observability.vmLogs.namespace: null
    documentSelector: *baseConfigMap
    asserts:
      - notContains:
          path: data["values.yaml"].resources
          content:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: logs-system
      - lengthEqual:
          path: data["values.yaml"].resources
          count: 8
