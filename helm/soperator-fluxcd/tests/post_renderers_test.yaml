suite: test post-renderers of every HelmRelease
templates:
  - templates/backup-config.yaml
  - templates/backup.yaml
  - templates/cert-manager.yaml
  - templates/csi-driver-nfs.yaml
  - templates/dcgm-exporter.yaml
  - templates/kruise.yaml
  - templates/mariadb-operator-crds.yaml
  - templates/mariadb-operator.yaml
  - templates/monitoring-dashboards.yaml
  - templates/namespaces.yaml
  - templates/nfs-server.yaml
  - templates/nodeconfigurator.yaml
  - templates/nodesets.yaml
  - templates/notifier.yaml
  - templates/o11y-tsa-token-writer.yaml
  - templates/opentelemetry-collector-events.yaml
  - templates/opentelemetry-collector-jail-logs.yaml
  - templates/opentelemetry-collector-logs.yaml
  - templates/opentelemetry-collector-nccl-profiles.yaml
  - templates/prometheus-operator-crds.yaml
  - templates/slurm-cluster-storage.yaml
  - templates/slurm-cluster.yaml
  - templates/soperator-activechecks.yaml
  - templates/soperator-custom-configmaps.yaml
  - templates/soperator.yaml
  - templates/soperatorchecks.yaml
  - templates/storageclasses.yaml
  - templates/tailscale.yaml
  - templates/victoria-metrics-operator-crds.yaml
  - templates/vm-logs.yaml
  - templates/vm-stack.yaml
release:
  name: t
set:
  soperator: {enabled: true, kruise: {enabled: true}, nodeConfigurator: {enabled: true}, soperatorChecks: {enabled: true}, monitoringDashboards: {enabled: true}}
  backup: {enabled: true, config: {enabled: true}}
  certManager: {enabled: true}
  nfsServer: {enabled: true}
  mariadbOperator: {enabled: true}
  notifier: {enabled: true, values: {slack: {webhookUrl: "https://hooks.example/x"}}}
  soperatorActiveChecks: {enabled: true}
  customConfigmaps: {enabled: true}
  nodesets: {enabled: true}
  storageClasses: {enabled: true}
  tailscale: {enabled: true}
  slurmCluster: {enabled: true, slurmClusterStorage: {enabled: true}}
  observability:
    enabled: true
    publicEndpointEnabled: true
    publicEndpointTokenKind: secret
    dcgmExporter: {enabled: true}
    prometheusOperator: {enabled: true}
    vmLogs: {enabled: true}
    vmStack: {enabled: true}
    ncclProfiles: {enabled: true}
    opentelemetry: {enabled: true, logs: {values: {jailLogs: {enabled: true}}}}
tests:
  - it: should not render post-renderers for k8up by default
    template: templates/backup.yaml
    documentSelector:
      path: metadata.name
      value: t-k8up
    asserts:
      - notExists:
          path: spec.postRenderers

  - it: should render post-renderers for k8up from backup.postRenderers
    template: templates/backup.yaml
    documentSelector:
      path: metadata.name
      value: t-k8up
    set:
      backup.postRenderers:
        - kustomize:
            patches:
              - target:
                  kind: ConfigMap
                  name: test
                patch: |
                  - op: add
                    path: /metadata/annotations/namespace
                    value: {{ .Values.slurmCluster.namespace }}
    asserts:
      - equal:
          path: spec.postRenderers[0].kustomize.patches[0].target
          value:
            kind: ConfigMap
            name: test
      - matchRegex:
          path: spec.postRenderers[0].kustomize.patches[0].patch
          pattern: "value: soperator\\n"

  - it: should not render post-renderers for backup-config by default
    template: templates/backup-config.yaml
