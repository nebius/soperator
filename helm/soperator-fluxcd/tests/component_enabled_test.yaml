suite: test general enabled flag behavior
templates:
  - templates/*.yaml
excludeTemplates:
  - templates/helmrepository.yaml
  - templates/notifier.yaml
tests:
  - it: should render nccl profiles config by default reading the jail dump dir
    templates:
      - templates/opentelemetry-collector-nccl-profiles.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-otelcol-nccl-profiles-cm-values
    postRenderer: &decodeValues
      cmd: yq
      args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
    asserts:
      - matchRegex:
          path: 'data["values.yaml"].resources[0].data.relay'
          pattern: '- /mnt/jail/opt/soperator-outputs/shared/nccl_profiles/\*/\*/\*\.log'

  - it: should render nccl profiles collector by default
    templates:
      - templates/opentelemetry-collector-nccl-profiles.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-otelcol-nccl-profiles-values
    postRenderer: *decodeValues
    asserts:
      - exists:
          path: 'data["values.yaml"].podMonitor'

  - it: should not render nccl profiles when ncclProfiles.enabled=false
    set:
      observability.ncclProfiles.enabled: false
    templates:
      - templates/opentelemetry-collector-nccl-profiles.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render jail logs component when jailLogs.enabled=true
    set:
      observability.enabled: true
      observability.opentelemetry.enabled: true
      observability.opentelemetry.jailLogs.enabled: true
    templates:
      - templates/opentelemetry-collector-jail-logs.yaml
    documentSelector: {path: kind, value: ConfigMap, matchMany: true}
    postRenderer: *decodeValues
    asserts:
      - exists:
          path: data["values.yaml"].config.receivers["filelog/health_checker"]
  - it: should not render jail logs component when jailLogs.enabled=false
    set:
      observability.enabled: true
      observability.opentelemetry.enabled: true
      observability.opentelemetry.jailLogs.enabled: false
    templates:
      - templates/opentelemetry-collector-jail-logs.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render tailscale component when tailscale.enabled=true
    set:
      tailscale.enabled: true
    templates:
      - templates/tailscale.yaml
    asserts:
      - hasDocuments:
          count: 2
  - it: should not render tailscale component when tailscale.enabled=false
    set:
      tailscale.enabled: false
    templates:
      - templates/tailscale.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: should render nodesets component when nodesets.enabled=true
    set:
      nodesets.enabled: true
    templates:
      - templates/nodesets.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: HelmRelease
        documentSelector: &helmRelease {path: kind, value: HelmRelease, matchMany: true}
      - equal:
          path: metadata.name
          value: RELEASE-NAME-nodesets
        documentSelector: *helmRelease
      - equal:
          path: spec.chart.spec.chart
          value: helm-nodesets
        documentSelector: *helmRelease
      - equal:
          path: spec.releaseName
          value: soperator-nodesets
        documentSelector: *helmRelease
      - equal:
          path: spec.targetNamespace
          value: soperator
        documentSelector: *helmRelease
  - it: should not render nodesets component when nodesets.enabled=false
    set:
      nodesets.enabled: false
    templates:
      - templates/nodesets.yaml
    asserts:
      - hasDocuments:
          count: 0
