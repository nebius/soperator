suite: test kube-state-metrics scrape config
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/vm-stack.yaml
tests:
  - it: should not set kube-state-metrics scrape size by default
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].vmagent.spec.extraArgs["promscrape.maxScrapeSize"]
          value: "33554432"
        documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
      - equal:
          path: data["values.yaml"].kube-state-metrics.vmScrape.spec.endpoints[0].port
          value: http
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].kube-state-metrics.vmScrape.spec.endpoints[0].max_scrape_size
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].kube-state-metrics.vmScrape.spec.endpoints[1].port
          value: metrics
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].kube-state-metrics.vmScrape.spec.endpoints[1].max_scrape_size
        documentSelector: *baseConfigMap

  - it: should allow overriding kube-state-metrics scrape size
    set:
      observability.vmStack.values.kube-state-metrics.vmScrape.spec.endpoints:
        - {port: http, max_scrape_size: "150554432"}
        - {port: metrics}
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].kube-state-metrics.vmScrape.spec.endpoints[0].max_scrape_size
          value: "150554432"
        documentSelector: *baseConfigMap

  - it: should export node conditions and only unschedulable NoSchedule taints
    documentSelector: *baseConfigMap
    asserts:
      - contains:
          path: data["values.yaml"].kube-state-metrics.collectors
          content: nodes
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_node_status_condition'
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_node_spec_taint'
      - equal:
          path: data["values.yaml"].kube-state-metrics.vmScrape.spec.endpoints[0].metricRelabelConfigs
          value:
            - action: drop
              if:
                - 'kube_node_spec_taint{key!="node.kubernetes.io/unschedulable"}'
                - 'kube_node_spec_taint{effect!="NoSchedule"}'
            - action: labeldrop
              regex: (uid|container_id|image_id)

  - it: should export persistent volume metrics for disk mapping
    asserts:
      - hasDocuments:
          count: 2
      - contains:
          path: data["values.yaml"].kube-state-metrics.collectors
          content: persistentvolumes
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].kube-state-metrics.collectors
          content: persistentvolumeclaims
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolume_info'
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolume_capacity_bytes'
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolumeclaim_info'
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolumeclaim_resource_requests_storage_bytes'
        documentSelector: *baseConfigMap
      - contains:
          path: data["values.yaml"].kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolumeclaim_status_phase'
        documentSelector: *baseConfigMap

  - it: should request a cpu floor for kube-state-metrics by default
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].kube-state-metrics.resources.requests.cpu
          value: 100m
        documentSelector: *baseConfigMap
      - notExists:
          path: data["values.yaml"].kube-state-metrics.resources.limits
        documentSelector: *baseConfigMap

  - it: should pin kube-state-metrics to system nodes
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].kube-state-metrics.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: slurm.nebius.ai/nodeset
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].kube-state-metrics.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: system
        documentSelector: *baseConfigMap

  - it: should pass kube-state-metrics resources through
    set:
      observability.vmStack.values.kube-state-metrics.resources:
        requests:
          cpu: 200m
          memory: 1024Mi
        limits:
          memory: 2048Mi
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: data["values.yaml"].kube-state-metrics.resources.requests.cpu
          value: 200m
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].kube-state-metrics.resources.requests.memory
          value: 1024Mi
        documentSelector: *baseConfigMap
      - equal:
          path: data["values.yaml"].kube-state-metrics.resources.limits.memory
          value: 2048Mi
        documentSelector: *baseConfigMap
