suite: test kube-state-metrics scrape config
templates:
  - templates/vm-stack.yaml
tests:
  - it: should not set kube-state-metrics scrape size by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.values.vmagent.spec.extraArgs["promscrape.maxScrapeSize"]
          value: "33554432"
      - equal:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[0].port
          value: http
      - notExists:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[0].max_scrape_size
      - equal:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[1].port
          value: metrics
      - notExists:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[1].max_scrape_size

  - it: should allow overriding kube-state-metrics scrape size
    set:
      observability.vmStack.values.kubeStateMetrics.maxScrapeSize: "150554432"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[0].max_scrape_size
          value: "150554432"

  - it: should export node conditions and only unschedulable NoSchedule taints
    asserts:
      - contains:
          path: spec.values.kube-state-metrics.collectors
          content: nodes
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_node_status_condition'
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_node_spec_taint'
      - equal:
          path: spec.values.kube-state-metrics.vmScrape.spec.endpoints[0].metricRelabelConfigs
          value:
            - action: drop
              if:
                - 'kube_node_spec_taint{key!="node.kubernetes.io/unschedulable"}'
                - 'kube_node_spec_taint{effect!="NoSchedule"}'
            - action: labeldrop
              regex: (uid|container_id|image_id)

  - it: should export persistent volume metrics for disk mapping
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.values.kube-state-metrics.collectors
          content: persistentvolumes
      - contains:
          path: spec.values.kube-state-metrics.collectors
          content: persistentvolumeclaims
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolume_info'
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolume_capacity_bytes'
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolumeclaim_info'
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolumeclaim_resource_requests_storage_bytes'
      - contains:
          path: spec.values.kube-state-metrics.extraArgs
          content: '--metric-allowlist=kube_persistentvolumeclaim_status_phase'

  - it: should request a cpu floor for kube-state-metrics by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.values.kube-state-metrics.resources.requests.cpu
          value: 100m
      - notExists:
          path: spec.values.kube-state-metrics.resources.limits

  - it: should pin kube-state-metrics to system nodes
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.values.kube-state-metrics.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: slurm.nebius.ai/nodeset
      - equal:
          path: spec.values.kube-state-metrics.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].values[0]
          value: system

  - it: should pass kube-state-metrics resources through
    set:
      observability.vmStack.values.kubeStateMetrics.resources:
        requests:
          cpu: 200m
          memory: 1024Mi
        limits:
          memory: 2048Mi
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.values.kube-state-metrics.resources.requests.cpu
          value: 200m
      - equal:
          path: spec.values.kube-state-metrics.resources.requests.memory
          value: 1024Mi
      - equal:
          path: spec.values.kube-state-metrics.resources.limits.memory
          value: 2048Mi
