suite: test vmagent tsa-token writer
postRenderer:
  cmd: yq
  args: ['(select(.kind == "ConfigMap").data."values.yaml") |= from_yaml', '-']
templates:
  - templates/o11y-tsa-token-writer.yaml

tests:
  - it: should render a HelmRelease using the bedag raw chart
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: secret
        vmStack:
          enabled: true
          namespace: monitoring-system
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: HelmRelease
        documentSelector: &helmRelease {path: kind, value: HelmRelease}
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tsa-token-writer
        documentSelector: *helmRelease
      - equal:
          path: spec.chart.spec.chart
          value: raw
        documentSelector: *helmRelease
      - equal:
          path: spec.chart.spec.sourceRef.name
          value: RELEASE-NAME-bedag
        documentSelector: *helmRelease
      - equal:
          path: spec.dependsOn[0].name
          value: RELEASE-NAME-ns
        documentSelector: *helmRelease

  - it: should maintain the token secret with imds source and host networking
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: secret
        vmStack:
          enabled: true
          namespace: monitoring-system
          tsaToken:
            writer:
              source: imds
    documentSelector: &baseConfigMap {path: kind, value: ConfigMap}
    asserts:
      # resources: ServiceAccount + (Role + RoleBinding) for monitoring/logs + Deployment
      - lengthEqual:
          path: data["values.yaml"].resources
          count: 6
      - equal:
          path: data["values.yaml"].resources[0].kind
          value: ServiceAccount
      - equal:
          path: data["values.yaml"].resources[0].metadata.namespace
          value: monitoring-system
      - equal:
          path: data["values.yaml"].resources[5].kind
          value: Deployment
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.hostNetwork
          value: true
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.containers[0].env[0].value
          value: "imds"
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.containers[0].env[3].value
          value: "monitoring-system logs-system"

  - it: should restrict secret access by resourceName but allow create
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: secret
        vmStack:
          enabled: true
          namespace: monitoring-system
    documentSelector: *baseConfigMap
    asserts:
      - equal:
          path: data["values.yaml"].resources[1].kind
          value: Role
      - equal:
          path: data["values.yaml"].resources[1].rules[0].verbs
          value: ["create"]
      - equal:
          path: data["values.yaml"].resources[1].rules[1].resourceNames
          value: ["o11y-writer-sa-token"]
      - equal:
          path: data["values.yaml"].resources[1].rules[1].verbs
          value: ["get", "patch", "update"]
      - equal:
          path: data["values.yaml"].resources[2].kind
          value: RoleBinding
      - equal:
          path: data["values.yaml"].resources[2].subjects[0].namespace
          value: monitoring-system

  - it: should use file source without host networking and mount the host token
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: secret
        vmStack:
          enabled: true
          namespace: monitoring-system
          tsaToken:
            writer:
              source: file
    documentSelector: *baseConfigMap
    asserts:
      - notExists:
          path: data["values.yaml"].resources[5].spec.template.spec.hostNetwork
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.containers[0].env[0].value
          value: "file"
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.volumes[0].hostPath.path
          value: "/mnt/cloud-metadata"
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/o11ytoken"

  - it: should maintain the secret in every configured namespace
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: secret
        vmStack:
          enabled: true
          namespace: monitoring-system
          tsaToken:
            writer:
              namespaces:
                - monitoring-system
                - logs-system
    documentSelector: *baseConfigMap
    asserts:
      # SA + (Role + RoleBinding) x2 + Deployment
      - lengthEqual:
          path: data["values.yaml"].resources
          count: 6
      - equal:
          path: data["values.yaml"].resources[3].metadata.namespace
          value: logs-system
      - equal:
          path: data["values.yaml"].resources[5].kind
          value: Deployment
      - equal:
          path: data["values.yaml"].resources[5].spec.template.spec.containers[0].env[3].value
          value: "monitoring-system logs-system"

  - it: should not render when publicEndpointEnabled is false
    set:
      observability:
        enabled: true
        publicEndpointEnabled: false
        vmStack:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render for hostPath token kind
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: hostPath
        vmStack:
          enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render when the writer is disabled
    set:
      observability:
        enabled: true
        publicEndpointEnabled: true
        publicEndpointTokenKind: secret
        vmStack:
          enabled: true
          tsaToken:
            writer:
              enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should replace the default dependency with a configured HelmRelease reference
    set:
      fullnameOverride: storage
      observability.tsaToken.writer.dependsOn:
        - name: '{{ include "soperator-fluxcd.fullname" . }}-prerequisite'
          namespace: ops
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: [{name: storage-prerequisite, namespace: ops}]

  - it: should clear the default dependency with an empty list
    set:
      observability.tsaToken.writer.dependsOn: []
    documentSelector: *helmRelease
    asserts:
      - equal:
          path: spec.dependsOn
          value: []
