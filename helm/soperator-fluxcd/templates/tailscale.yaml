{{- if .Values.tailscale.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-tailscale
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.tailscale.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tailscale.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: raw
      interval: {{ .Values.tailscale.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-bedag
      version: {{ .Values.tailscale.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.tailscale "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.tailscale.install | nindent 4 }}
  interval: {{ .Values.tailscale.interval }}
  timeout: {{ .Values.tailscale.timeout }}
  upgrade:
    {{- toYaml .Values.tailscale.upgrade | nindent 4 }}
  {{- if ne .Values.tailscale.values nil }}
  values:
    {{- tpl (toYaml .Values.tailscale.values) $ | nindent 4 }}
  {{- end }}
{{- end }}
