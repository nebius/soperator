{{- if and .Values.soperator.enabled .Values.soperator.nodeConfigurator.enabled }}
{{- $valuesName := printf "%s-nodeconfigurator-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-nodeconfigurator
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.soperator.nodeConfigurator.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.soperator.nodeConfigurator.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-nodeconfigurator
      interval: {{ .Values.soperator.nodeConfigurator.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.soperator.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.soperator.nodeConfigurator "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.soperator.nodeConfigurator.install | nindent 4 }}
  interval: {{ .Values.soperator.nodeConfigurator.interval }}
  timeout: {{ .Values.soperator.nodeConfigurator.timeout }}
  releaseName: {{ .Values.soperator.nodeConfigurator.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.soperator.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.soperator.nodeConfigurator.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.soperator.nodeConfigurator.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.soperator.nodeConfigurator.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
