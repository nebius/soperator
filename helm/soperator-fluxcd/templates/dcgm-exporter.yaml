{{- if and .Values.observability.enabled .Values.observability.dcgmExporter.enabled }}
{{- $valuesName := printf "%s-dcgm-exporter-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-dcgm-exporter
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.observability.dcgmExporter.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.dcgmExporter.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator-dcgm-exporter
      interval: {{ .Values.observability.dcgmExporter.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.observability.dcgmExporter.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.observability.dcgmExporter "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.observability.dcgmExporter.install | nindent 4 }}
  interval: {{ .Values.observability.dcgmExporter.interval }}
  timeout: {{ .Values.observability.dcgmExporter.timeout }}
  releaseName: {{ .Values.observability.dcgmExporter.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.observability.dcgmExporter.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.observability.dcgmExporter.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.observability.dcgmExporter.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.observability.dcgmExporter.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
