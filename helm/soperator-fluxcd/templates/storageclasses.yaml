{{- if .Values.storageClasses.enabled }}
{{- $valuesName := printf "%s-storageclasses-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-storageclasses
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.storageClasses.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.storageClasses.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-storageclasses
      interval: {{ .Values.storageClasses.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.storageClasses.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.storageClasses "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.storageClasses.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.storageClasses.upgrade | nindent 4 }}
  interval: {{ .Values.storageClasses.interval }}
  timeout: {{ .Values.storageClasses.timeout }}
  releaseName: {{ .Values.storageClasses.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.storageClasses.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.storageClasses.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.storageClasses.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
