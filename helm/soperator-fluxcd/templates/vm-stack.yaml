{{- if and .Values.observability.enabled .Values.observability.vmStack.enabled }}
{{- if .Values.observability.publicEndpointEnabled }}
{{- include "soperator-fluxcd.validatePublicEndpointTokenKind" . -}}
{{- end }}
{{- $valuesName := printf "%s-vm-stack-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-vm-stack
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.observability.vmStack.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.vmStack.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      interval: {{ .Values.observability.vmStack.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-victoriametrics
      version: {{ .Values.observability.vmStack.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.observability.vmStack "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.observability.vmStack.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.observability.vmStack.upgrade | nindent 4 }}
  interval: {{ .Values.observability.vmStack.interval }}
  timeout: {{ .Values.observability.vmStack.timeout }}
  releaseName: {{ .Values.observability.vmStack.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.observability.vmStack.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.observability.vmStack.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.observability.vmStack.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
