{{- if and .Values.slurmCluster.enabled .Values.slurmCluster.slurmClusterStorage.enabled }}
{{- $valuesName := printf "%s-slurm-cluster-storage-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-slurm-cluster-storage
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.slurmCluster.slurmClusterStorage.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.slurmCluster.slurmClusterStorage.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-slurm-cluster-storage
      interval: {{ .Values.slurmCluster.slurmClusterStorage.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.slurmCluster.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.slurmCluster.slurmClusterStorage "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.slurmCluster.slurmClusterStorage.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.slurmCluster.slurmClusterStorage.upgrade | nindent 4 }}
  interval: {{ .Values.slurmCluster.slurmClusterStorage.interval }}
  timeout: {{ .Values.slurmCluster.slurmClusterStorage.timeout }}
  releaseName: {{ .Values.slurmCluster.slurmClusterStorage.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.slurmCluster.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.slurmCluster.slurmClusterStorage.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.slurmCluster.slurmClusterStorage.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
