{{ if .Values.soperator.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-soperator
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.soperator.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.soperator.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator
      interval: {{ .Values.soperator.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.soperator.version }}
  dependsOn:
  - name: {{ include "soperator-fluxcd.fullname" . }}-ns
  - name: {{ include "soperator-fluxcd.fullname" . }}-kruise
  {{- if .Values.certManager.enabled }}
  - name: {{ include "soperator-fluxcd.fullname" . }}-cert-manager
  {{- end }}
  install:
    {{- toYaml .Values.soperator.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.soperator.upgrade | nindent 4 }}
  interval: {{ .Values.soperator.interval }}
  timeout: {{ .Values.soperator.timeout }}
  releaseName: {{ .Values.soperator.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.soperator.namespace | nindent 2 }}
  values:
    {{- toYaml .Values.soperator.values | nindent 4 }}
  valuesFrom:
  - kind: ConfigMap
    name: terraform-soperator
    optional: true
    valuesKey: values.yaml
  - kind: ConfigMap
    name: soperator
    optional: true
    valuesKey: values.yaml
{{- end }}
