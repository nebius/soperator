{{- $otel := .Values.observability.opentelemetry }}
{{- if and .Values.observability.enabled $otel.enabled }}
{{- $collector := $otel.events }}
{{- $valuesName := printf "%s-opentelemetry-collector-events-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-opentelemetry-collector-events
  labels:
    {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with $collector.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $collector.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: opentelemetry-collector
      interval: {{ $collector.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-opentelemetry-collector
      version: {{ $collector.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" $collector "root" .) | nindent 2 }}
  install:
    {{- toYaml $collector.install | nindent 4 }}
  upgrade:
    {{- toYaml $collector.upgrade | nindent 4 }}
  interval: {{ $collector.interval }}
  timeout: {{ $collector.timeout }}
  releaseName: opentelemetry-collector-events
  {{- include "soperator-fluxcd.targetNamespace" $otel.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" $collector.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := include "soperator-fluxcd.otelCollectorValues" (dict "root" $ "collector" "events" "values" $collector.values) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
