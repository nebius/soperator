{{- if .Values.certManager.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-cert-manager
  labels:
    {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.certManager.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.certManager.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: cert-manager
      interval: {{ .Values.certManager.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-cert-manager
      version: {{ .Values.certManager.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.certManager "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.certManager.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.certManager.upgrade | nindent 4 }}
  interval: {{ .Values.certManager.interval }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.certManager.namespace | nindent 2 }}
  releaseName: {{ .Values.certManager.releaseName }}
  timeout: {{ .Values.certManager.timeout }}
  values:
    {{- include "soperator-fluxcd.platformValues" (dict "component" .Values.certManager "root" $ "prometheusEnabled" .Values.observability.prometheusOperator.enabled) | nindent 4 }}
  valuesFrom:
  - kind: ConfigMap
    name: terraform-cert-manager
    optional: true
    valuesKey: values.yaml
  - kind: ConfigMap
    name: cert-manager
    optional: true
    valuesKey: values.yaml
{{- end }}
