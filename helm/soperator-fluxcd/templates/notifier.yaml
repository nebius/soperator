{{ if and (and .Values.notifier .Values.notifier.enabled) (and .Values.observability (and .Values.observability.enabled (and .Values.observability.vmStack .Values.observability.vmStack.enabled))) }}
{{- $valuesName := printf "%s-notifier-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-soperator-notifier
  labels:
    {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.notifier.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.notifier.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator-notifier
      interval: {{ .Values.notifier.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.notifier.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.notifier "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.notifier.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.notifier.upgrade | nindent 4 }}
  interval: {{ .Values.notifier.interval }}
  timeout: {{ .Values.notifier.timeout }}
  releaseName: {{ .Values.notifier.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.notifier.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.notifier.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.notifier.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
