{{ if .Values.soperatorActiveChecks.enabled }}
{{- $valuesName := printf "%s-soperator-activechecks-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-soperator-activechecks
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.soperatorActiveChecks.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.soperatorActiveChecks.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator-activechecks
      interval: {{ .Values.soperatorActiveChecks.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.soperatorActiveChecks.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.soperatorActiveChecks "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.soperatorActiveChecks.install | nindent 4 }}
  interval: {{ .Values.soperatorActiveChecks.interval }}
  timeout: {{ .Values.soperatorActiveChecks.timeout }}
  releaseName: {{ .Values.soperatorActiveChecks.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.soperatorActiveChecks.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.soperatorActiveChecks.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.soperatorActiveChecks.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.soperatorActiveChecks.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
