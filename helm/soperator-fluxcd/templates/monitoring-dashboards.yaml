{{- if and .Values.soperator.enabled .Values.soperator.monitoringDashboards.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-monitoring-dashboards
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.soperator.monitoringDashboards.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.soperator.monitoringDashboards.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator-monitoring-dashboards
      interval: {{ .Values.soperator.monitoringDashboards.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.soperator.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.soperator.monitoringDashboards "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.soperator.monitoringDashboards.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.soperator.monitoringDashboards.upgrade | nindent 4 }}
  interval: {{ .Values.soperator.monitoringDashboards.interval }}
  timeout: {{ .Values.soperator.monitoringDashboards.timeout }}
  releaseName: {{ .Values.soperator.monitoringDashboards.releaseName }}
  targetNamespace: {{ .Values.soperator.monitoringDashboards.namespace }}
  {{- with include "soperator-fluxcd.valuesWithLegacyOverride" .Values.soperator.monitoringDashboards }}
  values:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
