{{- if and .Values.backup.enabled .Values.backup.config.enabled }}
{{- $valuesName := printf "%s-backup-config-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-backup-config
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.backup.config.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.backup.config.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator-backup-config
      interval: {{ default .Values.backup.interval .Values.backup.config.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ default .Chart.AppVersion .Values.backup.config.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.backup.config "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.backup.config.install | nindent 4 }}
  interval: {{ default .Values.backup.interval .Values.backup.config.interval }}
  timeout: {{ default .Values.backup.timeout .Values.backup.config.timeout }}
  releaseName: {{ .Values.backup.config.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.slurmCluster.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.backup.config.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.backup.config.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.backup.config.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
