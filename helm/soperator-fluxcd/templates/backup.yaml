{{- if .Values.backup.enabled }}
{{- $valuesName := printf "%s-k8up-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-k8up
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.backup.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.backup.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: k8up
      interval: {{ .Values.backup.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-k8up
      version: {{ .Values.backup.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.backup "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.backup.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.backup.upgrade | nindent 4 }}
  interval: {{ .Values.backup.interval }}
  timeout: {{ .Values.backup.timeout }}
  releaseName: {{ .Values.backup.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.backup.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.backup.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := include "soperator-fluxcd.platformValues" (dict "component" .Values.backup "root" $ "prometheusEnabled" .Values.observability.prometheusOperator.enabled) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
