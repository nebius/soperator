{{- if .Values.nodesets.enabled }}
{{- $valuesName := printf "%s-nodesets-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-nodesets
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.nodesets.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodesets.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-nodesets
      interval: {{ .Values.nodesets.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.nodesets.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.nodesets "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.nodesets.install | nindent 4 }}
  interval: {{ .Values.nodesets.interval }}
  timeout: {{ .Values.nodesets.timeout }}
  releaseName: {{ .Values.nodesets.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.nodesets.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.nodesets.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.nodesets.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.nodesets.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
