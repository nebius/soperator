{{- if .Values.nfsServer.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-csi-driver-nfs
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.csiDriverNfs.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.csiDriverNfs.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: csi-driver-nfs
      interval: {{ .Values.csiDriverNfs.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-csi-driver-nfs
      version: {{ .Values.csiDriverNfs.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.csiDriverNfs "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.csiDriverNfs.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.csiDriverNfs.upgrade | nindent 4 }}
  interval: {{ .Values.csiDriverNfs.interval }}
  timeout: {{ .Values.csiDriverNfs.timeout }}
  releaseName: {{ .Values.csiDriverNfs.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.csiDriverNfs.namespace | nindent 2 }}
  {{- with .Values.csiDriverNfs.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
