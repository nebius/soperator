{{- $observability := .Values.observability | default dict -}}
{{- $soperator := .Values.soperator | default dict -}}
{{- $namespaces := list .Values.slurmCluster.namespace $soperator.namespace -}}
{{- $components := list
    .Values.mariadbOperator
    .Values.certManager
    .Values.backup
    .Values.nfsServer
    .Values.storageClasses
    .Values.nodesets
    .Values.soperatorActiveChecks
    .Values.customConfigmaps
    .Values.tailscale
-}}
{{- if and .Values.nfsServer .Values.nfsServer.enabled .Values.csiDriverNfs -}}
  {{- $namespaces = append $namespaces .Values.csiDriverNfs.namespace -}}
{{- end -}}
{{- if $soperator.enabled -}}
  {{- $components = append $components $soperator.monitoringDashboards -}}
{{- end -}}
{{- if $observability.enabled -}}
  {{- $components = concat $components (list
      $observability.opentelemetry
      $observability.vmLogs
      $observability.vmStack
      $observability.prometheusOperator
      $observability.dcgmExporter
  ) -}}
  {{- if and $observability.vmStack $observability.vmStack.enabled -}}
    {{- $components = append $components .Values.notifier -}}
  {{- end -}}
{{- end -}}
{{- range compact $components -}}
  {{- if .enabled -}}
    {{- $namespaces = append $namespaces .namespace -}}
  {{- end -}}
{{- end -}}
{{- $resources := list -}}
{{- range compact $namespaces | uniq -}}
  {{- $resources = append $resources (dict "apiVersion" "v1" "kind" "Namespace" "metadata" (dict "name" .)) -}}
{{- end -}}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-ns
  labels:
    {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.ns.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.ns.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: raw
      interval: {{ .Values.ns.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-bedag
      version: {{ .Values.ns.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.ns "root" $) | nindent 2 }}
  install:
    remediation:
      retries: 3
  interval: {{ .Values.ns.interval }}
  values:
    {{- toYaml (dict "resources" $resources) | nindent 4 }}
