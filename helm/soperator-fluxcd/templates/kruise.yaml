{{ if and .Values.soperator.enabled .Values.soperator.kruise.enabled}}
{{- $valuesName := printf "%s-kruise-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-kruise
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.soperator.kruise.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.soperator.kruise.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: kruise
      interval: {{ .Values.soperator.kruise.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-kruise
      version: {{ .Values.soperator.kruise.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.soperator.kruise "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.soperator.kruise.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.soperator.kruise.upgrade | nindent 4 }}
  interval: {{ .Values.soperator.kruise.interval }}
  timeout: {{ .Values.soperator.kruise.timeout }}
  releaseName: {{ .Values.soperator.kruise.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.slurmCluster.namespace | nindent 2 }}
  {{- $values := .Values.soperator.kruise.values }}
  {{- if hasKey .Values.soperator.kruise "overrideValues" }}
    {{- $legacyValues := .Values.soperator.kruise.overrideValues }}
    {{- if eq $legacyValues nil }}
      {{- $values = $legacyValues }}
    {{- else }}
      {{- $values = deepCopy ($values | default dict) }}
      {{- include "soperator-fluxcd.mergeKruiseOverrides" (dict "values" $values "overrides" $legacyValues) }}
    {{- end }}
  {{- end }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.soperator.kruise.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml ($values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
