{{- if .Values.customConfigmaps.enabled }}
{{- $valuesName := printf "%s-custom-configmaps-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-custom-configmaps
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.customConfigmaps.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.customConfigmaps.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-soperator-custom-configmaps
      interval: {{ .Values.customConfigmaps.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.customConfigmaps.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.customConfigmaps "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.customConfigmaps.install | nindent 4 }}
  upgrade:
    {{- toYaml .Values.customConfigmaps.upgrade | nindent 4 }}
  interval: {{ .Values.customConfigmaps.interval }}
  timeout: {{ .Values.customConfigmaps.timeout }}
  releaseName: {{ .Values.customConfigmaps.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.customConfigmaps.namespace | nindent 2 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.customConfigmaps.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := include "soperator-fluxcd.valuesWithLegacyOverride" .Values.customConfigmaps | default "{}" }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
