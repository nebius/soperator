{{- $nccl := .Values.observability.ncclProfiles }}
{{- if and .Values.observability.enabled .Values.observability.vmStack.enabled $nccl.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-otelcol-nccl-profiles-cm
  labels:
    {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with $nccl.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $nccl.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: raw
      interval: {{ $nccl.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-bedag
      version: {{ $nccl.version.bedag }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" $nccl.configMap "root" $) | nindent 2 }}
  install:
    {{- toYaml $nccl.install | nindent 4 }}
  upgrade:
    {{- toYaml $nccl.upgrade | nindent 4 }}
  interval: {{ $nccl.interval }}
  timeout: {{ $nccl.timeout }}
  releaseName: {{ $nccl.releaseName }}-cm
  {{- include "soperator-fluxcd.targetNamespace" .Values.observability.vmStack.namespace | nindent 2 }}
  {{- with $nccl.configMap.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  valuesFrom:
    - kind: ConfigMap
      name: terraform-opentelemetry-collector-nccl-profiles-cm
      optional: true
      valuesKey: values.yaml
    - kind: ConfigMap
      name: opentelemetry-collector-nccl-profiles-cm
      optional: true
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-otelcol-nccl-profiles
  labels:
    {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with $nccl.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $nccl.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: opentelemetry-collector
      interval: {{ $nccl.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-opentelemetry-collector
      version: {{ $nccl.version.opentelemetryCollector }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" $nccl.collector "root" $) | nindent 2 }}
  install:
    {{- toYaml $nccl.install | nindent 4 }}
  upgrade:
    {{- toYaml $nccl.upgrade | nindent 4 }}
  interval: {{ $nccl.interval }}
  timeout: {{ $nccl.timeout }}
  releaseName: {{ $nccl.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.observability.vmStack.namespace | nindent 2 }}
  {{- with $nccl.collector.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  valuesFrom:
    - kind: ConfigMap
      name: terraform-opentelemetry-collector-nccl-profiles
      optional: true
      valuesKey: values.yaml
    - kind: ConfigMap
      name: opentelemetry-collector-nccl-profiles
      optional: true
      valuesKey: values.yaml
{{- end }}
