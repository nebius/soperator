{{- if .Values.mariadbOperator.enabled }}
{{- $valuesName := printf "%s-mariadb-operator-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-mariadb-operator
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.mariadbOperator.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.mariadbOperator.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: mariadb-operator
      interval: {{ .Values.mariadbOperator.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-mariadb-operator
      version: {{ .Values.mariadbOperator.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.mariadbOperator "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.mariadbOperator.install | nindent 4 }}
  interval: {{ .Values.mariadbOperator.interval }}
  timeout: {{ .Values.mariadbOperator.timeout }}
  releaseName: {{ .Values.mariadbOperator.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.mariadbOperator.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.mariadbOperator.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.mariadbOperator.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := include "soperator-fluxcd.platformValues" (dict "component" .Values.mariadbOperator "root" $) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
