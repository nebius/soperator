{{- if and .Values.observability.enabled .Values.observability.vmLogs.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-vm-logs
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.observability.vmLogs.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.observability.vmLogs.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: victoria-logs-single
      interval: {{ .Values.observability.vmLogs.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-victoriametrics
      version: {{ .Values.observability.vmLogs.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.observability.vmLogs "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.observability.vmLogs.install | nindent 4 }}
  interval: {{ .Values.observability.vmLogs.interval }}
  timeout: {{ .Values.observability.vmLogs.timeout }}
  releaseName: {{ .Values.observability.vmLogs.releaseName }}
  {{- include "soperator-fluxcd.targetNamespace" .Values.observability.vmLogs.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.observability.vmLogs.upgrade | nindent 4 }}
  {{- with .Values.observability.vmLogs.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  valuesFrom:
  - kind: ConfigMap
    name: terraform-vm-logs
    optional: true
    valuesKey: values.yaml
  - kind: ConfigMap
    name: vm-logs
    optional: true
    valuesKey: values.yaml
{{- end }}
