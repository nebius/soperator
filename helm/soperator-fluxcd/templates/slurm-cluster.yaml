{{- $valuesName := printf "%s-slurm-cluster-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-slurm-cluster
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.slurmCluster.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.slurmCluster.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: helm-slurm-cluster
      interval: {{ .Values.slurmCluster.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-soperator
      version: {{ .Values.slurmCluster.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.slurmCluster "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.slurmCluster.install | nindent 4 }}
  interval: {{ .Values.slurmCluster.interval }}
  timeout: {{ .Values.slurmCluster.timeout }}
  releaseName: soperator
  {{- include "soperator-fluxcd.targetNamespace" .Values.slurmCluster.namespace | nindent 2 }}
  upgrade:
    {{- toYaml .Values.slurmCluster.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.slurmCluster.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.slurmCluster.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
