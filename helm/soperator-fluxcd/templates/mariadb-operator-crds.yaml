{{- if .Values.mariadbOperator.enabled }}
{{- $valuesName := printf "%s-mariadb-operator-crds-values" (include "soperator-fluxcd.fullname" .) }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ include "soperator-fluxcd.fullname" . }}-mariadb-operator-crds
  labels:
  {{- include "soperator-fluxcd.labels" . | nindent 4 }}
spec:
  {{- with .Values.mariadbOperator.crds.driftDetection }}
  driftDetection:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.mariadbOperator.crds.postRenderers }}
  postRenderers:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  chart:
    spec:
      chart: mariadb-operator-crds
      interval: {{ .Values.mariadbOperator.interval }}
      sourceRef:
        kind: HelmRepository
        name: {{ include "soperator-fluxcd.fullname" . }}-mariadb-operator
      version: {{ .Values.mariadbOperator.version }}
  {{- include "soperator-fluxcd.dependsOn" (dict "component" .Values.mariadbOperator.crds "root" $) | nindent 2 }}
  install:
    {{- toYaml .Values.mariadbOperator.crds.install | nindent 4 }}
  interval: {{ .Values.mariadbOperator.interval }}
  timeout: {{ .Values.mariadbOperator.timeout }}
  upgrade:
    {{- toYaml .Values.mariadbOperator.crds.upgrade | nindent 4 }}
  valuesFrom:
    {{- include "soperator-fluxcd.valuesFrom" (dict "name" $valuesName "references" .Values.mariadbOperator.crds.valuesFrom) | nindent 4 }}
---
{{- $valuesYaml := toYaml (.Values.mariadbOperator.crds.values | default dict) }}
{{ include "soperator-fluxcd.valuesConfigMap" (dict "name" $valuesName "root" $ "yaml" $valuesYaml) }}
{{- end }}
