suite: test login user isolation rendering
templates:
  - templates/slurm-cluster-cr.yaml
tests:
  - it: should render user isolation enabled by default
    asserts:
      - equal:
          path: spec.slurmNodes.login.userIsolation.enabled
          value: true
      - equal:
          path: spec.slurmNodes.login.userIsolation.cpuWeight
          value: 100
      # Memory limits are unset by default: when the feature is enabled, the
      # operator derives them from the sshd container memory limit (40% high /
      # 50% max).
      - notExists:
          path: spec.slurmNodes.login.userIsolation.memoryHigh
      - notExists:
          path: spec.slurmNodes.login.userIsolation.memoryMax

  - it: should not render memoryHigh, memoryMax and cpuWeight if unset
    set:
      slurmNodes:
        login:
          userIsolation:
            enabled: true
            memoryHigh: null
            memoryMax: null
            cpuWeight: null
    asserts:
      - notExists:
          path: spec.slurmNodes.login.userIsolation.memoryHigh
      - notExists:
          path: spec.slurmNodes.login.userIsolation.memoryMax
      - notExists:
          path: spec.slurmNodes.login.userIsolation.cpuWeight

  - it: should render user isolation settings as is
    set:
      slurmNodes:
        login:
          userIsolation:
            enabled: false
            memoryHigh: "2Gi"
            memoryMax: "3Gi"
            cpuWeight: 250
    asserts:
      - equal:
          path: spec.slurmNodes.login.userIsolation.enabled
          value: false
      - equal:
          path: spec.slurmNodes.login.userIsolation.memoryHigh
          value: "2Gi"
      - equal:
          path: spec.slurmNodes.login.userIsolation.memoryMax
          value: "3Gi"
      - equal:
          path: spec.slurmNodes.login.userIsolation.cpuWeight
          value: 250

  - it: should not render user isolation section when values block is removed
    set:
      slurmNodes:
        login:
          userIsolation: null
    asserts:
      - notExists:
          path: spec.slurmNodes.login.userIsolation
