suite: test idle memory health check
templates:
  - slurm-scripts-cm.yaml
tests:
  - it: should enable the idle memory drain and undrain checks with node RealMemory
    asserts:
      - isNotNull:
          path: data["idle_mem_used.drain.py"]
      - isNotNull:
          path: data["idle_mem_used.undrain.py"]
      - matchRegex:
          path: data["checks.json"]
          pattern: '"name": "idle_mem_used"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"command": "/usr/bin/python3 ./idle_mem_used.drain.py"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"command": "/usr/bin/python3 ./idle_mem_used.undrain.py"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"contexts": \[\s*"hc_program"\s*\]'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"on_fail": "drain"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"node_states": \[\s*"drain"\s*\]'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"on_ok": "undrain"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"command": "/usr/bin/python3 ./idle_mem_used\.drain\.py"[^}]*?"on_fail": "drain"[^}]*?"reason_base": "\[user_problem\] alloc_mem_used"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"command": "/usr/bin/python3 ./idle_mem_used\.undrain\.py"[^}]*?"on_ok": "undrain"[^}]*?"reason_base": "\[user_problem\] alloc_mem_used"'
      - matchRegex:
          path: data["checks.json"]
          pattern: '"need_env": \[\s*"CHECKS_NODE_REAL_MEM_BYTES"\s*\]'

  - it: should allow the idle memory check to be disabled
    set:
      slurmScripts:
        builtIn:
          idle_mem_used.drain.py:
            enabled: false
          idle_mem_used.undrain.py:
            enabled: false
    asserts:
      - isNull:
          path: data["idle_mem_used.drain.py"]
      - isNull:
          path: data["idle_mem_used.undrain.py"]
      - notMatchRegex:
          path: data["checks.json"]
          pattern: '"command": "/usr/bin/python3 ./idle_mem_used.(drain|undrain).py"'
