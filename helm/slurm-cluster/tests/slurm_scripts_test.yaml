suite: test Slurm scripts configuration
templates:
  - slurm-scripts-cm.yaml
tests:
  - it: should reject an enabled built-in without a bundled script
    set:
      slurmScripts:
        builtIn:
          removed_check.sh:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "slurmScripts.builtIn.removed_check.sh is enabled but no bundled script exists; remove this obsolete entry or set customContent"

  - it: should reject an enabled built-in without a bundled check configuration
    set:
      slurmScripts:
        builtIn:
          removed_check.sh:
            enabled: true
            customContent: |-
              #!/bin/bash
              exit 0
    asserts:
      - failedTemplate:
          errorMessage: "slurmScripts.builtIn.removed_check.sh is enabled but no bundled check configuration exists; remove this obsolete entry or set customConfig"

  - it: should render task prolog env exports when enabled
    set:
      slurmScripts:
        taskPrologEnv:
          enabled: true
          sourceFiles:
            - /etc/profile.d/90-nccl-network-vars.sh
          exportVars:
            - UCX_NET_DEVICES
            - NCCL_IB_HCA
    asserts:
      - matchRegex:
          path: data["task_prolog.sh"]
          pattern: 'for env_file in "/etc/profile.d/90-nccl-network-vars.sh"; do'
      - matchRegex:
          path: data["task_prolog.sh"]
          pattern: 'for env_var in "UCX_NET_DEVICES" "NCCL_IB_HCA"; do'
