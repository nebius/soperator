suite: test login Docker rendering
templates:
  - templates/slurm-cluster-cr.yaml
tests:
  - it: should render login Docker disabled by default
    asserts:
      - equal:
          path: spec.slurmNodes.login.docker.enabled
          value: false

  - it: should render login Docker enabled
    set:
      slurmNodes:
        login:
          docker:
            enabled: true
    asserts:
      - equal:
          path: spec.slurmNodes.login.docker.enabled
          value: true

  - it: should omit login Docker when the values block is removed
    set:
      slurmNodes:
        login:
          docker: null
    asserts:
      - notExists:
          path: spec.slurmNodes.login.docker
