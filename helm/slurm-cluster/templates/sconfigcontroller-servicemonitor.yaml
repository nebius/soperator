{{- if .Values.sConfigController.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "slurm-cluster.name" . }}-sconfigcontroller-servicemonitor
  labels:
    {{- include "slurm-cluster.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sconfigcontroller-metrics
  endpoints:
    - port: https-metrics
      path: /metrics
      scheme: https
      interval: {{ .Values.sConfigController.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.sConfigController.serviceMonitor.scrapeTimeout }}
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        {{- /*
        Static component label identifying the scraping process.
        The job label is dropped on the public remote-write, so dashboards use component + controller instead.
        One sconfigcontroller runs per SlurmCluster; the namespace label separates them.
        */}}
        - action: replace
          targetLabel: component
          replacement: sconfigcontroller
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  jobLabel: {{ .Values.sConfigController.serviceMonitor.jobLabel | quote }}
{{- end }}
