{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "soperatorchecks.fullname" . }}-servicemonitor
  labels:
    {{- include "soperatorchecks.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "soperatorchecks.name" . }}-metrics
  endpoints:
    - port: https-metrics
      path: /metrics
      scheme: https
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      {{- if .Values.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml .Values.serviceMonitor.metricRelabelings | nindent 6 }}
      {{- end }}
      relabelings:
        {{- /*
        Static component label identifying the scraping process.
        The job label is dropped on the public remote-write, and controller names such as soperatorchecks.slurmapiclients
        also run inside the soperator process, so dashboards use component + controller instead.
        */}}
        - action: replace
          targetLabel: component
          replacement: soperatorchecks
        {{- with .Values.serviceMonitor.relabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  jobLabel: {{ .Values.serviceMonitor.jobLabel | quote }}
{{- end }}
