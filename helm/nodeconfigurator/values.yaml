hostNetwork: true
customContainer:
  enabled: false
  env: []
  image:
    repository: "cr.eu-north1.nebius.cloud/soperator/busybox"
    tag: "latest"
    pullPolicy: IfNotPresent
  command:
    - /bin/sh
    - -c
    - sleep
    - infinity
  nodeSelector: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  serviceAccountName: ""
rebooter:
  enabled: true
  generateRBAC: true
  evictionMethod: "evict"
  logLevel: "info"
  logFormat: "json"
  env: []
  image:
    repository: "cr.eu-north1.nebius.cloud/soperator/rebooter"
    tag: "5.0.0"
    pullPolicy: IfNotPresent
  nodeSelector: {}
  resources: {}
  livenessProbe: {}
  readinessProbe: {}
  tolerations: []
  affinity: {}
  # Set to the chart's own class name to let the rebooter preempt the unprioritised infrastructure
  # Deployments competing for a node's spare CPU. Leave empty to run at priority 0.
  priorityClassName: ""
  # The rebooter is a DaemonSet on every node, so its value sits below every Slurm pod class
  # (the lowest is slurm-login at 100002) and above the unprioritised Deployments at 0.
  priorityClass:
    create: true
    # Defaults to "<release>-rebooter".
    name: ""
    value: 100000
    description: "Priority class for the soperator rebooter DaemonSet. Above unprioritised infrastructure Deployments, below every Slurm pod."
  serviceAccountName: ""
initContainers:
  - name: node-sysctl-params
    image: "cr.eu-north1.nebius.cloud/soperator/busybox"
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
    command:
      - /bin/sh
      - -c
      - |
        sysctl -w kernel.unprivileged_userns_clone=1
        sysctl -w net.core.rmem_max=536870912
        sysctl -w net.core.wmem_max=536870912
        sysctl -w net.ipv4.tcp_rmem="4096 131072 536870912"
        sysctl -w net.ipv4.tcp_wmem="4096 16384 536870912"
serviceMonitor:
  enabled: true
  jobLabel: "rebooter"
  interval: "30s"
  scrapeTimeout: "28s"
