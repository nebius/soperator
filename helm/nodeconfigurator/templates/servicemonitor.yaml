{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nodeconfigurator.name" . }}-rebooter-servicemonitor
  labels:
    {{- include "nodeconfigurator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nodeconfigurator.name" . }}-rebooter-metrics
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http-metrics
      path: /metrics
      scheme: http
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        {{- /*
        Static component label identifying the scraping process.
        The job label is dropped on the public remote-write, so dashboards use component + controller instead.
        The value is "rebooter", not "nodeconfigurator": only the rebooter binary in this DaemonSet serves /metrics,
        and "nodeconfigurator" is already the name of the soperator controller that reconciles NodeConfigurator CRs.
        */}}
        - action: replace
          targetLabel: component
          replacement: rebooter
{{- end }}
