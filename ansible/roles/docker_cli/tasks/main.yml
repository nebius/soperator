---

- name: Move real docker binary back
  ansible.builtin.command: mv /usr/bin/docker.real /usr/bin/docker
  args:
    removes: /usr/bin/docker.real
  tags:
    - docker-cli

- name: Ensure Docker CLI is installed
  ansible.builtin.apt:
    name:
      - "docker-ce-cli={{ docker_cli_version }}"
  tags:
    - docker-cli
