# Workers of all node sets are behind one headless Service and serve the same sshd host keys,
# so a worker is recognized by the Service in its resolved name, whatever the node set is called.
Match exec "getent hosts %h | grep -q -- '-nodeset-svc\.[^.]*\.svc\.'"
    StrictHostKeyChecking accept-new
    HostKeyAlias soperator-workers
    CheckHostIP no
