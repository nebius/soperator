---

- name: Upgrade all
  hosts:
    - all
    - localhost
  vars:
    cuda_version: "{{ lookup('env','CUDA_VERSION') }}"
    cuda_samples_cuda_version: "{{ cuda_version }}"
    nccl_tests_cuda_version: "{{ cuda_version }}"
    nccl_tests_version: "{{ lookup('env','NCCL_TESTS_VERSION') }}" # https://github.com/nebius/ml-containers/blob/main/ansible/roles/nccl-tests/defaults/main.yml#L3
    perftest_cuda_version: "{{ cuda_version }}"
    slurm_version: "{{ lookup('env','SLURM_VERSION') }}"
    slurm_apt_version: "{{ lookup('env','SLURM_DEB_VERSION') }}"

    ansible_connection: community.general.chroot
    ansible_host: /mnt/jail
    ansible_python_interpreter: /usr/bin/python3
  become: true
  gather_facts: true
  gather_subset:
    - min
  roles:
    - repos
    - python
    - common_packages
    - squashfuse
    - cuda
    - cuda_samples
    - nccl_tests
    - dcgmi
    - nvtop
    - docker_cli
    - doca_ofed
    - dcgmi
    - gdrcopy
    - nvidia_container_toolkit
    - soperator_scripts
    - slurm_divert
    - slurm_client
    - spank_nccl_inspector_preconf
    - slurm_divert # role doubled here, because we need to do that after Slurm version upgrade
    - sssd
    - motd
    - nc_health_checker
  tags:
    - run_all_upgrade
