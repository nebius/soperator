name: Helm API Validation

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Revision to validate
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Apply Flux chart manifests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false

      # pull_request_target uses the workflow from main even for release-branch PRs.
      # Older checkouts may predate test/helmapi. Remove this check once all supported
      # checkouts include test/helmapi and the test-helm-api Make target.
      - name: Check for Helm API tests
        id: helm-api
        shell: bash
        run: |
          if [[ -d test/helmapi ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Skipping Helm API validation. This checkout predates test/helmapi.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.helm-api.outputs.available == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request_target' }}

      - name: Install pinned Helm
        if: steps.helm-api.outputs.available == 'true'
        shell: bash
        run: make install-helm

      - name: Validate the Flux charts against Kubernetes
        if: steps.helm-api.outputs.available == 'true'
        shell: bash
        run: make test-helm-api

      - name: Render the OpenTelemetry collector relay with Helm 4
        if: hashFiles('test/helmapi/otel_relay_test.go') != ''
        shell: bash
        env:
          COLLECTOR_RELEASE: opentelemetry-collector-0.149.0
        run: |
          tools_dir=$(mktemp -d)
          (
            cd "$tools_dir"
            curl --retry 3 -fsSLo helm.tar.gz https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
            curl --retry 3 -fsSLo collector.tgz \
              "https://github.com/open-telemetry/opentelemetry-helm-charts/releases/download/$COLLECTOR_RELEASE/$COLLECTOR_RELEASE.tgz"
            echo 'c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3  helm.tar.gz' | sha256sum -c -
            echo 'b2c0068fcc63ea8afb9f4ce4b9def9b68d8d64dc925c91fdb9ad449118f61f6d  collector.tgz' | sha256sum -c -
            tar -xzf helm.tar.gz linux-amd64/helm
          )
          PATH="$tools_dir/linux-amd64:$PATH" OTEL_COLLECTOR_CHART="$tools_dir/collector.tgz" \
            go test -tags=helmapi -run '^TestOTelCollectorRelay$' -count=1 -v ./test/helmapi
