name: E2E Test Scheduler

on:
  schedule:
    - cron: '0 0,12 * * *'
    - cron: '0 2,4,6,8,10,14,16,18,20,22 * * *'
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: read
  actions: write

jobs:
  trigger-e2e:
    runs-on: ubuntu-latest
    environment: e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install yq
        uses: frenck/action-setup-yq@c4b5be8b4a215c536a41d436757d9feb92836d4f # v1.0.2
        with:
          version: v4.44.6

      - name: Trigger E2E tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_CONFIG: ${{ vars.E2E_CONFIG }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ -z "$E2E_CONFIG" ]]; then
            echo "::error::E2E_CONFIG variable is not set"
            exit 1
          fi

          case "$SCHEDULE" in
            '0 0,12 * * *')
              PROFILE='@auto-cpu'
              ;;
            '0 2,4,6,8,10,14,16,18,20,22 * * *')
              PROFILE='@auto-gpu'
              ;;
            '')
              PROFILE='@auto-gpu'
              echo "::notice::Manual scheduler run defaults to $PROFILE"
              ;;
            *)
              echo "::error::Unknown schedule: $SCHEDULE"
              exit 1
              ;;
          esac
          echo "Requested profile: $PROFILE"

          # Parse before readarray so invalid configuration stops the step.
          RELEASE_BRANCH_NAMES=$(yq -o=json '.' <<<"$E2E_CONFIG" | jq -r '
            .scheduler.e2e_release_branches
            | if . == null then [] else . end
            | if type == "array" and all(.[]; type == "string" and length > 0)
              then .
              else error("scheduler.e2e_release_branches must be an array of non-empty strings")
              end
            | if all(.[]; startswith("soperator-release-") and (test("\\s") | not))
              then .
              else error("scheduler.e2e_release_branches entries must start with soperator-release- and contain no whitespace; main is included automatically")
              end
            | if length == (unique | length)
              then .[]
              else error("scheduler.e2e_release_branches must not contain duplicates")
              end')
          BRANCHES=("main")
          if [[ -n "$RELEASE_BRANCH_NAMES" ]]; then
            readarray -t RELEASE_BRANCHES <<<"$RELEASE_BRANCH_NAMES"
            BRANCHES+=("${RELEASE_BRANCHES[@]}")
          fi
          BRANCH_COUNT=${#BRANCHES[@]}

          echo "Branches: ${BRANCHES[*]}"

          # Defaults duplicated from defaultRunsPerTick / defaultMaxInFlight in
          # internal/e2e/config.go — keep the two in sync.
          RUNS_PER_TICK=$(echo "$E2E_CONFIG" | yq -r '.scheduler.runs_per_tick // 1')
          MAX_IN_FLIGHT=$(echo "$E2E_CONFIG" | yq -r '.scheduler.max_in_flight // 2')

          # Only scheduled runs count here. A manual run occupies a project, which
          # the selector already accounts for, but it must not affect the schedule.
          # PR comment dispatches also run as github-actions[bot], so restrict the
          # results to branches the scheduler owns. The actor= query parameter is
          # avoided on purpose: it serves stale results.
          BRANCHES_JSON=$(printf '%s\n' "${BRANCHES[@]}" | jq -R . | jq -s .)
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e_test.yml/runs?per_page=100" \
            | jq --argjson branches "$BRANCHES_JSON" \
              '[.workflow_runs[] | select(
                .actor.login == "github-actions[bot]"
                and (.head_branch as $branch | $branches | index($branch))
              )]')

          # A run that finds no free profile waits, then fails. Dispatching on every
          # tick regardless would turn a stretch of tight capacity into a stream of
          # timed-out runs, so stop adding to the pile once enough are in flight.
          # Runs still waiting for a profile count: they are the ones at risk.
          IN_FLIGHT=$(jq '[.[] | select(.status != "completed")] | length' <<<"$RUNS")

          DISPATCHES=$(( MAX_IN_FLIGHT - IN_FLIGHT ))
          if (( DISPATCHES > RUNS_PER_TICK )); then
            DISPATCHES=$RUNS_PER_TICK
          fi

          echo "In flight: $IN_FLIGHT (max $MAX_IN_FLIGHT), per tick: $RUNS_PER_TICK -> dispatching $DISPATCHES"

          if (( DISPATCHES <= 0 )); then
            echo "::notice::$IN_FLIGHT e2e run(s) already in flight, dispatching none this tick"
            {
              echo "### No dispatch"
              echo "$IN_FLIGHT scheduled e2e run(s) already in flight, at the cap of $MAX_IN_FLIGHT."
            } >> "$GITHUB_STEP_SUMMARY"

            # Cancel rather than pass: a green run that dispatched nothing is
            # indistinguishable from a normal tick in the run list. exit 1 is the
            # fallback for a cancellation that has not landed by the time the step
            # ends — a red tick is still better than a silent one.
            gh run cancel "$GITHUB_RUN_ID" -R "${{ github.repository }}"
            exit 1
          fi

          # CPU and GPU selectors rotate across branches independently. The concrete
          # profile selected later does not affect this pointer.
          PROFILE_RUNS=$(jq --arg title "E2E $PROFILE" \
            '[.[] | select(.display_title == $title)]' <<<"$RUNS")

          # Continue from the branch of the newest run for this selector. The pointer
          # advances only when a run was actually dispatched. Unknown or missing
          # branch: start from the top of the list.
          LAST_BRANCH=$(jq -r '.[0].head_branch // ""' <<<"$PROFILE_RUNS")
          START=0
          for i in "${!BRANCHES[@]}"; do
            if [[ "${BRANCHES[$i]}" == "$LAST_BRANCH" ]]; then
              START=$(( (i + 1) % BRANCH_COUNT ))
              break
            fi
          done
          echo "Last scheduled $PROFILE branch: ${LAST_BRANCH:-none}, starting from: ${BRANCHES[$START]}"

          for (( i = 0; i < DISPATCHES; i++ )); do
            BRANCH_INDEX=$(( (START + i) % BRANCH_COUNT ))
            REF="${BRANCHES[$BRANCH_INDEX]}"

            gh workflow run e2e_test.yml \
              --ref "$REF" \
              -f terraform_repo_ref="$REF" \
              -f is_scheduled=true \
              -f profile="$PROFILE"

            echo "Triggered E2E test with $PROFILE on branch $REF (index $BRANCH_INDEX)"
          done
