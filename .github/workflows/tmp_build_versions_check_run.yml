# TEMPORARY: verifies that the "Build versions" commit status from one_job.yml shows up
# in the PR checks list. one_job.yml runs on pull_request_target with the definition
# from main, so its own change cannot be seen on the PR that introduces it.
# Delete this file before merging.
name: TMP Build versions commit status

on:
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  pre-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish versions to summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UNSTABLE: "true"
          VERSION: 5.0.0-rtest0000
          IMAGE_VERSION: 5.0.0-slurm26.05.4-nebius-1-rtest0000
          OPERATOR_IMAGE_TAG: 5.0.0-rtest0000
          NFS_VERSION: 1.2.1-rtest0000
        run: |
          {
            echo "- Version: \`$VERSION\`"
            echo "- Unstable: \`$UNSTABLE\`"
            echo "- Image version: \`$IMAGE_VERSION\`"
            echo "- Operator image tag: \`$OPERATOR_IMAGE_TAG\`"
            echo "- NFS version: \`$NFS_VERSION\`"
          } > versions.md

          {
            echo "### Build Versions"
            echo ""
            cat versions.md
          } >> "$GITHUB_STEP_SUMMARY"

          DESCRIPTION="${VERSION}, image ${IMAGE_VERSION}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f context="Build versions" -f state=success \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null \
            || echo "::warning::Create commit status with build versions: exit code $?"
