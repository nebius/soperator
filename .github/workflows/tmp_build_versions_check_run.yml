# TEMPORARY: verifies that the "Build versions" check run from one_job.yml shows up
# on the PR Checks tab. one_job.yml runs on pull_request_target with the definition
# from main, so its own change cannot be seen on the PR that introduces it.
# Delete this file before merging.
name: TMP Build versions check run

on:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  pre-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish versions to summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          UNSTABLE: "true"
          VERSION: 5.0.0-rtest0000
          IMAGE_VERSION: 5.0.0-slurm26.05.4-nebius-1-rtest0000
          OPERATOR_IMAGE_TAG: 5.0.0-rtest0000
          NFS_VERSION: 1.2.1-rtest0000
        run: |
          {
            echo "- Version: \`$VERSION\`"
            echo "- Unstable: \`$UNSTABLE\`"
            echo "- Image version: \`$IMAGE_VERSION\`"
            echo "- Operator image tag: \`$OPERATOR_IMAGE_TAG\`"
            echo "- NFS version: \`$NFS_VERSION\`"
          } > versions.md

          {
            echo "### Build Versions"
            echo ""
            cat versions.md
          } >> "$GITHUB_STEP_SUMMARY"

          gh api -X POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Build versions" -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            -f "output[title]=$VERSION" -f "output[summary]=$(cat versions.md)" > /dev/null \
            || echo "::warning::Create check run with build versions: exit code $?"
