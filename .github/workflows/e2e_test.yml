name: E2E test soperator

run-name: "E2E ${{ inputs.profile }}"

on:
  workflow_dispatch:
    inputs:
      is_scheduled:
        description: "Triggered by the scheduler?"
        type: string
        required: false
        default: "false"
      terraform_repo_ref:
        description: "ref of terraform repo (defaults to current branch)"
        required: false
        default: ""
        type: string
      soperator_e2e_repo_branch:
        description: "E2E repo branch"
        required: false
        default: "main"
        type: string
      # Keep the options in sync with the profiles and labels in E2E_CONFIG.
      # The default is what scheduler dispatches resolve with too — they omit
      # this input, and the code refuses an empty profile rather than assuming one.
      profile:
        description: "Profile name or @label, see E2E_CONFIG"
        required: false
        default: "@auto-select"
        type: choice
        options:
          - "@auto-select"
          - MAN_H100
          - MAN_H200
          - KCS_B200
          - MDC_B200
          - KCS_CPU
          - KCS_MIXED
      run_unstable_tests:
        description: "Run acceptance scenarios tagged @unstable"
        required: false
        default: "false"
        type: string
      run_essential_tests:
        description: "Run only acceptance scenarios tagged @essential"
        required: false
        default: "false"
        type: string
      pr_number:
        description: "PR to update with the E2E result"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  report-pr-start:
    name: Report E2E start to PR
    if: inputs.pr_number != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or update PR comment
        id: comment
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOPERATOR_BRANCH: ${{ github.ref_name }}
          TERRAFORM_BRANCH: ${{ inputs.terraform_repo_ref || github.ref_name }}
          SOPERATOR_E2E_BRANCH: ${{ inputs.soperator_e2e_repo_branch || 'main' }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          RUN_UNSTABLE_TESTS: ${{ inputs.run_unstable_tests || 'false' }}
          RUN_ESSENTIAL_TESTS: ${{ inputs.run_essential_tests || 'false' }}
        run: |
          marker="<!-- soperator-e2e-run:${GITHUB_RUN_ID} -->"
          python3 .github/scripts/e2e_pr_comment.py start > /tmp/e2e-pr-comment.md

          comment_id=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            | jq -r --arg marker "$marker" \
              '[.[][] | select(.body | contains($marker))][0].id // empty')

          payload=$(jq --null-input --rawfile body /tmp/e2e-pr-comment.md '{body: $body}')
          if [[ -n "$comment_id" ]]; then
            response=$(gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input - <<<"$payload")
          else
            response=$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input - <<<"$payload")
          fi

          echo "comment_id=$(jq -r '.id' <<<"$response")" >> "$GITHUB_OUTPUT"

  resolve-profile:
    runs-on: ubuntu-latest
    environment: e2e
    # The selector waits here, outside the e2e-test concurrency group, until a
    # project frees up. Keep this above selector.timeout_minutes in E2E_CONFIG.
    timeout-minutes: 70
    outputs:
      profile_name: ${{ steps.resolve.outputs.profile_name }}
      profile_yaml: ${{ steps.resolve.outputs.profile_yaml }}
      nebius_project_id: ${{ steps.resolve.outputs.nebius_project_id }}
      nebius_region: ${{ steps.resolve.outputs.nebius_region }}
      nebius_tenant_id: ${{ steps.resolve.outputs.nebius_tenant_id }}
    env:
      E2E_CONFIG: ${{ vars.E2E_CONFIG }}
      E2E_PROFILE_NAME: ${{ inputs.profile }}
      E2E_IS_SCHEDULED: ${{ inputs.is_scheduled }}
      E2E_RUN_METADATA_PATH: /tmp/e2e-run-metadata.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GO
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Build e2e binary
        run: go build -o bin/e2e ./cmd/e2e

      - name: Configure Nebius credentials
        shell: bash
        env:
          NEBIUS_CLI_CONFIG: ${{ vars.NEBIUS_CLI_CONFIG }}
          NEBIUS_PRIVATE_KEY: ${{ secrets.NEBIUS_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.nebius"
          echo "$NEBIUS_CLI_CONFIG" > "$HOME/.nebius/config.yaml"
          yq -i '.profiles.default.private-key = strenv(NEBIUS_PRIVATE_KEY)' "$HOME/.nebius/config.yaml"
          chmod 600 "$HOME/.nebius/config.yaml"

      - name: Resolve profile
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rc=0
          bin/e2e select-profile 2>&1 | tee /tmp/select-profile.log || rc=$?

          # The console log keeps every attempt; the summary shows only the last
          # one, so a long wait cannot flood the summary page.
          {
            echo "### Profile Selection"
            echo '```'
            awk '/^Attempt [0-9]+:/{buf=""} {buf=buf $0 ORS} END{printf "%s", buf}' /tmp/select-profile.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Published right after selection: this is how other runs see the project as
      # taken before any instance exists to show up in capacity block usage.
      - name: Upload run metadata
        uses: actions/upload-artifact@v7
        with:
          name: e2e-run-metadata
          path: /tmp/e2e-run-metadata.json
          retention-days: 1

      - name: Print run parameters
        shell: bash
        env:
          PROFILE_NAME: ${{ steps.resolve.outputs.profile_name }}
          PROFILE_YAML: ${{ steps.resolve.outputs.profile_yaml }}
          TERRAFORM_REPO_REF: ${{ github.event.inputs.terraform_repo_ref || github.ref_name }}
          SOPERATOR_E2E_REPO_BRANCH: ${{ inputs.soperator_e2e_repo_branch || 'main' }}
        run: |
          {
            echo "### Run Parameters"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Terraform branch: \`$TERRAFORM_REPO_REF\`"
            echo "- Soperator E2E repo branch: \`$SOPERATOR_E2E_REPO_BRANCH\`"
            echo "- Profile: \`$PROFILE_NAME\`"
            echo ""
            echo '```yaml'
            echo "$PROFILE_YAML"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-test:
    needs: resolve-profile
    name: e2e-test (${{ needs.resolve-profile.outputs.profile_name }})
    outputs:
      acceptance_outcome: ${{ steps.acceptance.outcome }}
      acceptance_report_available: ${{ steps.acceptance_summary.outputs.report_available }}
      acceptance_summary: ${{ steps.acceptance_summary.outputs.comment }}
    concurrency:
      # Per-project mutex: runs targeting the same Nebius project are serialized,
      # different projects can run concurrently. Queued runs wait, never cancel in-progress ones.
      cancel-in-progress: false
      group: e2e-${{ needs.resolve-profile.outputs.nebius_project_id }}
    runs-on: ubuntu-latest

    environment: e2e

    env:
      PATH_TO_INSTALLATION: "${{ github.workspace }}/terraform-repo/soperator/installations/example"
      TERRAFORM_REPO: "nebius/nebius-solutions-library"
      TERRAFORM_REPO_REF: "${{ github.event.inputs.terraform_repo_ref || github.ref_name }}"
      SOPERATOR_E2E_REPO: "${{ github.repository }}"
      SOPERATOR_E2E_REPO_BRANCH: "${{ inputs.soperator_e2e_repo_branch || 'main' }}"
      O11Y_ACCESS_TOKEN: ${{ secrets.E2E_O11Y_ACCESS_TOKEN }}
      PROFILE_NAME: ${{ needs.resolve-profile.outputs.profile_name }}
      E2E_PROFILE_YAML: ${{ needs.resolve-profile.outputs.profile_yaml }}
      RUN_UNSTABLE_TESTS: ${{ inputs.run_unstable_tests || 'false' }}
      RUN_ESSENTIAL_TESTS: ${{ inputs.run_essential_tests || 'false' }}
      SLURM_CLUSTER_NAME: "soperator"
      E2E_ARTIFACTS_DIR: "${{ github.workspace }}/e2e-artifacts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install GO
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Add local bin to PATH
        run: echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Build e2e binary
        run: go build -o bin/e2e ./cmd/e2e

      - name: Checkout Soperator E2E source
        # For now the Soperator E2E source still lives in this repository. When
        # it moves to a separate repository, this checkout/build pair should
        # point there and keep using SOPERATOR_E2E_REPO_BRANCH.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOPERATOR_E2E_REPO }}
          ref: ${{ env.SOPERATOR_E2E_REPO_BRANCH }}
          path: soperator-e2e

      - name: Build acceptance binary
        working-directory: "${{ github.workspace }}/soperator-e2e/e2e"
        run: go build -o "${{ github.workspace }}/bin/acceptance" ./cmd/acceptance

      - name: Export profile outputs
        shell: bash
        run: |
          echo "NEBIUS_PROJECT_ID=${{ needs.resolve-profile.outputs.nebius_project_id }}" >> "$GITHUB_ENV"
          echo "NEBIUS_REGION=${{ needs.resolve-profile.outputs.nebius_region }}" >> "$GITHUB_ENV"
          echo "NEBIUS_TENANT_ID=${{ needs.resolve-profile.outputs.nebius_tenant_id }}" >> "$GITHUB_ENV"

      - name: Install Nebius CLI
        shell: bash
        env:
          NEBIUS_INSTALL_FOLDER: "${{ github.workspace }}/bin"
        run: |
          echo "Installing Nebius CLI ${NEBIUS_CLI_VERSION}..."
          curl -sSL https://storage.eu-north1.nebius.cloud/cli/install.sh | bash

      - name: Configure Nebius CLI
        shell: bash
        env:
          NEBIUS_CLI_CONFIG: ${{ vars.NEBIUS_CLI_CONFIG }}
          NEBIUS_PRIVATE_KEY: ${{ secrets.NEBIUS_PRIVATE_KEY }}
          NEBIUS_TELEMETRY_PRIVATE_KEY: ${{ secrets.NEBIUS_TELEMETRY_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.nebius"
          echo "$NEBIUS_CLI_CONFIG" > "$HOME/.nebius/config.yaml"
          yq -i '.profiles.default.private-key = strenv(NEBIUS_PRIVATE_KEY)' "$HOME/.nebius/config.yaml"
          yq -i '.profiles.soperator-telemetry.private-key = strenv(NEBIUS_TELEMETRY_PRIVATE_KEY)' "$HOME/.nebius/config.yaml"
          chmod 600 "$HOME/.nebius/config.yaml"

      - name: Install AWS CLI v2
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already installed: $(aws --version)"
            exit 0
          fi

          echo "AWS CLI not found, installing..."
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Check tools versions
        shell: bash
        run: |
          echo "yq:"
          which yq
          yq --version
          echo ""

          echo "jq:"
          which jq
          jq --version
          echo ""

          echo "nebius:"
          which nebius
          nebius version
          echo ""

          echo "terraform:"
          which terraform
          terraform --version
          echo ""

          echo "kubectl:"
          which kubectl
          kubectl version --client
          echo ""

          echo "aws:"
          which aws
          aws --version
          echo ""

          echo "go:"
          which go
          go version

          echo "python:"
          which python
          python --version

      - name: Find latest valid build run on current branch
        id: find_build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          readonly CANDIDATE_LIMIT=15
          readonly EMPTY_RESPONSE_RETRY_LIMIT=3
          readonly RETRY_BACKOFF_SECONDS=5

          echo "Looking for a valid successful build run on branch: $TARGET_BRANCH"

          selected_run=""
          artifact_expires_at=""
          while IFS= read -r candidate_sha; do
            echo "Checking build runs for commit: $candidate_sha"

            runs=""
            for ((attempt = 1; attempt <= EMPTY_RESPONSE_RETRY_LIMIT; attempt++)); do
              runs=$(.github/workflows/scripts/retry.sh gh api \
                -H "Cache-Control: no-cache" \
                -X GET \
                "/repos/$REPOSITORY/actions/workflows/one_job.yml/runs" \
                -F head_sha="$candidate_sha" \
                -F per_page=100)

              if jq -e '.workflow_runs | length > 0' >/dev/null <<<"$runs"; then
                break
              fi

              if (( attempt < EMPTY_RESPONSE_RETRY_LIMIT )); then
                echo "No build runs returned for $candidate_sha; retrying ($attempt/$EMPTY_RESPONSE_RETRY_LIMIT)"
                sleep $((RETRY_BACKOFF_SECONDS * attempt))
              fi
            done

            if ! jq -e '.workflow_runs | length > 0' >/dev/null <<<"$runs"; then
              echo "Skipping commit $candidate_sha: no build runs returned after $EMPTY_RESPONSE_RETRY_LIMIT attempts"
              continue
            fi

            while IFS= read -r candidate; do
              run_id=$(jq -r '.id' <<<"$candidate")
              artifacts=$(.github/workflows/scripts/retry.sh gh api \
                -H "Cache-Control: no-cache" \
                -X GET \
                "/repos/$REPOSITORY/actions/runs/$run_id/artifacts" \
                -F per_page=100)

              artifact=$(jq -c '
                [.artifacts[]
                  | select(
                      .name == "version"
                      and .expired == false
                      and .expires_at != null
                      and (.expires_at | fromdateiso8601) > now
                    )
                ]
                | sort_by(.expires_at)
                | last // empty
              ' <<<"$artifacts")

              if [[ -z "$artifact" ]]; then
                echo "Skipping build $run_id: no non-expired version artifact"
                continue
              fi

              selected_run="$candidate"
              artifact_expires_at=$(jq -r '.expires_at' <<<"$artifact")
              break
            done < <(jq -c --arg branch "$TARGET_BRANCH" --arg sha "$candidate_sha" '
              [.workflow_runs[]
                | select(
                    .head_sha == $sha
                    and .head_branch == $branch
                    and .status == "completed"
                    and .conclusion == "success"
                  )
              ]
              | sort_by([.created_at, .id])
              | reverse[]
            ' <<<"$runs")

            if [[ -z "$selected_run" ]]; then
              echo "Skipping commit $candidate_sha: no completed successful build with a valid version artifact"
              continue
            fi

            break
          done < <(git rev-list --first-parent --max-count="$CANDIDATE_LIMIT" "$GITHUB_SHA")

          if [[ -z "$selected_run" ]]; then
            echo "::error::No valid successful build with a non-expired version artifact found among the latest $CANDIDATE_LIMIT commits on branch $TARGET_BRANCH"
            exit 1
          fi

          run_id=$(jq -r '.id' <<<"$selected_run")
          head_sha=$(jq -r '.head_sha' <<<"$selected_run")
          created_at=$(jq -r '.created_at' <<<"$selected_run")
          html_url=$(jq -r '.html_url' <<<"$selected_run")

          echo "Found build: $run_id (created $created_at, version artifact expires $artifact_expires_at)"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"

      - name: Download artifact with version
        shell: bash
        run: |
          gh run download ${{ steps.find_build.outputs.run_id }} -n version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        shell: bash
        run: |
          SOPERATOR_VERSION=$(sed -n '1p' version.txt)
          SOPERATOR_UNSTABLE=$(sed -n '2p' version.txt)

          echo "SOPERATOR_VERSION=$SOPERATOR_VERSION" >> $GITHUB_ENV
          echo "SOPERATOR_UNSTABLE=$SOPERATOR_UNSTABLE" >> $GITHUB_ENV

      - name: Initialize E2E artifacts
        shell: bash
        env:
          NEBIUS_PROJECT_ID: ${{ needs.resolve-profile.outputs.nebius_project_id }}
          NEBIUS_REGION: ${{ needs.resolve-profile.outputs.nebius_region }}
        run: |
          mkdir -p \
            "$E2E_ARTIFACTS_DIR/metadata" \
            "$E2E_ARTIFACTS_DIR/terraform" \
            "$E2E_ARTIFACTS_DIR/acceptance" \
            "$E2E_ARTIFACTS_DIR/snapshots/before-acceptance" \
            "$E2E_ARTIFACTS_DIR/snapshots/before-destroy"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg profile "$PROFILE_NAME" \
            --arg nebius_project_id "$NEBIUS_PROJECT_ID" \
            --arg nebius_region "$NEBIUS_REGION" \
            --arg soperator_version "$SOPERATOR_VERSION" \
            --arg terraform_ref "$TERRAFORM_REPO_REF" \
            --arg acceptance_ref "$SOPERATOR_E2E_REPO_BRANCH" \
            '{
              repository: $repository,
              ref: $ref,
              sha: $sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_url: $run_url,
              profile: $profile,
              nebius_project_id: $nebius_project_id,
              nebius_region: $nebius_region,
              soperator_version: $soperator_version,
              terraform_ref: $terraform_ref,
              acceptance_ref: $acceptance_ref
            }' > "$E2E_ARTIFACTS_DIR/metadata/run.json"

      - name: Checkout Terraform repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TERRAFORM_REPO }}
          ref: ${{ env.TERRAFORM_REPO_REF }}
          path: "${{ github.workspace }}/terraform-repo"
          fetch-depth: 0

      - name: Check capacity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          # Remove credentials, so .envrc would create a fresh access token with long TTL.
          rm -f "$HOME/.nebius/credentials.yaml"

          cd ${{ env.PATH_TO_INSTALLATION }}
          source .envrc
          cd -

          echo "### Capacity Check" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bin/e2e check-capacity 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup previous Terraform state
        timeout-minutes: 30
        shell: bash
        run: |
          cd ${{ env.PATH_TO_INSTALLATION }}
          source .envrc
          cd -

          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $NEBIUS_REGION
          aws configure set endpoint_url https://storage.$NEBIUS_REGION.nebius.cloud:443

          # Destroy any leftover resources from a previous run using the saved terraform bundle
          # (the exact code that created the state), falling back to the current checkout.
          # Runs before init so the new run starts from a clean, empty state.
          bin/e2e cleanup-previous 2>&1 | tee "$E2E_ARTIFACTS_DIR/terraform/cleanup-previous.log"

      - name: Terraform Init
        timeout-minutes: 30
        shell: bash
        run: |
          cd ${{ env.PATH_TO_INSTALLATION }}
          source .envrc
          cd -

          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $NEBIUS_REGION
          aws configure set endpoint_url https://storage.$NEBIUS_REGION.nebius.cloud:443

          bin/e2e init 2>&1 | tee "$E2E_ARTIFACTS_DIR/terraform/init.log"

      - name: Terraform Apply
        id: terraform_apply
        timeout-minutes: 90
        shell: bash
        run: |
          cd ${{ env.PATH_TO_INSTALLATION }}
          source .envrc
          cd -

          # Configure AWS CLI
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $NEBIUS_REGION
          aws configure set endpoint_url https://storage.$NEBIUS_REGION.nebius.cloud:443

          bin/e2e apply 2>&1 | tee "$E2E_ARTIFACTS_DIR/terraform/apply.log"

      - name: Kill leftover Terraform processes
        if: always()
        shell: bash
        run: |
          # A timed-out Terraform Apply can leave terraform running: the
          # runner's process-tree kill misses reparented orphans. The survivor
          # keeps creating resources concurrently with Terraform Destroy and
          # leaks them (SCHED-1865). Kill everything terraform-related before
          # any further terraform interaction.
          for name in e2e terraform; do
            pids=$(pgrep -x "$name" || true)
            if [ -n "$pids" ]; then
              echo "Killing leftover '$name' processes: $pids"
              pkill -9 -x "$name" || true
            fi
          done
          # provider plugin comm names are truncated, match by full cmdline
          pkill -9 -f terraform-provider || true

      - name: Collect artifacts before acceptance
        if: steps.terraform_apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          kubectl_context="$(kubectl config current-context 2>/dev/null || true)"
          bin/acceptance collect-artifacts \
            --kubectl-context "$kubectl_context" \
            --slurm-cluster-name "$SLURM_CLUSTER_NAME" \
            --soperator-version "$SOPERATOR_VERSION" \
            --nebius-project-id "$NEBIUS_PROJECT_ID" \
            --output-dir "$E2E_ARTIFACTS_DIR/snapshots/before-acceptance"

      - name: Acceptance Tests
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          kubectl_context="$(kubectl config current-context 2>/dev/null || true)"
          args=(
            run
            --kubectl-context "$kubectl_context"
            --slurm-cluster-name "$SLURM_CLUSTER_NAME"
            --soperator-version "$SOPERATOR_VERSION"
            --output-dir "$E2E_ARTIFACTS_DIR/acceptance"
          )
          if [[ "$RUN_UNSTABLE_TESTS" == "true" ]]; then
            args+=(--run-unstable)
          fi
          if [[ "$RUN_ESSENTIAL_TESTS" == "true" ]]; then
            args+=(--run-essential)
          fi
          bin/acceptance "${args[@]}" 2>&1 | tee "$E2E_ARTIFACTS_DIR/acceptance/acceptance.log"

      - name: Acceptance Summary
        id: acceptance_summary
        if: always()
        shell: bash
        run: |
          json="$E2E_ARTIFACTS_DIR/acceptance/soperator.cucumber.json"
          if [[ ! -f "$json" ]]; then
            echo "no cucumber report at $json"
            echo "report_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/acceptance_summary.py "$json" >> "$GITHUB_STEP_SUMMARY"
          comment=$(python3 .github/scripts/acceptance_summary.py \
            "$json" --format comment)
          {
            echo 'report_available=true'
            echo 'comment<<EOF'
            echo "$comment"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Collect artifacts before destroy
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          kubectl_context="$(kubectl config current-context 2>/dev/null || true)"
          bin/acceptance collect-artifacts \
            --kubectl-context "$kubectl_context" \
            --slurm-cluster-name "$SLURM_CLUSTER_NAME" \
            --soperator-version "$SOPERATOR_VERSION" \
            --nebius-project-id "$NEBIUS_PROJECT_ID" \
            --output-dir "$E2E_ARTIFACTS_DIR/snapshots/before-destroy"

      - name: Terraform Destroy
        if: always()
        timeout-minutes: 30
        shell: bash
        env:
          # Keep Terraform core diagnostics while excluding provider DEBUG logs,
          # which may contain raw credentials such as short-lived IAM tokens.
          TF_DESTROY_LOG_PATH: ${{ env.E2E_ARTIFACTS_DIR }}/terraform/destroy-debug.log
        run: |
          cd ${{ env.PATH_TO_INSTALLATION }}
          source .envrc
          cd -

          # Configure AWS CLI (in case env was lost)
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $NEBIUS_REGION
          aws configure set endpoint_url https://storage.$NEBIUS_REGION.nebius.cloud:443

          bin/e2e destroy 2>&1 | tee "$E2E_ARTIFACTS_DIR/terraform/destroy.log"

      - name: Force cleanup compute instances on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p "$E2E_ARTIFACTS_DIR/terraform"
          exec > >(tee -a "$E2E_ARTIFACTS_DIR/terraform/force-cleanup.log") 2>&1

          echo "=== Node groups state before cleanup ==="
          clusters_json=$(nebius mk8s cluster list --parent-id "$NEBIUS_PROJECT_ID" --format json 2>/dev/null || true)
          cluster_ids=$(echo "$clusters_json" | jq -r '.items[].metadata.id // empty' 2>/dev/null || true)

          for cluster_id in $cluster_ids; do
            echo ""
            echo "--- Node groups for cluster: $cluster_id ---"
            nebius mk8s node-group list --parent-id "$cluster_id" --page-size 1000 --format yaml || true
          done

          echo ""
          echo "=== Forcing cleanup of remaining compute instances ==="

          # Get nodes from the cluster (ignore errors if cluster is already gone)
          nodes=$(kubectl get nodes -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || true)

          if [ -z "$nodes" ]; then
            echo "No nodes found or cluster not accessible"
            exit 0
          fi

          echo "Found nodes: $nodes"

          operations=()
          for node in $nodes; do
            echo "Deleting compute instance: $node"
            op=$(nebius compute instance delete --id="$node" --async 2>/dev/null) && operations+=("$op") || echo "Failed to delete instance $node (may already be deleted)"
          done

          echo ""
          echo "=== Operation statuses ==="
          for op in "${operations[@]}"; do
            echo "--- $op ---"
            nebius compute instance operation get --id="$op" || true
          done

          echo "=== Cleanup complete ==="

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: ${{ env.E2E_ARTIFACTS_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Add build info to job summary
        if: always()
        shell: bash
        run: |
          set -x

          head_sha="${{ steps.find_build.outputs.head_sha }}"
          created_at="${{ steps.find_build.outputs.created_at }}"
          html_url="${{ steps.find_build.outputs.html_url }}"
          run_id="${{ steps.find_build.outputs.run_id }}"
          repo_url="https://github.com/${{ github.repository }}"
          terraform_repo_url="https://github.com/${{ env.TERRAFORM_REPO }}"
          terraform_repo_dir="${{ github.workspace }}/terraform-repo"

          # Run all git invocations up front so their stderr is visible in the
          # step log (instead of being swallowed inside the summary block).
          # Failures are tolerated — this step is purely informational and must
          # not fail the job, but the reason for any failure must be visible.
          recent_commits=""
          not_covered_commits=""
          head_sha_reachable=""
          terraform_recent_commits=""

          if [[ -n "$run_id" && "$run_id" != "null" && -n "$head_sha" ]]; then
            recent_commits=$(git log --format='%h|%s|%ar|%an' -3 "$head_sha") \
              || echo "git log -3 $head_sha failed with exit $?"

            if git merge-base --is-ancestor "$head_sha" HEAD; then
              head_sha_reachable=yes
              not_covered_commits=$(git log --format='%h|%s|%ar|%an' --first-parent "$head_sha"..HEAD) \
                || echo "git log --first-parent $head_sha..HEAD failed with exit $?"
            else
              head_sha_reachable=no
            fi
          fi

          if [[ -d "$terraform_repo_dir/.git" ]]; then
            terraform_recent_commits=$(git -C "$terraform_repo_dir" log --format='%h|%s|%ar|%an' -3) \
              || echo "git log -3 in $terraform_repo_dir failed with exit $?"
          fi

          {
            echo "### Image Build Information"

            if [[ -n "$run_id" && "$run_id" != "null" ]]; then
              echo "[Run $run_id]($html_url) at $created_at"
              echo "### Latest Commits on ${{ github.ref_name }}"
              if [[ -n "$recent_commits" ]]; then
                while IFS='|' read -r hash msg date author; do
                  echo "- [$hash]($repo_url/commit/$hash): $msg ($date) <$author>"
                done <<< "$recent_commits"
              fi

              if [[ "$head_sha_reachable" == "yes" ]]; then
                if [[ -n "$not_covered_commits" ]]; then
                  echo ""
                  echo "### Not Covered Commits"
                  while IFS='|' read -r hash msg date author; do
                    echo "- [$hash]($repo_url/commit/$hash): $msg ($date) <$author>"
                  done <<< "$not_covered_commits"
                fi
              elif [[ "$head_sha_reachable" == "no" ]]; then
                echo ""
                echo "### Warning"
                echo "Build commit $head_sha is not reachable from current HEAD. Cannot determine uncovered commits."
              fi
            else
              echo "No successful build was found."
            fi

            # Terraform repo latest commits
            echo ""
            echo "### Terraform Repo Latest Commits on ${{ env.TERRAFORM_REPO_REF }}"
            if [[ -d "$terraform_repo_dir/.git" ]]; then
              if [[ -n "$terraform_recent_commits" ]]; then
                while IFS='|' read -r hash msg date author; do
                  echo "- [$hash]($terraform_repo_url/commit/$hash): $msg ($date) <$author>"
                done <<< "$terraform_recent_commits"
              fi
            else
              echo "Terraform repo not checked out."
            fi
          } >> $GITHUB_STEP_SUMMARY

  report-pr-result:
    name: Report E2E result to PR
    needs: [report-pr-start, resolve-profile, e2e-test]
    if: always() && inputs.pr_number != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ needs.report-pr-start.outputs.comment_id }}
          SOPERATOR_BRANCH: ${{ github.ref_name }}
          TERRAFORM_BRANCH: ${{ inputs.terraform_repo_ref || github.ref_name }}
          SOPERATOR_E2E_BRANCH: ${{ inputs.soperator_e2e_repo_branch || 'main' }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          RESOLVED_PROFILE: ${{ needs.resolve-profile.outputs.profile_name }}
          RUN_UNSTABLE_TESTS: ${{ inputs.run_unstable_tests || 'false' }}
          RUN_ESSENTIAL_TESTS: ${{ inputs.run_essential_tests || 'false' }}
          RESOLVE_RESULT: ${{ needs.resolve-profile.result }}
          E2E_RESULT: ${{ needs.e2e-test.result }}
          ACCEPTANCE_OUTCOME: ${{ needs.e2e-test.outputs.acceptance_outcome }}
          ACCEPTANCE_REPORT_AVAILABLE: ${{ needs.e2e-test.outputs.acceptance_report_available }}
          ACCEPTANCE_SUMMARY: ${{ needs.e2e-test.outputs.acceptance_summary }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            | jq '{jobs: [.[].jobs[]]}' > /tmp/e2e-jobs.json
          printf '%s\n' "$ACCEPTANCE_SUMMARY" > /tmp/acceptance-comment.md
          python3 .github/scripts/e2e_pr_comment.py final \
            --jobs /tmp/e2e-jobs.json \
            --acceptance-summary /tmp/acceptance-comment.md \
            > /tmp/e2e-pr-comment.md

          comment_id="$COMMENT_ID"
          if [[ -z "$comment_id" ]]; then
            marker="<!-- soperator-e2e-run:${GITHUB_RUN_ID} -->"
            comment_id=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              | jq -r --arg marker "$marker" \
                '[.[][] | select(.body | contains($marker))][0].id // empty')
          fi

          payload=$(jq --null-input --rawfile body /tmp/e2e-pr-comment.md '{body: $body}')
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input - <<<"$payload"
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input - <<<"$payload"
          fi

  notify-failure:
    name: Notify Slack on E2E failure
    needs: [resolve-profile, e2e-test]
    # Only fire when the run targeted the default terraform branch (empty input
    # falls back to github.ref_name in e2e-test) and default Soperator E2E
    # branch. Custom branches are usually experiments and shouldn't page e2e
    # owners on failure.
    if: |
      always() &&
      (needs.resolve-profile.result == 'failure' || needs.e2e-test.result == 'failure') &&
      (github.ref_name == 'main' || startsWith(github.ref_name, 'soperator-release-')) &&
      (inputs.terraform_repo_ref == '' || inputs.terraform_repo_ref == github.ref_name) &&
      (inputs.soperator_e2e_repo_branch == '' || inputs.soperator_e2e_repo_branch == 'main')
    runs-on: ubuntu-latest
    environment: e2e
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          PROFILE: ${{ needs.resolve-profile.outputs.profile_name || inputs.profile }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ "$RUN_ATTEMPT" -gt 1 ]]; then
            RUN_URL+="/attempts/${RUN_ATTEMPT}"
          fi

          # Use top-level `text` (not `attachments`) so the Slack MCP plugin
          # can read the body — see slackapi/slack-mcp-plugin#24. This trades
          # the red side bar (an attachments-only feature) for triage-bot
          # readability, which we care about more.
          payload=$(jq --null-input \
            --arg branch "$BRANCH" \
            --arg profile "$PROFILE" \
            --arg run_url "$RUN_URL" \
            --arg runbook_url "https://nebius.atlassian.net/wiki/spaces/SCHED/pages/998015487/E2E+Runbook" \
            '{
              text: (
                ":warning: *E2E Test Failure*\n"
                + "<\($run_url)|Workflow> | <\($runbook_url)|Runbook>\n"
                + "Branch: `\($branch)`\n"
                + "Profile: `\($profile)`"
              )
            }')

          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$payload"
