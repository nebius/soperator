name: Ansible Lint

permissions:
  contents: read

on:
  # Plain pull_request: this job needs no secrets, so fork PRs can run it untrusted
  # instead of being checked out in the base repository's context.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "CODEOWNERS"
      - "LICENSE"
      - "PROJECT"
      - "README.md"
      - "SECURITY.md"
      - "pkg/valuesgen/**"
      - "Makefile"

jobs:
  lint:
    name: Lint Ansible Playbooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ansible-lint
        run: |
          python -m pip install --upgrade pip
          pip install -r ansible/requirements.txt

      - name: Run ansible-lint
        run: |
          ansible-lint ansible
