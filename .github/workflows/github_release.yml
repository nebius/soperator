# Prepared locally; not installed or dispatched. Requires final requester approval.
name: Restore original 4.1.8 artifacts and metadata

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type restore-4.1.8 after the approved MAN restoration completes
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: restore-original-4.1.8
  cancel-in-progress: false

jobs:
  restore:
    if: github.repository == 'nebius/soperator' && github.ref == 'refs/heads/users/yozel/restore-4.1.8-metadata' && inputs.confirmation == 'restore-4.1.8'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out approved recovery branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Restore exact GHCR manifests and Git metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_CONFIRMATION: ${{ inputs.confirmation }}
        run: python3 .github/workflows/scripts/recovery_ci.py
